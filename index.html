}

/* ═══════════════════ 4 · compare view ═══════════════════ */
function nav(){
  return (typeof subnavHTML==="function"&&typeof S!=="undefined"&&S.portal!=="coach")?subnavHTML():"";
}
const CAP=3;

/* A row is highlightable only where "better" is a fact rather than a
   preference: the lower price (and only when the pricing model is the
   same on every column), the higher rating, the shorter distance.
   Review count, ages, skill, capacity, policy and background-check
   status get no mark — they are differences, not rankings. */
function compareRows(picks){
  const sameModel=picks.every(p=>p.model===picks[0].model);
  return [
    {label:"Price",best:sameModel?"min":null,
     val:p=>Number(p.price),
     cell:p=>`<b class="num">${money(p.price)}</b> <span class="se-dim">${esc(MODEL_LABEL[p.model]||p.model)}</span>`,
     note:sameModel?"":"Prices are not directly comparable — these listings bill on different models."},
    {label:"Pricing model",best:null,val:()=>null,
     cell:p=>esc(MODEL_LABEL[p.model]||p.model)},
    {label:"Rating",best:"max",val:p=>Number(p.rating),
     cell:p=>`<span class="num">${ICON.star} ${esc(String(p.rating))}</span>`},
    {label:"Ratings behind it",best:null,val:()=>null,
     cell:p=>`<span class="num">${esc(String(p.reviews))}</span>`,
     note:"More ratings means firmer evidence, not a better program — no winner is marked."},
    {label:"Ages",best:null,val:()=>null,
     cell:p=>`<span class="num">${esc(String(p.minAge))}–${esc(String(p.maxAge))}</span>`},
    {label:"Skill level",best:null,val:()=>null,cell:p=>esc(p.skill)},
    {label:"Capacity",best:null,val:()=>null,
     cell:p=>{const left=Number(p.cap)-Number(p.enrolled);
       return `<span class="num">${esc(String(p.enrolled))} of ${esc(String(p.cap))} enrolled</span><br>`+
         (left>0?`<span class="pill good">${left} spot${left===1?"":"s"} open</span>`
                :`<span class="pill warn">Full</span>`);}},
    {label:"Distance",best:"min",val:p=>distanceOf(p),
     cell:p=>`<span class="num">${esc(miles(distanceOf(p)))}</span><br><span class="se-dim">from ${esc(ORIGIN.label)}</span>`},
    {label:"Cancellation policy",best:null,val:()=>null,
     cell:p=>esc(POLICY_LABEL[p.cancellationPolicy]||p.cancellationPolicy||"Not published")},
    {label:"Background check",best:null,val:()=>null,
     cell:p=>p.verified===true
       ? `<span class="pill gold">${ICON.shield} Cleared</span>`
       : `<span class="pill warn">${ICON.shield} Pending</span>`},
    {label:"Next available session",best:null,val:()=>null,
     cell:p=>{const n=nextSession(p.id);
       if(n.upcoming) return `<span class="num">${esc(fmtDate(n.slot.date))}</span><br><span class="se-dim">${esc(n.slot.startTime)} ${esc(n.slot.tz||"")}</span>`;
       return `<span class="se-dim">No upcoming session published</span>`+
         (n.slot?`<br><span class="num se-dim">last was ${esc(fmtDate(n.slot.date))}</span>`:"");}},
  ];
}
function bestSet(row,picks){
  if(!row.best) return null;
  const vals=picks.map(row.val).filter(Number.isFinite);
  if(vals.length<2) return null;
  const b=row.best==="min"?Math.min.apply(null,vals):Math.max.apply(null,vals);
  if(vals.every(v=>v===b)) return null;      /* no differentiation to report */
  return b;
}
function compareView(){
  ensure();
  const picks=compareIds().slice(0,CAP).map(prog).filter(Boolean);
  const head=`${nav()}<main class="shell" style="padding-bottom:72px">
    <div class="sec-head"><div>
      <h1>Compare</h1>
      <p class="se-lede" style="margin-top:6px">Up to ${CAP} programs, row by row, on the data each
        provider publishes. A row is only marked when "better" is a fact.</p>
    </div><button class="btn ghost sm" data-nav="explore">Back to Explore</button></div>`;

  if(!picks.length) return head+`<div class="empty">
      <h2>Nothing selected yet</h2>
      <p style="margin-top:8px">Use the Compare button on any program card to add it here. Three at a time.</p>
      <button class="btn" data-nav="explore" style="margin-top:20px">Browse programs</button>
    </div></main>`;

  const rows=compareRows(picks);
  const cols=picks.length;
  return head+`
    <div class="tblwrap se-cmpwrap">
      <table class="tbl se-cmp">
        <caption class="se-sr">Side-by-side comparison of ${cols} program${cols===1?"":"s"}</caption>
        <thead><tr>
          <th scope="col"><span class="se-sr">Attribute</span></th>
          ${picks.map(p=>`<th scope="col" class="se-col">
            <span class="pill" style="background:${sportColor(p.sport)}1A;color:${sportColor(p.sport)}">${sportGlyph(p.sport)} ${esc(p.sport)}</span>
            <b>${esc(p.title)}</b>
            <span class="se-dim">${esc(p.biz)}</span>
          </th>`).join("")}
        </tr></thead>
        <tbody>
          ${rows.map(r=>{
            const b=bestSet(r,picks);
            return `<tr>
              <th scope="row" class="se-rowlbl">${esc(r.label)}${
                r.note?`<span class="se-rownote">${esc(r.note)}</span>`:""}</th>
              ${picks.map(p=>{
                const v=r.val(p);
                const win=b!=null&&Number.isFinite(v)&&v===b;
                return `<td class="${win?"se-best":""}">${r.cell(p)}${
                  win?`<span class="se-bestmark">${r.best==="min"?(r.label==="Distance"?"Nearest":"Lowest"):"Highest"}</span>`:""}</td>`;
              }).join("")}
            </tr>`;
          }).join("")}
          <tr>
            <th scope="row" class="se-rowlbl">Actions</th>
            ${picks.map(p=>`<td>
              <button class="btn ghost sm" data-open="${esc(p.id)}">View</button>
              <button class="btn ghost sm" data-sedropcmp="${esc(p.id)}" style="margin-top:8px">Remove</button>
            </td>`).join("")}
          </tr>
        </tbody>
      </table>
    </div>
    ${cols<2?`<p class="se-hint" style="margin-top:14px">Add at least one more program to see a comparison.</p>`:""}
    <p class="se-hint" style="margin-top:16px;max-width:78ch">Distances are straight-line miles from
      ${esc(ORIGIN.label)}. Session dates are the ones the provider has published; where a listing has
      nothing on the books, that is what the row says rather than an estimate.</p>
  </main>`;
}

/* ═══════════════════ injected explore toolbar ═══════════════════ */

/* ═══════════════════ wire ═══════════════════ */
let lastModal=null;        /* modal type at the end of the previous render */
let returnFocus=null;      /* selector to hand focus back to when it closes */
let pendingFocus=null;     /* selector to focus once, after this render     */

const $=s=>Array.prototype.slice.call(document.querySelectorAll(s));
const mine=t=>t==="filters"||t==="savesearch";
const openModal=(type,from)=>{returnFocus=from||null;host().modal={type};render();};

/* ── explore toolbar ─────────────────────────────────────────────── */
function injectToolbar(){
  if(document.getElementById("seBar")) return document.getElementById("seBar");
  const anchor=document.querySelector('[data-filter="verified"]');
  if(!anchor||!anchor.parentElement||!anchor.parentElement.parentElement) return null;
  const row=anchor.parentElement;
  const bar=document.createElement("div");
  bar.id="seBar";
  bar.className="se-bar";
  bar.innerHTML=toolbarHTML();
  row.parentElement.insertBefore(bar,row.nextSibling);
  return bar;
}
function injectCompareButtons(grid){
  grid.querySelectorAll(".card").forEach(card=>{
    if(card.querySelector("[data-secmp]")) return;
    const open=card.querySelector("[data-open]");
    if(!open) return;
    const id=open.dataset.open,p=prog(id);
    if(!p) return;
    const on=compareIds().indexOf(id)>=0;
    const b=document.createElement("button");
    b.type="button";
    b.className="se-cmp"+(on?" on":"");
    b.setAttribute("data-secmp",id);
    b.setAttribute("aria-pressed",on?"true":"false");
    b.setAttribute("aria-label",`${on?"Remove":"Add"} ${p.title} ${on?"from":"to"} the comparison`);
    b.textContent=on?"In compare":"Compare";
    card.appendChild(b);
  });
}
/* Show / hide / reorder the host's own card nodes. Never re-creates them,
   so every binding the host attached in its wire() survives. */
function repaintGrid(bar){
  const main=bar.parentElement;
  const grid=main.querySelector(".grid");
  if(!grid) return {kept:0,base:0};
  injectCompareButtons(grid);

  const cards=Array.prototype.slice.call(grid.querySelectorAll(".card"));
  const byId=new Map(),order=[];
  cards.forEach(c=>{
    const o=c.querySelector("[data-open]");
    if(o&&o.dataset.open&&!byId.has(o.dataset.open)){byId.set(o.dataset.open,c);order.push(o.dataset.open);}
  });
  const base=order.map(prog).filter(Boolean);
  const kept=applyAdvanced(base);
  const keepIds=new Set(kept.map(p=>p.id));

  byId.forEach((el,id)=>{el.style.display=keepIds.has(id)?"":"none";});
  kept.forEach(p=>{const el=byId.get(p.id);if(el) grid.appendChild(el);});

  /* empty state, ours, kept out of the grid so it never gets reordered */
  const old=document.getElementById("seEmpty");
  if(!kept.length&&base.length){
    if(!old){
      const d=document.createElement("div");
      d.id="seEmpty";
      d.className="empty";
      d.innerHTML=`<h3>No programs match those filters</h3>
        <p style="margin-top:6px">${esc(String(base.length))} program${base.length===1?"":"s"} match the sport and
          quick filters, but none clear the advanced filters on top.</p>
        <button type="button" class="btn ghost sm" data-seclearall="1" style="margin-top:18px">Clear advanced filters</button>`;
      grid.parentElement.insertBefore(d,grid.nextSibling);
    }
  } else if(old&&old.parentElement){ old.parentElement.removeChild(old); }

  /* keep the host's own "N of M programs" line truthful */
  if(activeCount()){
    const host_count=bar.previousElementSibling&&bar.previousElementSibling.querySelector("span.num");
    if(host_count) host_count.textContent=`${kept.length} of ${catalogue().length} programs`;
  }
  return {kept:kept.length,base:base.length};
}
function paintLive(counts){
  const el=document.getElementById("seLive");
  if(!el) return;
  const a=adv(),n=activeCount();
  el.textContent=`${counts.kept} of ${counts.base} shown · sorted by ${SORT_LABEL[a.sort]||a.sort}`+
    (n?` · ${n} advanced filter${n===1?"":"s"}`:"");
}

/* ── filters-modal painting, in place (no render on drag or keystroke) ── */
function paintModal(){
  const a=adv(),{lo,hi}=priceBounds();
  const loEl=document.getElementById("sePriceLo");
  const hiEl=document.getElementById("sePriceHi");
  const fill=document.getElementById("sePriceFill");
  const val=document.getElementById("sePriceVal");
  if(loEl&&hiEl){
    const pmin=Number(loEl.value),pmax=Number(hiEl.value);
    loEl.setAttribute("aria-valuenow",String(pmin));
    hiEl.setAttribute("aria-valuenow",String(pmax));
    loEl.setAttribute("aria-valuetext",`Minimum ${money(pmin)}`);
    hiEl.setAttribute("aria-valuetext",`Maximum ${money(pmax)}`);
    if(fill){
      const span=hi-lo||1;
      fill.style.left=((pmin-lo)/span*100).toFixed(2)+"%";
      fill.style.right=((hi-pmax)/span*100).toFixed(2)+"%";
    }
    if(val) val.textContent=(a.priceMin==null&&a.priceMax==null)
      ? `Full catalogue range, ${money(lo)} to ${money(hi)}`
      : `${money(pmin)} to ${money(pmax)}`;
  }
  paintClears();
  const n=matchCount(),total=baseList().length;
  const c=document.getElementById("seCount");
  if(c) c.textContent=`${n} of ${total} program${total===1?"":"s"} match`;
  const ap=document.getElementById("seApply");
  if(ap) ap.textContent=n?`Show ${n} program${n===1?"":"s"}`:"Show results";
}
function paintClears(){
  const a=adv();
  const on={
    price:a.priceMin!=null||a.priceMax!=null,
    age:a.age!=null,
    skill:a.skill.length>0,
    models:a.models.length>0,
    distance:a.distance!=null,
    minRating:a.minRating!=null,
    availDays:a.availDays!=null,
    flags:a.bgOnly||a.openOnly,
  };
  $("[data-seclear]").forEach(b=>{
    const k=b.dataset.seclear;
    if(k in on) b.classList.toggle("hide",!on[k]);
  });
}
function clearGroup(k){
  const a=adv();
  if(k==="price"){a.priceMin=null;a.priceMax=null;}
  else if(k==="flags"){a.bgOnly=false;a.openOnly=false;}
  else if(k==="skill"||k==="models") a[k]=[];
  else a[k]=null;
}
function clearAll(){
  const a=adv(),sort=a.sort;
  Object.keys(DEFAULT_ADV).forEach(k=>{a[k]=clone(DEFAULT_ADV[k]);});
  a.sort=sort;                          /* sort is a view choice, not a filter */
}

/* ── focus trap ──────────────────────────────────────────────────── */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapFocus(modal){
  modal.onkeydown=e=>{
    if(e.key!=="Tab") return;
    const els=Array.prototype.slice.call(modal.querySelectorAll(FOCUSABLE))
      .filter(el=>el.offsetWidth>0||el.offsetHeight>0||el===document.activeElement);
    if(!els.length) return;
    const first=els[0],last=els[els.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
}

function wire(){
  ensure();
  const h=host();
  const modalType=(h.modal&&h.modal.type)||null;

  /* ── explore toolbar + grid ── */
  const bar=injectToolbar();
  if(bar){
    const counts=repaintGrid(bar);
    paintLive(counts);

    const sort=document.getElementById("seSort");
    if(sort) sort.onchange=()=>{adv().sort=sort.value;pendingFocus="#seSort";render();};

    $("[data-sefilters]").forEach(b=>b.onclick=()=>openModal("filters","[data-sefilters]"));
    $("[data-sesave]").forEach(b=>b.onclick=()=>openModal("savesearch","[data-sesave]"));
    $("[data-secompare]").forEach(b=>b.onclick=()=>{h.route={name:"compare",arg:null};window.scrollTo(0,0);render();});
    $("[data-secmpclear]").forEach(b=>b.onclick=()=>{h.compareIds=[];render();toast("Compare cleared");});

    $("[data-secmp]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.secmp,p=prog(id);
      const ids=compareIds();
      if(ids.indexOf(id)>=0){h.compareIds=ids.filter(x=>x!==id);}
      else if(ids.length>=CAP){toast(`Compare holds ${CAP} programs — remove one first`);return;}
      else h.compareIds=ids.concat([id]);
      pendingFocus=`[data-secmp="${id}"]`;
      render();
      if(p&&compareIds().indexOf(id)>=0) toast(`${p.title} added to compare`);
    });
  }

  /* ── saved searches (toolbar and modal share the hooks) ── */
  $("[data-seuse]").forEach(b=>b.onclick=()=>{
    const s=saved().find(x=>x.id===b.dataset.seuse);
    if(!s) return;
    const snap=s.snapshot||{};
    h.sport=snap.sport==null?null:snap.sport;
    h.query=snap.query||"";
    if(snap.filters) h.filters={maxPrice:snap.filters.maxPrice,verifiedOnly:!!snap.filters.verifiedOnly,model:snap.filters.model||null};
    h.adv=clone(Object.assign(clone(DEFAULT_ADV),snap.adv||{}));
    h.modal=null;
    h.route={name:"explore",arg:null};
    render();
    toast(`Applied "${s.name}"`);
  });
  $("[data-sedrop]").forEach(b=>b.onclick=()=>{
    const s=saved().find(x=>x.id===b.dataset.sedrop);
    h.savedSearches=saved().filter(x=>x.id!==b.dataset.sedrop);
    render();
    if(s) toast(`Deleted "${s.name}"`);
  });
  $("[data-sedropcmp]").forEach(b=>b.onclick=()=>{
    h.compareIds=compareIds().filter(x=>x!==b.dataset.sedropcmp);
    render();
  });

  /* ── clear buttons (a click, so a full render is fine) ── */
  $("[data-seclear]").forEach(b=>b.onclick=()=>{
    clearGroup(b.dataset.seclear);
    pendingFocus=modalType==="filters"?"#seApply":null;
    render();
  });
  $("[data-seclearall]").forEach(b=>b.onclick=()=>{
    clearAll();
    pendingFocus=modalType==="filters"?"[data-seclearall]":null;
    render();
    toast("Advanced filters cleared");
  });

  /* ── filters modal, repainted in place ── */
  if(modalType==="filters"){
    const a=adv(),{lo,hi}=priceBounds();
    const loEl=document.getElementById("sePriceLo");
    const hiEl=document.getElementById("sePriceHi");
    const slide=()=>{
      if(!loEl||!hiEl) return;
      let pmin=Number(loEl.value),pmax=Number(hiEl.value);
      if(pmin>pmax){ if(document.activeElement===loEl){pmax=pmin;hiEl.value=String(pmax);} else {pmin=pmax;loEl.value=String(pmin);} }
      a.priceMin=pmin<=lo?null:pmin;
      a.priceMax=pmax>=hi?null:pmax;
      paintModal();
    };
    if(loEl){loEl.oninput=slide;loEl.onchange=slide;}
    if(hiEl){hiEl.oninput=slide;hiEl.onchange=slide;}

    const age=document.getElementById("seAge");
    if(age) age.oninput=()=>{
      const v=age.value.trim();
      const n=Number(v);
      a.age=(v===""||!Number.isFinite(n))?null:Math.round(n);
      paintModal();
    };
    $("[data-seskill]").forEach(el=>el.onchange=()=>{
      const v=el.dataset.seskill;
      a.skill=el.checked?a.skill.concat([v]).filter((x,i,arr)=>arr.indexOf(x)===i):a.skill.filter(x=>x!==v);
      paintModal();
    });
    $("[data-semodel]").forEach(el=>el.onchange=()=>{
      const v=el.dataset.semodel;
      a.models=el.checked?a.models.concat([v]).filter((x,i,arr)=>arr.indexOf(x)===i):a.models.filter(x=>x!==v);
      paintModal();
    });
    const dist=document.getElementById("seDistance");
    if(dist) dist.onchange=()=>{a.distance=dist.value===""?null:Number(dist.value);paintModal();};
    $("[data-serating]").forEach(el=>el.onchange=()=>{
      a.minRating=el.value===""?null:Number(el.value);paintModal();});
    $("[data-seavail]").forEach(el=>el.onchange=()=>{
      a.availDays=el.value===""?null:Number(el.value);paintModal();});
    $("[data-sebg]").forEach(el=>el.onchange=()=>{a.bgOnly=el.checked;paintModal();});
    $("[data-seopen]").forEach(el=>el.onchange=()=>{a.openOnly=el.checked;paintModal();});
    $("[data-seapply]").forEach(b=>b.onclick=()=>{h.modal=null;render();});
    paintModal();
  }

  /* ── save-search form ── */
  const sf=document.getElementById("seSaveForm");
  if(sf) sf.onsubmit=e=>{
    e.preventDefault();
    const err=document.getElementById("seSaveErr");
    const show=m=>{if(err){err.textContent=m;err.classList.remove("hide");}};
    const name=String((new FormData(sf)).get("name")||"").trim();
    if(name.length<2) return show("Give the search a name you'll recognise later.");
    if(saved().some(s=>s.name.toLowerCase()===name.toLowerCase()))
      return show("You already have a saved search with that name.");
    const a=adv();
    h.savedSearches=[{
      id:"ss_"+Date.now(),name,at:TODAY,
      time:new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),
      count:matchCount(),
      snapshot:{
        sport:h.sport||null,
        query:h.query||"",
        filters:h.filters?{maxPrice:h.filters.maxPrice,verifiedOnly:!!h.filters.verifiedOnly,model:h.filters.model||null}:null,
        adv:clone(a),
      },
    }].concat(saved());
    h.modal=null;
    render();
    toast(`Saved "${name}"`);
  };

  /* ── modal focus: trap on open, hand it back on close ── */
  const scrimModal=document.querySelector(".scrim .modal");
  if(mine(modalType)&&scrimModal){
    trapFocus(scrimModal);
    if(!mine(lastModal)){                              /* just opened */
      const first=scrimModal.querySelector(FOCUSABLE);
      if(first) first.focus();
    }
  }
  if(mine(lastModal)&&!mine(modalType)&&returnFocus){
    const back=document.querySelector(returnFocus);
    if(back) back.focus();
    returnFocus=null;
  }
  if(pendingFocus){
    const el=document.querySelector(pendingFocus);
    if(el) el.focus();
    pendingFocus=null;
  }
  lastModal=modalType;

    return { field: "dob", msg: "Coaches on Sporve have to be 18 or older. That date of birth makes you " + age + "." };
  if (age > 100)
    return { field: "dob", msg: "That date of birth reads as " + age + " years old. Check it." };
  if (isBlank(d.ssn4))
    return { field: "ssn4", msg: "Enter the last four digits of your SSN. It is what separates you from someone with your name." };
  if (!/^\d{4}$/.test(trim(d.ssn4)))
    return { field: "ssn4", msg: "That has to be exactly four digits — the last four, not the whole number." };
  if (!d.consent)
    return { field: "consent", msg: "Sporve cannot run a background check on you without your consent. Tick the box to authorize it." };
  return null;
}
function checkReview(d){
  for (let i = 0; i < LAST; i++){
    const e = checkStep(i, d);
    if (e) return { field: "step-" + i, msg: STEPS[i][0] + " is not finished: " + e.msg };
  }
  return null;
}
const CHECKS = [checkIdentity, checkSports, checkServices, checkPricing, checkAvailability, checkBackground, checkReview];
function checkStep(i, d){
  const fn = CHECKS[i];
  return fn ? fn(d || draft()) : null;
}
/* the lowest step still holding a problem — the furthest the rail may jump */
function firstOpen(d){
  for (let i = 0; i < LAST; i++) if (checkStep(i, d)) return i;
  return LAST;
}
const stepDone = (i, d) => i < LAST && !checkStep(i, d);
/* a step is reachable once everything before it is clean */
const reachable = (i, d) => i <= firstOpen(d);

function railHTML(d){
  const open = firstOpen(d);
  return `<nav class="cob-rail" aria-label="Coach onboarding progress">
    <ol>
      ${STEPS.map((st, i) => {
        const cur = i === d.step, done = stepDone(i, d), can = i <= open;
        const status = cur ? "Current step" : done ? "Complete" : can ? "Not started" : "Locked";
        const label = "Step " + (i + 1) + " of " + STEPS.length + ", " + st[0] + " — " +
          (cur ? "current step" : done ? "complete" : can ? "not started" : "finish the earlier steps first");
        return `<li class="cob-stepitem ${cur ? "on" : ""} ${done ? "done" : ""}" ${cur ? 'aria-current="step"' : ""}>
          <button class="cob-steplink" data-cob-step="${i}" ${can ? "" : "disabled"} aria-label="${esc(label)}">
            <span class="cob-dot ${done ? "" : "num"}" aria-hidden="true">${done ? ICON.check : (i + 1)}</span>
            <span class="cob-steptxt"><b>${esc(st[0])}</b><span>${esc(status)}</span></span>
          </button></li>`;
      }).join("")}
    </ol>
    <p class="cob-railfoot"><span class="num">${open}</span> of <span class="num">${LAST}</span> steps complete.
      Nothing is submitted until the last step, and your answers stay put if you jump back.</p>
  </nav>`;
}

function backgroundStep(d, err){
  const age = ageFrom(d.dob);
  return `
  <div class="cob-truth">
    <h4>${ICON.shield} What this check is, and what it is not</h4>
    <p><b>It runs on a person, not on a business.</b> The screening partner checks the individual named above —
      an identity match, then criminal and sex-offender registry records.</p>
    <p><b>An approved business never vouches for an individual.</b>
      ${esc(SEED.providerProfile.businessName)} is an approved business on Sporve, and every single coach working
      under it still clears their own check. Being invited by an approved academy grants nothing.</p>
    <p><b>You cannot mark yourself as checked.</b> This form collects consent and identifiers.

  </div>

  <div class="cob-lock">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

    Sporve stores the last four digits only — never a full Social Security number.</p>

}

/* ── review ──────────────────────────────────────────────────────── */
function line(label, value){
  return `<div class="linerow"><span>${esc(label)}</span><span><b>${value}</b></span></div>`;
}
function rbHead(title, step){
  return `<div class="cob-rbhead"><h4>${esc(title)}</h4>
    <button class="btn ghost sm" data-cob-step="${step}"
      aria-label="Edit ${esc(title)} — back to step ${step + 1}">Edit</button></div>`;
}
function reviewStep(d, err){
  const priced = d.services.filter(s => !isBlank(s.price) && isFinite(Number(s.price)));
  const gross = priced.reduce((t, s) => t + Number(s.price), 0);
  const fee = priced.reduce((t, s) => t + feeOn(s.price), 0);
  const bgSteps = [["Consent given", !!d.consent], ["Submitted to partner", false],
    ["Screening", false], ["Result", false]];
  return `
  <div class="cob-rb">
    ${rbHead("Identity", 0)}
    ${line("Legal name", esc(d.legalName))}
    ${line("Business name", esc(d.businessName))}
    ${line("Phone", `<span class="num">${esc(d.phone)}</span>`)}
    ${line("Based in", esc(trim(d.city) + ", " + trim(d.region)))}
    ${line("Years coaching", `<span class="num">${esc(d.years)}</span>`)}
  </div>

  <div class="cob-rb">
    ${rbHead("Sports", 1)}
    <div class="cob-chips" style="margin:8px 0 2px">
      ${d.sports.map(s => `<span class="pill" style="background:${sportColor(s)}1A;color:${sportColor(s)}">${sportGlyph(s)} ${esc(s)}</span>`).join("")}
    </div>
  </div>

  <div class="cob-rb">
    ${rbHead("Services & capacity", 2)}
    ${d.services.map((s, i) => `
      ${line("Service " + (i + 1), esc(s.name))}
      <div class="linerow" style="padding-top:0"><span style="color:var(--faint)">&nbsp;</span>
        <span class="num" style="color:var(--muted)">${esc(svcSummary(s))}</span></div>`).join("")}
  </div>

  <div class="cob-rb">
    ${rbHead("Pricing", 3)}
    ${d.services.map(s => line(s.name || "Untitled service",
      `<span class="num">${money(Number(s.price))}</span> <span style="font-weight:500;color:var(--muted)">${esc(MODEL_UNIT[s.model] || s.model)}</span>`)).join("")}
    <div class="linerow"><span>Platform fee <span class="num">(9%)</span> across one of each</span>
      <span class="num">−${money(fee)}</span></div>
    <div class="linerow total"><span>You keep</span><span class="num">${money(gross - fee)}</span></div>
  </div>

  <div class="cob-rb">
    ${rbHead("Availability", 4)}
    ${line("Days", esc(d.days.map(wdLong).join(", ")))}
    ${line("Window", `<span class="num">${esc(t12(d.startTime))} – ${esc(t12(d.endTime))}</span>`)}
  </div>

  <div class="cob-rb">
    ${rbHead("Background check", 5)}
    ${line("Date of birth", `<span class="num">${esc(prettyDate(d.dob))}</span>`)}
    ${line("SSN", `<span class="num">••• •• ${esc(trim(d.ssn4))}</span>`)}
    ${line("Consent", d.consent ? "Given" : "Not given")}
    ${line("Status", `<span class="pill warn">Pending</span>`)}
    <div class="track" aria-label="Background check progress">
      ${bgSteps.map(([l, done], i) => `<div class="step ${done ? "done" : ""}">
        <span class="dot">${done ? ICON.check : ""}</span><span class="lbl">${esc(l)}</span>
        ${i < bgSteps.length - 1 ? '<span class="bar"></span>' : ""}</div>`).join("")}
    </div>
  </div>

  <div class="cob-lock">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <p>Submitting creates your coach profile and <span class="num">${d.services.length}</span>
      draft listing${d.services.length === 1 ? "" : "s"}. The profile is created <b>unverified</b>,
      the check is created <b>pending</b>, and the listings are created <b>drafts</b> — unpublished,
      unbookable, and invisible to families until the check clears.</p>
  </div>
  ${isVerified() ? "" : `<p class="cob-help">You are not signed in, so this application is held in this
    session only. Sign in before submitting if you want it kept against your account.</p>`}`;
}

const STEP_VIEW = [identityStep, sportsStep, servicesStep, pricingStep, availabilityStep, backgroundStep, reviewStep];

/* ── the submitted state — the wizard does not offer a second submit ── */
function submittedHTML(d){
  const p = d.profile || {};
  return `<main class="shell cob-page">
    <div class="cob-top">
      <p class="eyebrow">Coach onboarding</p>
      <h1>Application submitted</h1>
      <p class="cob-lede">${esc(p.businessName || d.businessName)} is on file. Nothing about it is live yet —

    <div class="cob-card" style="max-width:760px">

      <div class="linerow"><span>Background check</span><span><b><span class="pill warn">${esc(p.backgroundCheck || "pending")}</span></b></span></div>
      <div class="linerow"><span>Verification</span><span><b><span class="pill slate">${esc(p.verification || "unverified")}</span></b></span></div>

/* ═══════════════════ THE VIEW ═══════════════════ */
function onboardView(){
  const d = draft();
  if (d.submittedAt) return submittedHTML(d);

  const i = d.step;
  const err = checkStep(i, d);
  const last = i === LAST;
  const st = STEPS[i];

  return `<main class="shell cob-page">
    <div class="cob-top">
      <p class="eyebrow">Coach onboarding · step <span class="num">${i + 1}</span> of <span class="num">${STEPS.length}</span></p>
      <h1>Get set up to coach on Sporve</h1>
      <p class="cob-lede">Seven steps. Everything you enter is a claim about your own business —
        verification is decided elsewhere, and this form cannot grant it.</p>
    </div>

    <div class="cob-grid">
      ${railHTML(d)}
      <div>
        <section class="cob-card" aria-label="${esc(st[1])}">
          <div class="cob-head"><h2>${esc(st[1])}</h2><p>${esc(st[2])}</p></div>
          ${STEP_VIEW[i](d, err)}
          <div class="cob-nav">
            <button class="btn ghost" data-cob-back="1" ${i === 0 ? "disabled" : ""}>Back</button>
            <div class="err ${err ? "" : "hide"}" data-cob-err role="alert">${err ? esc(err.msg) : ""}</div>
            <button class="btn" data-cob-next="1" ${err ? "disabled" : ""}>${last ? "Submit application" : "Continue"}</button>
          </div>
        </section>
      </div>
    </div>
  </main>`;
}

/* ═══════════════════ MODAL ═══════════════════ */
const wrap = (title, body) =>
  `<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><b>${esc(title)}</b><button class="x" data-close="1" aria-label="Close">${ICON.x}</button></div>
    <div class="modal-body">${body}</div></div></div>`;

function verifyIdModal(){
  const d = draft();
  const rows = [
    ["Identity match", "Your legal name, date of birth, and the last four SSN digits are matched against public identity records. A name alone is not enough to identify a person."],
    ["Criminal records search", "County, state, and federal records across every jurisdiction tied to your address history."],
    ["Sex offender registry", "The national registry, plus every state registry."],
    ["Ongoing monitoring", "The check is re-run periodically. Verification is a state you keep, not a badge you earn once."],
  ];
  return wrap("What gets checked", `
    <p style="color:var(--muted);margin-bottom:18px">Run by Sporve's screening partner on
      <b style="color:var(--ink)">${esc(d.legalName || "the individual coach")}</b> — the person, not the business.</p>
    ${rows.map(([h, b]) => `<div class="linerow" style="display:block">
      <b style="display:block;color:var(--ink)">${esc(h)}</b>
      <span style="display:block;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:3px">${esc(b)}</span>
    </div>`).join("")}
    <div class="panel" style="background:var(--warn-tint);border:0;margin-top:18px">
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55">
        Three things this form can never do: mark you verified, approve your business, or publish a listing.
        Those are written by Sporve after the partner returns a result — which is why every field on the
        previous step is stored as <span class="num">pending</span> no matter what you type.</p>
    </div>
    <div class="panel" style="background:var(--raise);border:0;margin-top:12px">
      <div class="eyebrow">Cost and timing</div>
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:8px">
        Sporve pays for the check. Results usually return in 2–5 business days; a record that needs a
        court clerk to confirm it can take longer.</p>
    </div>
    <button class="btn wide" data-close="1" style="margin-top:18px">Back to the form</button>`);
}

/* ═══════════════════ SUBMIT ═══════════════════
   The single write path. Note what it does NOT read: there is no input on
   any step that can reach status, verification, or backgroundCheck. They
   are literals. */
function submitApplication(){
  const d = draft();
  const bad = checkReview(d);
  if (bad){
    d.step = Number(String(bad.field).split("-")[1]) || 0;
    render();
    toast("Fix " + STEPS[d.step][0].toLowerCase() + " before submitting");
    return false;
  }

  const now = new Date().toISOString();
  const location = trim(d.city) + ", " + trim(d.region);

  /* profile — created unverified and pending, always */
  d.profile = {
    id: "provider_" + Date.now(),
    legalName: trim(d.legalName),
    businessName: trim(d.businessName),
    phone: trim(d.phone),
    location: location,
    yearsCoaching: intOf(d.years),
    sports: d.sports.slice(),
    bio: "",
    availability: { days: d.days.slice(), start: d.startTime, end: d.endTime },
    status: "pending",              // never "approved"
    verification: "unverified",     // never "verified"
    backgroundCheck: "pending",     // never "clear"
    backgroundConsentAt: d.consent ? now : null,
    onboardingCompleted: true,
    stripeAccountId: null,
    submittedAt: now,
  };

  /* services → draft listings. They are deliberately NOT pushed into
     PROGRAMS or S.listings: everything the family side reads comes from
     PROGRAMS, so a draft that never lands there cannot be searched,
     mapped, recommended, or booked. That is the lock, in one decision. */
  d.drafts = d.services.map((s, i) => ({
    id: "draft_" + Date.now() + "_" + (i + 1),
    providerId: d.profile.id,
    biz: d.profile.businessName,
    title: trim(s.name),
    sport: d.sports[0] || null,
    sports: d.sports.slice(),
    format: s.format,
    cap: intOf(s.capacity),
    enrolled: 0,
    minutes: intOf(s.minutes),
    price: Number(trim(s.price)),
    model: s.model,
    netPerSale: netOf(Number(trim(s.price))),
    availability: { days: d.days.slice(), start: d.startTime, end: d.endTime },
    status: "draft",                // never "published"
    published: false,
    visible: false,
    bookable: false,
    verified: false,                // never true
    createdAt: now,
  }));

  d.submittedAt = now;

  S.portal = "coach";
  S.coachTab = "dashboard";
  S.route = { name: "dashboard", arg: null };
  S.modal = null;
  if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
  render();
  toast("Application submitted — background check pending, listings held as drafts");
  return true;
}

/* ═══════════════════ IN-PLACE REPAINT ═══════════════════
   The host re-renders the whole DOM on every state change, which would
   take the caret with it. So a keystroke updates state and then repaints
   only the nodes that depend on it: the error line, the Continue button,
   the per-service take-home figures, and the field outlines. */
function sync(){
  if (typeof document === "undefined") return;
  const d = draft();
  if (d.submittedAt) return;
  const err = checkStep(d.step, d);

  const box = document.querySelector("[data-cob-err]");
  if (box){
    box.textContent = err ? err.msg : "";
    if (err) box.classList.remove("hide"); else box.classList.add("hide");
  }
  const next = document.querySelector("[data-cob-next]");
  if (next) next.disabled = !!err;

  document.querySelectorAll("[data-cob-field]").forEach(el => {
    el.classList.toggle("cob-bad", !!err && err.field === el.dataset.cobField);
  });

  const pc = document.querySelector("[data-cob-phonecount]");
  if (pc) pc.textContent = String(phoneDigits(d.phone));

  const dc = document.querySelector("[data-cob-daycount]");
  if (dc) dc.textContent = String(d.days.length);

  d.services.forEach(s => {
    const sum = document.querySelector('[data-cob-svcsum="' + s.id + '"]');
    if (sum) sum.textContent = svcSummary(s);
    const net = document.querySelector('[data-cob-net="' + s.id + '"]');
    if (net){
      const p = isBlank(s.price) ? null : Number(trim(s.price));
      const ok = p != null && isFinite(p) && p >= 0;
      net.textContent = ok ? money(netOf(p)) : "—";
      const cap = net.parentNode && net.parentNode.querySelector ? net.parentNode.querySelector("span") : null;
      if (cap) cap.textContent = ok ? "you keep, after " + money(feeOn(p)) + " fee" : "you keep — enter a price";
    }
  });

  const priced = d.services.filter(s => !isBlank(s.price) && isFinite(Number(trim(s.price))) && Number(trim(s.price)) >= 0);
  const gross = priced.reduce((t, s) => t + Number(trim(s.price)), 0);
  const fee = priced.reduce((t, s) => t + feeOn(trim(s.price)), 0);
  const g = document.querySelector("[data-cob-gross]"); if (g) g.textContent = money(gross);
  const f = document.querySelector("[data-cob-fee]"); if (f) f.textContent = "−" + money(fee);
  const n = document.querySelector("[data-cob-nettotal]"); if (n) n.textContent = money(gross - fee);

  const sp = document.querySelector("[data-cob-span]");
  if (sp){
    const a = toMin(d.startTime), b = toMin(d.endTime);
    sp.textContent = isFinite(a) && isFinite(b) && b > a ? durLabel(b - a) : "—";
  }
}

/* ═══════════════════ WIRING ═══════════════════ */
function goStep(i){
  const d = draft();
  const target = Math.max(0, Math.min(LAST, i));
  if (target > d.step && !reachable(target, d)) return;
  d.step = target;
  if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
  render();
}

function wire(){
  if (typeof document === "undefined") return;
  const q = s => document.querySelectorAll(s);
  const d = draft();

  /* rail + every "Edit" affordance on the review step */
  q("[data-cob-step]").forEach(b => b.onclick = () => goStep(Number(b.dataset.cobStep)));
  q("[data-cob-back]").forEach(b => b.onclick = () => goStep(draft().step - 1));
  q("[data-cob-next]").forEach(b => b.onclick = () => {
    const cur = draft();
    const err = checkStep(cur.step, cur);
    if (err){ sync(); return; }              // belt and braces: the button is already disabled
    if (cur.step === LAST){ submitApplication(); return; }
    goStep(cur.step + 1);
  });
  q("[data-cob-dash]").forEach(b => b.onclick = () => {
    S.portal = "coach"; S.coachTab = "dashboard"; S.route = { name: "dashboard", arg: null };
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
    render();
  });

  /* plain draft fields — typed into, so repainted in place, never re-rendered */
  q("[data-cob-in]").forEach(el => el.oninput = () => {
    const k = el.dataset.cobIn;
    draft()[k] = el.value;
    sync();
  });

  /* per-service fields, same rule */
  q("[data-cob-svcin]").forEach(el => el.oninput = () => {
    const parts = String(el.dataset.cobSvcin).split("|");
    const s = svc(parts[0]);
    if (!s) return;
    s[parts[1]] = el.value;
    sync();
  });

  /* format radios: capacity follows the format only while it is still the
     format's default, so a number the coach typed is never overwritten */
  q("[data-cob-fmt]").forEach(el => el.onchange = () => {
    const parts = String(el.dataset.cobFmt).split("|");
    const s = svc(parts[0]);
    if (!s) return;
    const wasDefault = Number(s.capacity) === FORMAT_CAP[s.format];
    s.format = parts[1];
    if (wasDefault) s.capacity = FORMAT_CAP[s.format];
    render();
  });
  q("[data-cob-model]").forEach(el => el.onchange = () => {
    const s = svc(el.dataset.cobModel);
    if (!s) return;
    s.model = el.value;
    render();
  });

  q("[data-cob-addsvc]").forEach(b => b.onclick = () => {
    draft().services.push(newService());
    render();
    toast("Service added — name it and set its capacity");
  });
  q("[data-cob-delsvc]").forEach(b => b.onclick = () => {
    const cur = draft();
    if (cur.services.length <= 1) return;          // at least one service, always
    const gone = svc(b.dataset.cobDelsvc);
    cur.services = cur.services.filter(x => x.id !== b.dataset.cobDelsvc);
    render();
    toast("Removed " + ((gone && trim(gone.name)) || "the service"));
  });

  q("[data-cob-sport]").forEach(b => b.onclick = () => {
    const cur = draft(), s = b.dataset.cobSport;
    cur.sports = cur.sports.indexOf(s) >= 0 ? cur.sports.filter(x => x !== s) : cur.sports.concat([s]);
    render();
  });
  q("[data-cob-day]").forEach(b => b.onclick = () => {
    const cur = draft(), k = b.dataset.cobDay;
    const on = cur.days.indexOf(k) >= 0;
    cur.days = on ? cur.days.filter(x => x !== k)
      : WD.map(w => w[0]).filter(x => x === k || cur.days.indexOf(x) >= 0);   // keeps Mon→Sun order
    render();
  });

  q("[data-cob-consent]").forEach(cb => cb.onchange = () => {
    draft().consent = !!cb.checked;
    const label = cb.parentNode;
    if (label && label.classList) label.classList.toggle("on", !!cb.checked);
    sync();
  });

  /* first paint of the step's live figures, in case state arrived pre-filled */
  if (!d.submittedAt) sync();
}

/* ═══════════════════ EXPORT ═══════════════════ */
window.MOD_COACHONBOARD = {
  css: CSS,
  views: { onboard: onboardView },
  modals: { verifyid: verifyIdModal },
  wire: wire,
  state: { onboard: BLANK },
};

})();

</script>
<script>
/* ---- mod-media.js ---- */
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   MOD_MEDIA — the coach's media library, and the consent that governs it.

   Mounts one tab inside the existing coach dash (left rail + body):

/* ── THE GATE ─────────────────────────────────────────────────────
   Everything outbound goes through here. Returns what may happen and,
   when something may not, the reason in the words the coach will see. */
function evaluate(item){
  const ids = (item && item.athleteIds) || [];
  const noun = (item && item.mediaType === "video") ? "clip" : "photo";
  const noneIds = ids.filter(id => consentOf(id) === "none");
  const privIds = ids.filter(id => consentOf(id) === "private_share");

  const v = {
    athleteIds: ids.slice(),
    noneCount: noneIds.length,
    privateCount: privIds.length,
    canShare: true, shareReason: null,
    canPublish: true, publishReason: null,
    blockKind: null,          // "consent" | "untagged" | null
  };

  /* One athlete without consent blocks the whole item — the others in
     the frame do not outvote the child who said no. */
  if (noneIds.length){
    const why = subject(noneIds.length, noun) + " " + hasnt(noneIds.length) +
      " granted any media consent — this " + noun + " can't be sent to a family or published.";
    v.canShare = false; v.shareReason = why;
    v.canPublish = false; v.publishReason = why;
    v.blockKind = "consent";
    return v;
  }
  if (privIds.length){
    v.canPublish = false;
    v.publishReason = subject(privIds.length, noun) + " " + hasnt(privIds.length) +
      " granted profile consent — you can send this to their family, but it can't appear on your public profile.";
    v.blockKind = "consent";
  }

  if (!ids.length){
    v.canShare = false;
    v.shareReason = "No athlete is tagged, so there is no family thread to send this to.";
    if (!v.blockKind) v.blockKind = "untagged";
  }
  return v;
}

  const photos = profilePhotos().length;
  const fac = slotItems("facility").length;
  const act = slotItems("action").length;
  const intro = introItem();
  const need = (have, want) => Math.max(0, want - have);

      next: "Add a coach headshot — it is the first thing a family sees in search." },
    { w: 25, met: introOk(),
      next: intro

    { w: 15, met: act >= RULE.actionMin,

  ];
  const pct = steps.reduce((n, s) => n + (s.met ? s.w : 0), 0);
  const first = steps.filter(s => !s.met)[0];
  return {
    pct: pct,

/* ═══════════════════ TILE RENDERING ═══════════════════ */
/* No image assets exist and nothing may be fetched, so every tile is
   drawn: a gradient in the program's sport colour with the initials of
   whoever is in the frame. */
const PLAY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>';

function initialsOf(text){
  return String(text).trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
}
function tileInitials(it){
  if (it.athleteIds.length){
    const base = initialsOf(athleteName(it.athleteIds[0]));
    return it.athleteIds.length > 1 ? base + " +" + (it.athleteIds.length - 1) : base;
  }
  if (it.slot === "headshot" || it.slot === "intro_video") return initialsOf(SEED.providerProfile.businessName);
  const p = prog(it.programId);
  return p ? initialsOf(p.sport) : "AP";
}
function tileColor(it){
  const p = prog(it.programId);
  return p ? sportColor(p.sport) : "var(--slate)";
}
function tileAlt(it){
  const who = it.athleteIds.length
    ? it.athleteIds.map(athleteName).join(" and ")
    : SEED.providerProfile.businessName;
  return (it.mediaType === "video" ? "Video" : "Photo") + " — " + it.caption + " — " + who +
    ". Shown as a placeholder tile; no image file is stored in this demo.";
}
function placeholder(it){
  return `<div class="md-ph" style="--tc:${tileColor(it)}" role="img" aria-label="${esc(tileAlt(it))}">
    ${it.mediaType === "video"
      ? `<span class="md-play">${PLAY}</span>
         <span class="md-dur num">${esc(String(it.durationSec == null ? "--" : it.durationSec))}s</span>`
      : `<span class="md-ini">${esc(tileInitials(it))}</span>`}
    ${it.published ? `<span class="md-flag">On profile</span>` : ""}
  </div>`;
}

function athletePill(id){
  const k = consentOf(id);
  return `<span class="pill ${consentPill(k)}" title="${esc(consentLabel(k))}">${esc(athleteName(id))}</span>`;
}

function verdictLine(v){
  if (v.blockKind === "consent"){
    return `<p class="md-verdict block">${esc(v.canShare ? v.publishReason : v.shareReason)}</p>`;
  }
  if (!v.canShare && v.shareReason){
    return `<p class="md-verdict">${esc(v.shareReason)}</p>`;
  }
  return `<p class="md-verdict ok">Cleared to send to the family and to publish.</p>`;
}

function itemTile(it){
  const v = evaluate(it);
  const sent = it.sharedWith.length;
  return `<figure class="md-tile">
    ${placeholder(it)}
    <div class="md-body">
      <figcaption class="md-cap">${esc(it.caption)}</figcaption>
      ${it.athleteIds.length ? `<div class="md-tags">${it.athleteIds.map(athletePill).join("")}</div>` : ""}
      ${verdictLine(v)}
      ${sent ? `<p class="md-sent num">Sent to ${esc(countOf(sent, "family thread"))} · ${esc(fmtDate(it.sharedWith[sent - 1].at.slice(0, 10)))}</p>` : ""}
      <div class="md-acts">
        <button class="btn ghost sm" data-md-share="${esc(it.id)}" ${v.canShare ? "" : `disabled aria-disabled="true"`}
          title="${esc(v.canShare ? "Send to the family thread" : v.shareReason)}">Send to family</button>
        ${it.published
          ? `<button class="btn ghost sm" data-md-unpublish="${esc(it.id)}">Remove from profile</button>`
          : `<button class="btn sm" data-md-publish="${esc(it.id)}" ${v.canPublish ? "" : `disabled aria-disabled="true"`}
              title="${esc(v.canPublish ? "Publish to your public profile" : v.publishReason)}">Publish</button>`}
        <button class="x md-del" data-md-del="${esc(it.id)}"
          aria-label="Delete ${esc(it.caption)}">${ICON.x}</button>
      </div>
    </div>
  </figure>`;
}

/* ═══════════════════ VIEWS ═══════════════════ */

function slotCard(sl){
  const items = slotItems(sl.key);
  const have = items.length, short = Math.max(0, sl.need - have);
  const ok = have >= sl.need && (sl.key !== "intro_video" || introOk());
  const hint = sl.key === "intro_video"
    ? (have === 0
        ? `Nothing on file. Sporve asks for ${RULE.introMin}–${RULE.introMax} seconds.`
        : introOk()
          ? `On file — ${items[0].durationSec}s, inside the ${RULE.introMin}–${RULE.introMax} second window.`
          : `On file, but it runs ${items[0].durationSec}s. Sporve asks for ${RULE.introMin}–${RULE.introMax} seconds.`)
    : short === 0
      ? `Complete — ${countOf(have, "on file")}.`
      : `${have} of ${sl.need} on file. Add ${countOf(short, "more")}.`;

  return `<div class="md-slot">
    <div class="md-slothead">
      <h4>${esc(sl.label)}</h4>
      <span class="pill ${ok ? "good" : "warn"} num">${have}/${sl.need}</span>
    </div>
    <p class="md-why">${esc(sl.why)}</p>
    <p class="md-hint ${ok ? "" : "todo"}">${esc(hint)}</p>
    <div class="md-tiles">
      ${items.map(itemTile).join("")}
      <button class="md-add" data-md-upload="${esc(sl.key)}"
        aria-label="Add ${esc(sl.label.toLowerCase())}">+ Add ${esc(sl.format)}</button>
    </div>
  </div>`;
}

function sessionGroups(){
  const used = SESSIONS.filter(s => itemsForSession(s.id).length);
  if (!used.length) return `<div class="md-empty">No session media yet. Anything you capture at a session lands here first.</div>`;
  return used.map(s => {
    const p = prog(s.programId);
    const items = itemsForSession(s.id);
    const blocked = items.filter(i => evaluate(i).blockKind === "consent").length;
    return `<section class="md-group">
      <div class="md-grouphead">
        <div style="min-width:0">
          <b>${esc(s.title)}</b>
          <div class="md-groupmeta num">${esc(fmtDate(s.date))} · ${esc(s.startTime)}${p ? " · " + esc(p.title) : ""}</div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center">
          ${p ? `<span class="pill" style="background:${sportColor(p.sport)}1A;color:${sportColor(p.sport)}">${esc(p.sport)}</span>` : ""}
          <span class="pill slate num">${esc(countOf(items.length, "item"))}</span>
          ${blocked ? `<span class="pill warn num">${blocked} held by consent</span>` : ""}
        </div>
      </div>
      <div class="md-tiles">${items.map(itemTile).join("")}</div>
    </section>`;
  }).join("");
}

function athleteGroups(){
  const used = ROSTER.filter(a => itemsForAthlete(a.id).length);
  if (!used.length) return `<div class="md-empty">No session media is tagged to an athlete yet.</div>`;
  return used.map(a => {
    const items = itemsForAthlete(a.id);
    const k = consentOf(a.id);
    const p = prog(a.programId);
    return `<section class="md-group">
      <div class="md-grouphead">
        <div class="md-who">
          <span class="avatar" style="width:36px;height:36px">${esc(initialsOf(a.name))}</span>
          <div style="min-width:0">
            <b>${esc(a.name)}</b>
            <div class="md-groupmeta num">Age ${a.age == null ? "—" : a.age}${p ? " · " + esc(p.title) : ""}</div>
          </div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center">
          <span class="pill ${consentPill(k)}">${esc(consentLabel(k))}</span>
          <span class="pill slate num">${esc(countOf(items.length, "item"))}</span>
        </div>
      </div>
      <div class="md-tiles">${items.map(itemTile).join("")}</div>
    </section>`;
  }).join("");
}

function mediaView(){
  const st = strength();
  const photos = profilePhotos().length;
  const shortPhotos = Math.max(0, RULE.featurePhotos - photos);
  const cc = consentCounts();
  const sItems = sessionItems();
  const sessionsUsed = SESSIONS.filter(s => itemsForSession(s.id).length).length;
  const held = blockedCount();

  const tiles = [
    ["Profile photos", String(photos), `guideline is ${RULE.featurePhotos}`],
    ["Intro video", introItem() ? introItem().durationSec + "s" : "None", `${RULE.introMin}–${RULE.introMax} seconds`],
    ["Session media", String(sItems.length), `across ${countOf(sessionsUsed, "session")}`],
    ["On your profile", String(publishedCount()), `of ${state.mediaItems.length} in the library`],
  ];

  return `<div class="md-head"><div>
      <h1>Media</h1>
      <p class="md-lede">Your library, and the consent that governs it. Every athlete's parent chooses one of
        three settings, and that choice decides what you may send and what you may publish. Nothing here can
        change a family's answer — only ask for it.</p></div>
    <div class="md-actions">
      <button class="btn ghost" data-modal="consent">Consent roster</button>
      <button class="btn" data-md-upload="new">+ Add media</button>
    </div></div>

  <div class="stats" style="margin-top:16px">
    ${tiles.map(([k, v, d]) => `<div class="stat"><div class="k">${esc(k)}</div>
      <div class="v num">${esc(v)}</div><div class="d num">${esc(d)}</div></div>`).join("")}
  </div>

  <div class="md-meter">
    <div class="md-meterhead">
      <div class="eyebrow">Profile media strength</div>
      <div class="md-pct num">${st.pct}%</div>
    </div>
    <div class="md-bar" role="img" aria-label="Profile media is ${st.pct} percent complete">
      <i style="width:${st.pct}%"></i></div>
    <p class="md-next"><b>Next:</b> ${esc(st.next)}</p>
  </div>

  ${held ? `<div class="md-note warn" style="margin-top:14px">
    <b>${esc(countOf(held, "item"))} held by consent.</b> ${held === 1 ? "It stays" : "They stay"} in your library and
    ${held === 1 ? "is" : "are"} visible only to you until the ${plural(held, "family grants", "families grant")}
    permission. Nothing was deleted.</div>` : ""}

  <div class="md-secline"><div>
      <h3>Profile media</h3>
      <p>What appears on your public listing. Sporve's listing guideline asks for ${RULE.featurePhotos} or more
        profile photos — you have <span class="num">${photos}</span>${shortPhotos
          ? `, so add <span class="num">${shortPhotos}</span> more.`
          : `, which meets it.`}</p>
    </div></div>
  <div class="md-slots">${SLOTS.map(slotCard).join("")}</div>

  <div class="md-secline"><div>
      <h3>Session media</h3>
      <p>Clips and photos captured at a specific session. Every one is attached to the athletes in it, which is
        what makes the consent gate enforceable.</p>
    </div>
    <div class="md-seg" role="group" aria-label="Group session media by">
      <button class="${grouping === "session" ? "on" : ""}" data-md-group="session"
        aria-pressed="${grouping === "session"}">By session</button>
      <button class="${grouping === "athlete" ? "on" : ""}" data-md-group="athlete"
        aria-pressed="${grouping === "athlete"}">By athlete</button>
    </div></div>

  ${grouping === "session" ? sessionGroups() : athleteGroups()}
  ${grouping === "athlete"
    ? `<p class="md-hint" style="margin-top:12px">Media with more than one athlete in it appears under each of them.</p>`
    : ""}

  <div class="md-strip">
    <span>Consent on file: <span class="num">${cc.public_profile}</span> profile + private ·
      <span class="num">${cc.private_share}</span> private only ·
      <span class="num">${cc.none}</span> no media, across ${esc(countOf(ROSTER.length, "athlete"))}.
      Parents change this in their own app at any time, and a withdrawal pulls the media immediately.</span>
  </div>`;
}

/* ═══════════════════ MODALS ═══════════════════ */
const wrap = (title, body) =>
  `<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><b>${esc(title)}</b><button class="x" data-close="1" aria-label="Close">${ICON.x}</button></div>
    <div class="modal-body">${body}</div></div></div>`;

/* Live gate copy, shared by the upload modal and its repaint. */
function gateHTML(draft){
  const v = evaluate(draft);
  const kids = draft.athleteIds.length;
  const lines = [];
  if (!kids){
    lines.push(draft.kind === "session"
      ? "No athlete tagged yet. Session media must name the athletes in it before it can be sent anywhere."
      : "No athlete tagged. This can go on your public profile without anyone's consent, and there is no family thread to send it to.");
  } else if (v.canShare && v.canPublish){
    lines.push("All " + countOf(kids, "tagged athlete") + " have profile consent. This can be sent to their families and published on your profile.");
  } else if (v.canShare){
    lines.push(v.publishReason);
    lines.push("You can still send it privately to the tagged families.");
  } else {
    lines.push(v.shareReason);
  }
  return `<div class="eyebrow md-gatehead">Consent check</div>${lines.map(l => `<div>${esc(l)}</div>`).join("")}`;
}

function uploadModal(){
  const preset = (S.modal && S.modal.mdSlot) || null;
  const kind = preset && preset !== "new" ? "profile" : "session";
  const slotKey = preset && preset !== "new" ? preset : "headshot";
  const draft = { kind: kind, mediaType: slotRow(slotKey).format, athleteIds: [] };

  return wrap("Add media", `
    <p style="color:var(--muted);margin-bottom:18px">Tag the athletes who are actually in the frame. The consent
      check below runs before anything can be marked shareable — and it runs again when you press send.</p>
    <form id="mdUploadForm" novalidate>
      <p class="eyebrow" style="margin-bottom:11px">What is this?</p>
      <div class="md-opts">
        <label class="md-opt">
          <input type="radio" name="kind" value="profile" ${kind === "profile" ? "checked" : ""}>
          <span style="min-width:0"><b>Profile media</b>
            <span>Lives on your public listing — headshot, intro video, facility, action shots.</span></span>
        </label>
        <label class="md-opt">
          <input type="radio" name="kind" value="session" ${kind === "session" ? "checked" : ""}>
          <span style="min-width:0"><b>Session media</b>
            <span>Captured at one session and attached to the athletes who were there.</span></span>
        </label>
      </div>

      <div id="mdProfileWrap" class="${kind === "profile" ? "" : "hide"}">
        <div class="field"><label for="mdSlot">Where it sits on your profile</label>
          <select id="mdSlot" name="slot">
            ${SLOTS.map(s => `<option value="${esc(s.key)}" ${s.key === slotKey ? "selected" : ""}>${esc(s.label)}</option>`).join("")}
          </select></div>
      </div>

      <div id="mdSessionWrap" class="${kind === "session" ? "" : "hide"}">
        <div class="field"><label for="mdSession">Session</label>
          <select id="mdSession" name="sessionId">
            <option value="">Pick a session</option>
            ${SESSIONS.map(s => {
              const p = prog(s.programId);
              return `<option value="${esc(s.id)}">${esc(s.title)} · ${esc(fmtDate(s.date))}${p ? " · " + esc(p.title) : ""}</option>`;
            }).join("")}
          </select></div>
      </div>

      <div class="field"><label for="mdType">Format</label>
        <select id="mdType" name="mediaType">
          <option value="photo" ${draft.mediaType === "photo" ? "selected" : ""}>Photo</option>
          <option value="video" ${draft.mediaType === "video" ? "selected" : ""}>Video</option>
        </select></div>

      <div class="field ${draft.mediaType === "video" ? "" : "hide"}" id="mdDurWrap">
        <label for="mdDur">Length in seconds</label>
        <input id="mdDur" name="durationSec" type="number" min="1" max="600" step="1" class="num" value="45">
      </div>

      <p class="eyebrow" style="margin-bottom:6px">Athletes in this media</p>
      <p class="md-why" style="margin-bottom:10px">Required for session media. Optional for profile media — but an
        action shot with a child in it counts as media of that child.</p>
      <div class="md-checks">
        ${ROSTER.map(a => {
          const k = consentOf(a.id);
          return `<label class="md-check">
            <input type="checkbox" name="athlete" value="${esc(a.id)}" data-md-tag="1">
            <span style="min-width:0"><b>${esc(a.name)}</b>
              <span class="pill ${consentPill(k)}" style="margin-top:4px">${esc(consentLabel(k))}</span></span>
          </label>`;
        }).join("")}
      </div>

      <div class="field" style="margin-top:16px"><label for="mdCap">Caption</label>
        <textarea id="mdCap" name="caption" rows="3" maxlength="400"
          placeholder="What the family is looking at"></textarea>
        <span class="md-cnt num" id="mdCnt">0 / ${RULE.captionMax}</span></div>

      <div class="md-gate" id="mdGate">${gateHTML(draft)}</div>

      <label class="md-check" id="mdShareWrap" style="margin-bottom:16px">
        <input type="checkbox" id="mdShareable" name="shareable" disabled>
        <span style="min-width:0"><b>Mark as shareable with the tagged families</b>
          <span class="md-why" id="mdShareWhy">Tag at least one athlete with consent to enable this.</span></span>
      </label>

      <div id="mdUpErr" class="err hide" style="margin-bottom:10px"></div>
      <button class="btn wide" type="submit">Add to library</button>
    </form>`);
}

function consentModal(){
  const cc = consentCounts();
  return wrap("Media consent", `
    <div class="md-note warn" style="margin-bottom:18px">
      <b>Only a parent can grant this.</b> Consent is set by the family in their own Sporve app, against a
      named athlete. You can see what they chose and ask them to reconsider — there is no control here, and no
      code path in this app, that lets a coach answer on a family's behalf.</div>

    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Athlete</th><th>Program</th><th>Tagged</th><th>Consent</th><th>Action</th></tr></thead>
      <tbody>${ROSTER.map(a => {
        const k = consentOf(a.id);
        const p = prog(a.programId);
        const req = consentRequests[a.id] || null;
        return `<tr>
          <td><b>${esc(a.name)}</b>
            <div class="num" style="color:var(--muted);font-size:12.5px">Age ${a.age == null ? "—" : a.age} · ${esc(a.parent)}</div></td>
          <td>${p ? esc(p.title) : `<span style="color:var(--muted)">—</span>`}</td>
          <td class="num">${taggedCount(a.id)}</td>
          <td><span class="pill ${consentPill(k)}">${esc(consentLabel(k))}</span>
            ${a.consentAt
              ? `<div class="num" style="color:var(--muted);font-size:12.5px;margin-top:3px">set ${esc(fmtDate(a.consentAt.slice(0, 10)))}</div>`
              : `<div style="color:var(--muted);font-size:12.5px;margin-top:3px">never set</div>`}</td>
          <td>${k === "public_profile"
            ? `<span style="color:var(--muted);font-size:13px">Nothing to ask for</span>`
            : `<button class="btn ghost sm" data-md-request="${esc(a.id)}">${req ? "Ask again" : "Request consent"}</button>
               ${req ? `<div class="num" style="color:var(--muted);font-size:12.5px;margin-top:4px">asked ${esc(fmtDate(req.slice(0, 10)))}</div>` : ""}`}</td>
        </tr>`;
      }).join("")}</tbody></table></div>

    <p class="eyebrow" style="margin-top:20px">What the three settings mean</p>
    <div class="md-legend">
      ${CONSENT.map(([k, label, , meaning]) =>
        `<div><b>${esc(label)}</b> — ${esc(meaning)}</div>`).join("")}
    </div>
    <div class="md-strip">
      <span>Counts: <span class="num">${cc.public_profile}</span> profile + private,
        <span class="num">${cc.private_share}</span> private only,
        <span class="num">${cc.none}</span> no media. A family can change or withdraw at any time.</span>
    </div>`);
}

function shareMediaModal(){
  const it = itemById(S.modal && S.modal.itemId);
  if (!it) return wrap("Send to family", `<p style="color:var(--muted)">That media item no longer exists.</p>`);
  const v = evaluate(it);
  const noun = it.mediaType === "video" ? "clip" : "photo";
  const s = it.sessionId ? sessionById(it.sessionId) : null;

  const head = `<figure class="md-tile" style="max-width:210px;margin:0 0 18px">
      ${placeholder(it)}
      <div class="md-body"><figcaption class="md-cap">${esc(it.caption)}</figcaption>
        ${s ? `<p class="md-sent num">${esc(s.title)} · ${esc(fmtDate(s.date))}</p>` : ""}</div>
    </figure>`;

  if (!v.canShare){
    return wrap("Send to family", head + `
      <div class="md-note warn" style="margin-bottom:18px">
        <b>This ${esc(noun)} can't be sent.</b> ${esc(v.shareReason)}</div>
      ${v.athleteIds.length ? `<p class="eyebrow" style="margin-bottom:8px">Tagged</p>
        <div class="md-tags" style="margin-bottom:18px">${v.athleteIds.map(athletePill).join("")}</div>` : ""}
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">
        Sending is blocked in code, not just in this dialog — the same check runs again on the send itself.</p>
      <button class="btn wide" data-modal="consent">Open the consent roster</button>`);
  }

  const recipients = it.athleteIds.map(id => {
    const a = athleteById(id), k = consentOf(id);
    return `<div class="linerow"><span>${esc(a ? a.parent : "Parent")}
        <span style="color:var(--muted)"> · ${esc(athleteName(id))}</span></span>
      <span class="pill ${consentPill(k)}">${esc(consentLabel(k))}</span></div>`;
  }).join("");

  return wrap("Send to family", head + `
    <p class="eyebrow" style="margin-bottom:4px">Goes to</p>
    ${recipients}
    ${v.canPublish ? "" : `<div class="md-note warn" style="margin-top:14px">
      Private send only. ${esc(v.publishReason)}</div>`}
    <form id="mdShareForm" style="margin-top:18px">
      <div class="field"><label for="mdShareNote">Note to the family (optional)</label>
        <textarea id="mdShareNote" name="note" rows="3" maxlength="400"
          placeholder="What you want them to notice"></textarea>
        <span class="md-cnt num" id="mdShareCnt">0 / ${RULE.captionMax}</span></div>
      <div id="mdShareErr" class="err hide" style="margin-bottom:10px"></div>
      <button class="btn wide" type="submit">${ICON.send} Send to ${esc(countOf(it.athleteIds.length, "family thread"))}</button>
    </form>`);
}

/* ═══════════════════ WIRING ═══════════════════ */
function ensureCSS(){
  if (document.getElementById("mod-media-css")) return;
  const el = document.createElement("style");
  el.id = "mod-media-css";
  el.textContent = CSS;
  document.head.appendChild(el);
}

/* Read the upload form's current draft without touching state. */
function readDraft(form){
  const kindEl = form.querySelector('input[name="kind"]:checked');
  const typeEl = form.querySelector('#mdType');
  const ids = [];
  form.querySelectorAll('input[name="athlete"]:checked').forEach(c => ids.push(c.value));
  return {
    kind: kindEl ? kindEl.value : "session",
    mediaType: typeEl ? typeEl.value : "photo",
    athleteIds: ids,
  };
}

/* The host re-renders everything on state change, which would steal the
   caret out of the caption box. So the gate, the counter, and the
   shareable checkbox repaint in place. */
function paintGate(){
  const form = document.getElementById("mdUploadForm");
  if (!form) return;
  const draft = readDraft(form);
  const v = evaluate(draft);
  const gate = document.getElementById("mdGate");
  if (gate){
    gate.innerHTML = gateHTML(draft);
    gate.classList.toggle("block", !v.canShare || !v.canPublish);
  }
  const cb = document.getElementById("mdShareable");
  const why = document.getElementById("mdShareWhy");
  if (cb){
    const allowed = v.canShare;
    if (!allowed) cb.checked = false;
    cb.disabled = !allowed;
    if (why){
      why.textContent = allowed
        ? "The tagged families can receive this in their own thread."
        : (draft.athleteIds.length ? v.shareReason : "Tag at least one athlete with consent to enable this.");
    }
  }
}
function paintCount(taEl, outEl){
  if (!taEl || !outEl) return;
  const n = taEl.value.length;
  outEl.textContent = n + " / " + RULE.captionMax;
  outEl.classList.toggle("over", n > RULE.captionMax);
}

function wire(){
  ensureCSS();
  const q = s => document.querySelectorAll(s);

  /* ── library actions ──────────────────────────────────────────── */
  q("[data-md-upload]").forEach(b => b.onclick = () => {
    S.modal = { type: "upload", mdSlot: b.dataset.mdUpload };
    render();
  });
  q("[data-md-group]").forEach(b => b.onclick = () => {
    grouping = b.dataset.mdGroup === "athlete" ? "athlete" : "session";
    render();
  });

  /* Every outbound path re-checks the gate. The disabled attribute is
     a courtesy to the coach; this is the actual rule. */
  q("[data-md-share]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.mdShare);
    if (!it) return;
    const v = evaluate(it);
    if (!v.canShare){ toast(v.shareReason); return; }
    S.modal = { type: "sharemedia", itemId: it.id };
    render();
  });
  q("[data-md-publish]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.mdPublish);
    if (!it) return;
    const v = evaluate(it);
    if (!v.canPublish){ toast(v.publishReason); return; }
    it.published = true;
    render();
    toast("Published to your profile");
  });
  q("[data-md-unpublish]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.mdUnpublish);
    if (!it) return;
    it.published = false;                       // taking something down is never gated
    render();
    toast("Removed from your public profile");
  });
  q("[data-md-del]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.mdDel);
    if (!it) return;
    state.mediaItems = state.mediaItems.filter(x => x.id !== it.id);
    render();
    toast("Deleted from your library");
  });

  /* ── consent roster: ask, never grant ─────────────────────────── */
  q("[data-md-request]").forEach(b => b.onclick = () => {
    const a = athleteById(b.dataset.mdRequest);
    if (!a) return;
    consentRequests[a.id] = iso(NOW());
    render();
    toast("Consent request sent to " + a.parent + " — only they can grant it");
  });

  /* ── upload form ──────────────────────────────────────────────── */
  const uf = document.getElementById("mdUploadForm");
  if (uf){
    const cap = document.getElementById("mdCap");
    const cnt = document.getElementById("mdCnt");
    const durWrap = document.getElementById("mdDurWrap");
    const typeEl = document.getElementById("mdType");
    const profWrap = document.getElementById("mdProfileWrap");
    const sessWrap = document.getElementById("mdSessionWrap");
    const slotEl = document.getElementById("mdSlot");

    const syncKind = () => {
      const d = readDraft(uf);
      if (profWrap) profWrap.classList.toggle("hide", d.kind !== "profile");
      if (sessWrap) sessWrap.classList.toggle("hide", d.kind !== "session");
      paintGate();
    };
    uf.querySelectorAll('input[name="kind"]').forEach(r => r.onchange = syncKind);
    uf.querySelectorAll("[data-md-tag]").forEach(c => c.onchange = paintGate);
    if (typeEl) typeEl.onchange = () => {
      if (durWrap) durWrap.classList.toggle("hide", typeEl.value !== "video");
      paintGate();
    };
    if (slotEl) slotEl.onchange = () => {
      const sl = slotRow(slotEl.value);
      if (typeEl){ typeEl.value = sl.format; }
      if (durWrap) durWrap.classList.toggle("hide", sl.format !== "video");
      paintGate();
    };
    if (cap) cap.oninput = () => paintCount(cap, cnt);
    paintCount(cap, cnt);
    paintGate();

    uf.onsubmit = ev => {
      ev.preventDefault();
      const err = document.getElementById("mdUpErr");
      const show = msg => { if (err){ err.textContent = msg; err.classList.remove("hide"); } return false; };
      const d = Object.fromEntries(new FormData(uf));
      const draft = readDraft(uf);
      const caption = String(d.caption || "").trim();

      if (!caption) return show("Write a caption — the family reads it before they look at the photo.");
      if (caption.length > RULE.captionMax)
        return show("Captions are limited to " + RULE.captionMax + " characters — yours is " + caption.length + ".");
      if (draft.kind === "session"){
        if (!d.sessionId) return show("Pick the session this came from.");
        if (!draft.athleteIds.length)
          return show("Tag at least one athlete — session media is always attached to the athletes in it.");
      }
      let dur = null;
      if (draft.mediaType === "video"){
        dur = Number(d.durationSec);
        if (!isFinite(dur) || dur < 1) return show("Enter how many seconds the video runs.");
        dur = Math.round(dur);
        if (draft.kind === "profile" && d.slot === "intro_video" && (dur < RULE.introMin || dur > RULE.introMax))
          return show("An intro video has to run " + RULE.introMin + "–" + RULE.introMax + " seconds — this one is " + dur + "s.");
      }
      if (err) err.classList.add("hide");

      const sess = draft.kind === "session" ? sessionById(String(d.sessionId)) : null;
      const item = {
        id: "md_" + Date.now(),
        kind: draft.kind,
        slot: draft.kind === "profile" ? String(d.slot || "action") : null,
        mediaType: draft.mediaType,
        durationSec: dur,
        sessionId: sess ? sess.id : null,
        programId: sess ? sess.programId : null,
        athleteIds: draft.athleteIds.slice(),
        caption: caption,
        createdAt: iso(NOW()),
        published: false,
        shareable: false,
        sharedWith: [],
      };
      /* The gate decides, not the checkbox: a tampered or stale DOM
         cannot mark a blocked item shareable. */
      const v = evaluate(item);
      item.shareable = v.canShare && !!d.shareable;

      state.mediaItems = state.mediaItems.concat([item]);
      S.modal = null;
      S.coachTab = "media";
      render();
      toast(v.blockKind === "consent"
        ? "Added — held by consent, visible only to you for now"
        : item.shareable ? "Added and ready to send" : "Added to your library");
    };
  }

  /* ── share form ───────────────────────────────────────────────── */
  const sf = document.getElementById("mdShareForm");
  if (sf){
    const note = document.getElementById("mdShareNote");
    const cnt2 = document.getElementById("mdShareCnt");
    if (note) note.oninput = () => paintCount(note, cnt2);
    paintCount(note, cnt2);

    sf.onsubmit = ev => {
      ev.preventDefault();
      const err = document.getElementById("mdShareErr");
      const show = msg => { if (err){ err.textContent = msg; err.classList.remove("hide"); } return false; };
      const it = itemById(S.modal && S.modal.itemId);
      if (!it){ S.modal = null; render(); return; }
      const d = Object.fromEntries(new FormData(sf));
      const noteTxt = String(d.note || "").trim();
      if (noteTxt.length > RULE.captionMax)
        return show("Notes are limited to " + RULE.captionMax + " characters — yours is " + noteTxt.length + ".");

      /* Re-check at the moment of sending — consent can have changed
         between opening this dialog and pressing the button. */
      const v = evaluate(it);
      if (!v.canShare){
        S.modal = null;
        render();
        toast(v.shareReason);
        return;
      }
      const at = iso(NOW());
      it.athleteIds.forEach(id => it.sharedWith.push({ athleteId: id, at: at }));
      it.shareable = true;
      it.note = noteTxt || null;
      S.modal = null;
      render();
      toast("Sent to " + countOf(it.athleteIds.length, "family thread"));
    };
  }
}

/* ═══════════════════ EXPORT ═══════════════════ */
window.MOD_MEDIA = {

  views: { media: mediaView },
  modals: { upload: uploadModal, consent: consentModal, sharemedia: shareMediaModal },

/* exposed for the stub-DOM harness; harmless in the browser */
window.MOD_MEDIA._test = { evaluate: evaluate, consentOf: consentOf, itemById: itemById,
  ROSTER: ROSTER, SESSIONS: SESSIONS, RULE: RULE, TODAY: TODAY };

})();

</script>
