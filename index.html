/* ═══════════════════ RENDER ═══════════════════ */
function render(){
  const r=S.route;
  let body;
  /* The Family/Coach toggle swaps the ENTIRE page below the nav (spec Part 2,
     slot 4). On the landing route that means two different marketing scrolls;
     inside the app it means the family app vs the coach dashboard. */
  if(r.name==="home"||S.portal==="coach") body=S.portal==="coach"?coachHTML():exploreHTML();
  else if(r.name==="product") body=productHTML();
  else if(r.name==="detail") body=detailHTML(r.arg);
  else if(r.name==="bookings") body=bookingsHTML();
  else if(r.name==="saved") body=savedHTML();
  else if(r.name==="messages") body=messagesHTML();
  else if(r.name==="profile") body=profileHTML();
  else if(r.name==="map") body=mapHTML();
  else if(r.name==="assistant") body=assistantHTML();
  else if(r.name==="schedule") body=scheduleHTML();
  else if(r.name==="notifications") body=notifSettingsHTML();
  else if(r.name==="info") body=infoHTML(r.arg||"help");
  else if(modView(r.name)) body=modView(r.name)();
  else body=exploreHTML();

  document.getElementById("app").innerHTML=topbarHTML()+body+
    footerHTML();
  document.getElementById("layer").innerHTML=modalHTML()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");

  const sc=document.getElementById("msgscroll"); if(sc) sc.scrollTop=sc.scrollHeight;
  const cs=document.getElementById("chatscroll"); if(cs&&S.chat.length) cs.scrollTop=cs.scrollHeight;
  wire();
  wireExtras();
}

function wire(){
  const $=s=>document.querySelectorAll(s);
  const on=(sel,ev,fn)=>$(sel).forEach(el=>el.addEventListener(ev,fn));

  $("[data-nav]").forEach(b=>b.onclick=()=>{S.modal=null;go(b.dataset.nav);});
  $("[data-open]").forEach(b=>b.onclick=()=>go("detail",b.dataset.open));
  $("[data-fav]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav);});
  /* Multi-select: each disc adds or removes its sport; "All" clears the set. */
  $("[data-sport]").forEach(b=>b.onclick=()=>{toggleSport(b.dataset.sport||"");render();});
  /* Filters is a tab that opens a sheet — the grid behind it stays put. */
  $("[data-openfilters]").forEach(b=>b.onclick=()=>{
    if(!modModal("filters")){toast("Advanced filters are still loading");return;}
    S.modal={type:"filters"};render();});
  $("[data-pdest]").forEach(b=>b.onclick=()=>{
    const [kind,arg]=b.dataset.pdest.split(":");
    if(kind==="filters"){if(modModal("filters")){S.modal={type:"filters"};render();}return;}
    if(kind==="coach"){S.portal="coach";S.signupRole="coach";
      if(!isVerified()){S.onboardStep=0;S.modal={type:"onboard"};}
      else{S.coachTab="dashboard";S.route={name:"dashboard",arg:null};}
      window.scrollTo(0,0);render();return;}
    if(kind==="tab"){S.portal="coach";S.coachTab=arg;go("dashboard");return;}
    go(arg);
  });
  /* Toggle flips the view in place — same route, swapped scroll (spec Part 2). */
  $("[data-portal]").forEach(b=>b.onclick=()=>{
    if(b.dataset.coachdash) return;               // handled by its own binding
    S.portal=b.dataset.portal;S.modal=null;S.sportOpen=false;
    S.route=S.portal==="coach"?{name:"dashboard",arg:null}:{name:"explore",arg:null};
    window.scrollTo(0,0);render();});
  $("[data-ctab]").forEach(b=>b.onclick=()=>{S.coachTab=b.dataset.ctab;window.scrollTo(0,0);render();});
  $("[data-conv]").forEach(b=>b.onclick=()=>{S.activeConv=b.dataset.conv;render();});
  $("[data-close],[data-scrim]").forEach(b=>b.onclick=e=>{if(e.target===b){S.modal=null;render();}});
  $("[data-modal]").forEach(b=>b.onclick=()=>{S.modal={type:b.dataset.modal};render();});
  $("[data-srole]").forEach(b=>b.onclick=()=>{S.signupRole=b.dataset.srole;render();});
  $("[data-signin]").forEach(b=>b.onclick=()=>{S.modal={type:"authsheet"};render();});
  $("[data-acct]").forEach(b=>b.onclick=()=>{S.modal={type:"account"};render();});
  $("[data-addchild]").forEach(b=>b.onclick=()=>{S.modal={type:"addchild"};render();});
  $("[data-newlisting]").forEach(b=>b.onclick=()=>{S.modal={type:"newlisting"};render();});
  $("[data-addtrainer]").forEach(b=>b.onclick=()=>{S.modal={type:"addtrainer"};render();});
  $("[data-save]").forEach(b=>b.onclick=()=>toast("Changes saved"));
  $("[data-logout]").forEach(b=>b.onclick=()=>{S.auth={status:"guest",user:null};S.modal=null;go("explore");toast("Signed out");});

  $("[data-filter]").forEach(b=>b.onclick=()=>{
    const f=b.dataset.filter;
    if(f==="verified") S.filters.verifiedOnly=!S.filters.verifiedOnly;
    if(f==="under50") S.filters.maxPrice=S.filters.maxPrice===50?null:50;
    if(f==="single") S.filters.model=S.filters.model==="single_session"?null:"single_session";
    if(f==="monthly") S.filters.model=S.filters.model==="monthly"?null:"monthly";
    if(f==="clear"){S.filters={maxPrice:null,verifiedOnly:false,model:null};S.sport=null;S.query="";}
    render();
  });

  /* book + message run through the auth gate; the intent resumes after sign-in */
  $("[data-book]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.book;
    requireAuth(()=>{S.modal={type:"book",programId:id};render();});
  });
  $("[data-msg]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.msg, p=PROGRAMS.find(x=>x.id===id);
    requireAuth(()=>{
      let c=S.conversations.find(c=>c.with===p.biz);
      if(!c){c={id:"conv_"+Date.now(),with:p.biz,programId:p.id,last:"New conversation",at:"2026-08-03T00:00:00.000Z"};
        S.conversations=[c,...S.conversations];S.messages[c.id]=[];}
      S.activeConv=c.id;S.modal=null;go("messages");
    });
  });
  $("[data-slot]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-slot]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
  });
  $("[data-pin]").forEach(b=>b.onclick=()=>{S.mapPick=b.dataset.pin;render();});
  $("[data-info]").forEach(b=>b.onclick=()=>{S.modal=null;go("info",b.dataset.info);});
  /* ── landing wiring ── */
  $("[data-sportmenu]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const shell=b.closest(".shell");
    S.sportAnchor=shell?Math.round(b.getBoundingClientRect().left-shell.getBoundingClientRect().left):240;
    S.sportOpen=!S.sportOpen;render();});
  $("[data-sportdone]").forEach(b=>b.onclick=()=>{S.sportOpen=false;render();});
  $("[data-showcase]").forEach(b=>b.onclick=()=>{S.showcaseSide=b.dataset.showcase;render();});
  $("[data-faq]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.faq; S.faqOpen=S.faqOpen===i?null:i; render();});
  /* Become a coach opens the signup wizard directly — there is no marketing
     page in front of it any more. */
  $("[data-becomecoach]").forEach(b=>b.onclick=()=>{
    S.portal="coach";S.signupRole="coach";
    if(!isVerified()){S.onboardStep=0;S.modal={type:"onboard"};}
    else {S.coachTab=modView("onboard")?"onboard":"dashboard";S.route={name:"dashboard",arg:null};}
    window.scrollTo(0,0);render();
  });
  $("[data-coachdash]").forEach(b=>b.onclick=()=>{
    S.portal="coach";S.coachTab="dashboard";go("dashboard");});
  $("[data-sportjump]").forEach(b=>b.onclick=()=>{
    S.sport=b.dataset.sportjump;S.sportOpen=false;go("explore");});
  $("[data-scrollto]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById(b.dataset.scrollto);
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"});});
  $("[data-coachtab]").forEach(b=>b.onclick=()=>{
    S.portal="coach";S.coachTab=b.dataset.coachtab;go("dashboard");});
  /* ── coach dashboard wiring ── */
  $("[data-import]").forEach(b=>b.onclick=()=>{S.modal={type:"importclients"};render();});
  $("[data-viewas]").forEach(b=>b.onclick=()=>{S.modal={type:"viewasparent"};render();});
  $("[data-share]").forEach(b=>b.onclick=()=>{S.coachTab="dashboard";render();
    toast("Your booking link is in the Share card below");});
  $("[data-copy]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.copy;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(()=>{});
    toast("Booking link copied");});
  $("[data-notetab]").forEach(b=>b.onclick=()=>{
    S.coachTab=modView("notes")?"notes":"schedule";render();});
  $("[data-cmd]").forEach(b=>b.onclick=()=>runCommand(b.dataset.cmd));
  $("[data-voice]").forEach(b=>b.onclick=()=>
    toast("Voice input needs a microphone permission this demo doesn't request"));
  $("[data-qact]").forEach(b=>b.onclick=()=>{
    const [,act]=b.dataset.qact.split(":");
    if(act==="dismiss"){toast("Dismissed");return;}
    if(act==="offer"){S.coachTab="waitlist";render();return;}
    S.portal="coach";S.coachTab=act;render();
  });
  const cmdf=document.getElementById("cmdForm");
  if(cmdf) cmdf.onsubmit=e=>{
    e.preventDefault();
    const i=document.getElementById("cmdField");
    const v=i.value.trim(); i.value="";
    if(v) runCommand(v);
  };
  const impf=document.getElementById("importForm");
  if(impf) impf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(impf));
    const err=document.getElementById("importErr");
    const rows=(d.rows||"").split("\n").map(r=>r.trim()).filter(Boolean);
    const good=rows.filter(r=>/[\w.+-]+@[\w-]+\.[\w.-]+/.test(r));
    if(!rows.length){err.textContent="Add at least one family.";err.classList.remove("hide");return;}
    if(!good.length){err.textContent="Each line needs an email address.";err.classList.remove("hide");return;}
    S.importedClients=[...(S.importedClients||[]),...good];
    S.modal=null;render();
    toast(`${good.length} invite${good.length===1?"":"s"} sent`);
  };

  $("[data-foot]").forEach(b=>b.onclick=()=>{
    const [kind,val]=b.dataset.foot.split(":");
    S.sportOpen=false;
    if(kind==="nav") go(val);
    else if(kind==="info") go("info",val);
    else if(kind==="tab"){S.portal="coach";S.coachTab=val;go("dashboard");}
    else if(kind==="coach"){S.portal="coach";S.route={name:"home",arg:null};window.scrollTo(0,0);render();}
  });
  $("[data-pm]").forEach(b=>b.onclick=()=>{
    const [side,key]=b.dataset.pm.split(":");
    S.sportOpen=false;
    if(side==="co"){S.portal="coach";S.coachTab=key;go("dashboard");}
    else go(key);
  });
  $("[data-onboard]").forEach(b=>b.onclick=()=>{S.onboardStep=0;S.modal={type:"onboard"};render();});
  $("[data-onbnext]").forEach(b=>b.onclick=()=>{S.onboardStep=Math.min(2,S.onboardStep+1);render();});
  $("[data-onbback]").forEach(b=>b.onclick=()=>{
    if(S.onboardStep===0){S.modal={type:"authsheet"};} else S.onboardStep--; render();});
  $("[data-pick]").forEach(b=>b.onclick=()=>{
    const s=b.dataset.pick;
    S.onboardSports=S.onboardSports.includes(s)?S.onboardSports.filter(x=>x!==s):[...S.onboardSports,s];
    render();});
  $("[data-chatclear]").forEach(b=>b.onclick=()=>{S.chat=[];render();});
  $("[data-ask]").forEach(b=>b.onclick=()=>askCoach(b.dataset.ask));
  $("[data-waitlist]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.waitlist;
    requireAuth(()=>{S.modal={type:"waitlist",programId:id};render();});
  });
  $("[data-google]").forEach(b=>b.onclick=()=>{
    completeAuth({...SEED.user,role:S.signupRole==="coach"?"provider":"searcher"});
    if(S.signupRole==="coach") S.portal="coach";
    toast("Signed in with Google");
  });

  const q=document.getElementById("q");
  if(q){
    q.oninput=e=>{S.query=e.target.value;};
    q.onkeydown=e=>{if(e.key==="Enter"){S.route={name:"explore",arg:null};render();}};
  }
  const qgo=document.getElementById("qgo");
  if(qgo) qgo.onclick=()=>{S.route={name:"explore",arg:null};render();};

  const sf=document.getElementById("signupForm");
  if(sf) sf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(sf));
    const err=document.getElementById("signupErr");
    const show=m=>{err.textContent=m;err.classList.remove("hide");};
    if(!d.first||!d.last||!d.email||!d.password) return show("Please fill out all the fields.");
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(d.email)) return show("Please enter a valid email address.");
    if(d.password.length<8) return show("Password must be at least 8 characters.");
    if(!d.privacy) return show("Please acknowledge Sporve's Privacy Policy to continue.");
    completeAuth({firstName:d.first,lastName:d.last,email:d.email,phone:d.phone||"",
      role:S.signupRole==="coach"?"provider":"searcher",preferredSports:S.onboardSports.slice()});
    if(S.signupRole==="coach") S.portal="coach";
    toast("Account created");
  };

  const lf=document.getElementById("loginForm");
  if(lf) lf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(lf));
    const err=document.getElementById("loginErr");
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(d.email)){
      err.textContent="Please enter a valid email address.";err.classList.remove("hide");return;}
    if(!d.password||d.password.length<8){
      err.textContent="Please enter both email and password.";err.classList.remove("hide");return;}
    completeAuth({...SEED.user});
    toast("Welcome back, Alex");
  };

  const cf=document.getElementById("childForm");
  if(cf) cf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(cf));
    const err=document.getElementById("childErr");
    if(!d.first.trim()){err.textContent="Enter the child's first name.";err.classList.remove("hide");return;}
    if(!d.consent){
      err.textContent="Parental consent is required before a child profile can be created (COPPA).";
      err.classList.remove("hide");return;}
    S.athletes=[...S.athletes,{id:"athlete_"+Date.now(),firstName:d.first.trim(),lastName:d.last.trim(),
      dob:`${d.year}-01-01`,preferredSports:[],skillLevel:d.skill||null,parentConsent:true,
      consentAt:new Date().toISOString(),consentVersion:"v1"}];
    S.modal=null;render();toast("Child added");
  };

  const bf=document.getElementById("bookForm");
  if(bf) bf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(bf));
    const p=PROGRAMS.find(x=>x.id===S.modal.programId);
    const a=S.athletes.find(x=>x.id===d.athlete);
    const s=slotsFor(p.id).find(x=>x.id===d.slot);
    const price=p.price+(d.tier.startsWith("Premium")?15:0);
    const booking={id:"book_"+Date.now(),athlete:`${a.firstName} ${a.lastName||""}`.trim(),
      programId:p.id,program:p.title,sessionId:s.id,session:s.title,date:s.date,
      startTime:s.startTime,tier:d.tier,price,status:"confirmed",paymentStatus:"paid",
      createdAt:"2026-08-03"};
    S.bookings=[booking,...S.bookings];
    S.notifications=[{id:"n"+Date.now(),title:"Booking Confirmed",
      message:`Your booking for ${s.title} has been confirmed.`,read:false,at:new Date().toISOString()},...S.notifications];
    S.modal={type:"booked",booking};
    render();
  };

  const nf=document.getElementById("listingForm");
  if(nf) nf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(nf));
    const id="prog_new_"+Date.now();
    PROGRAMS.push({id,biz:SEED.providerProfile.businessName,verified:true,sport:d.sport,
      title:d.title,desc:d.desc,price:+d.price,model:d.model,rating:0,reviews:0,
      lng:-80.19,lat:25.76,featured:false,skill:"All Levels",ageGroup:"All Ages",
      minAge:+d.minAge,maxAge:+d.maxAge,cap:+d.cap,enrolled:0,
      img:`https://picsum.photos/seed/${id}/600/400`,
      gallery:[`https://picsum.photos/seed/${id}/600/400`,`https://picsum.photos/seed/${id}b/600/400`,`https://picsum.photos/seed/${id}c/600/400`],
      whatsIncluded:["Equipment provided","Professional coaching","Progress report"],
      address:"Miami, FL 33101",cancellationPolicy:"moderate"});
    S.listings=[...S.listings,id];
    S.modal=null;S.coachTab="listings";render();toast("Listing created");
  };

  const tf=document.getElementById("trainerForm");
  if(tf) tf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(tf));
    S.trainers=[...S.trainers,{id:"om_"+Date.now(),name:d.name,specialty:d.specialty,
      commissionType:d.ctype,commissionValue:+d.cvalue,affiliation:"pending",bg:"none",active:true}];
    S.modal=null;render();toast("Invite sent — background check pending");
  };

  $("[data-psport]").forEach(b=>b.onclick=()=>{
    const s=b.dataset.psport, u=S.auth.user;
    if(!u) return;
    u.preferredSports=(u.preferredSports||[]).includes(s)
      ? u.preferredSports.filter(x=>x!==s) : [...(u.preferredSports||[]),s];
    render();
  });
  const pf=document.getElementById("profileForm");
  if(pf) pf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(pf));
    const err=document.getElementById("profileErr");
    if(!d.first.trim()||!d.last.trim()){
      err.textContent="Please enter both a first and last name.";err.classList.remove("hide");return;}
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(d.email)){
      err.textContent="Please enter a valid email address.";err.classList.remove("hide");return;}
    S.auth.user={...S.auth.user,firstName:d.first.trim(),lastName:d.last.trim(),
      email:d.email.trim(),phone:d.phone.trim()};
    S.modal=null;render();toast("Profile updated");
  };

  const wf=document.getElementById("waitForm");
  if(wf) wf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(wf));
    const p=PROGRAMS.find(x=>x.id===S.modal.programId);
    const a=S.athletes.find(x=>x.id===d.athlete);
    S.waitlist=[...S.waitlist,{programId:p.id,athlete:a.firstName,via:d.via}];
    S.modal=null;render();toast(`On the waitlist for ${p.title}`);
  };

  const ff=document.getElementById("forgotForm");
  if(ff) ff.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(ff));
    const err=document.getElementById("forgotErr");
    const show=m=>{err.textContent=m;err.classList.remove("hide");};
    if(!S.forgotSent){
      if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(d.email||"")) return show("Please enter a valid email address.");
      S.forgotEmail=d.email;S.forgotSent=true;render();toast("Reset code sent to your email");
    }else{
      if(!d.token||!d.token.trim()) return show("Please enter the code from your email.");
      if(!d.password||d.password.length<8) return show("Please enter the token and a password of min. 8 characters.");
      S.forgotSent=false;S.modal={type:"login"};render();toast("Password reset — please log in");
    }
  };

  const chf=document.getElementById("chatForm");
  if(chf) chf.onsubmit=e=>{
    e.preventDefault();
    const i=document.getElementById("chatInput");
    const v=i.value; i.value="";
    askCoach(v);
  };

  const comp=document.getElementById("composeForm");
  if(comp) comp.onsubmit=e=>{
    e.preventDefault();
    const input=document.getElementById("composeInput");
    const text=input.value.trim(); if(!text) return;
    const cid=S.activeConv;
    S.messages[cid]=[...(S.messages[cid]||[]),{id:"m"+Date.now(),me:true,text,at:new Date().toISOString()}];
    const c=S.conversations.find(c=>c.id===cid); if(c) c.last=text;
    render();
    setTimeout(()=>{
      S.messages[cid]=[...S.messages[cid],{id:"m"+Date.now(),me:false,
        text:"Thanks for reaching out! I'll get back to you shortly with the details.",at:new Date().toISOString()}];
      const c2=S.conversations.find(c=>c.id===cid);
      if(c2) c2.last="Thanks for reaching out! I'll get back to you shortly with the details.";
      render();
    },1100);
  };
}

/* module wiring + host-owned toggles, run at the end of every render */
function wireExtras(){
  document.querySelectorAll("[data-notif]").forEach(el=>{
    el.onchange=()=>{
      const [k,ch]=el.dataset.notif.split(".");
      S.notifPrefs[k][ch]=el.checked;
      toast(el.checked?"Notification turned on":"Notification turned off");
    };
  });
  document.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.report;
    requireAuth(()=>{S.modal={type:"report",providerId:id};render();});
  });
  for(const m of modules()) if(typeof m.wire==="function"){
    try{ m.wire(); }catch(e){ console.error("module wire failed",e); }
  }
}

/* Coach command bar. Every action lands in an activity log — a trust
   requirement for automation that touches schedules and money. */
function runCommand(text){
  const t=text.toLowerCase();
  let did="";
  if(/confirm/.test(t)&&/session/.test(t)){did="Confirmed tomorrow's sessions";S.coachTab="schedule";}
  else if(/fill|waitlist|open slot/.test(t)){did="Opened the waitlist to fill a slot";S.coachTab="waitlist";}
  else if(/message|family|families/.test(t)){did="Opened your inbox";S.coachTab="inbox";}
  else if(/to-do|todo|left|go live|what's left/.test(t)){did="Listed what's left before you go live";S.coachTab="dashboard";}
  else if(/availability|set my/.test(t)){did="Opened recurring availability";S.coachTab=modView("slots")?"slots":"schedule";}
  else if(/profile|build my/.test(t)){did="Opened your business profile";S.coachTab="profile";}
  else if(/note/.test(t)){did="Opened session notes";S.coachTab=modView("notes")?"notes":"schedule";}
  else {did=`No action taken for "${text}"`;}
  S.cmdLog=[{text:did,at:"just now"},...(S.cmdLog||[])].slice(0,8);
  render();
  toast(did);
}

function askCoach(q){
  if(!q||!q.trim()) return;
  S.chat=[...S.chat,{role:"user",text:q.trim()}];
  S.chatThinking=true; render();
  setTimeout(()=>{
    const a=answerFor(q);
    S.chatThinking=false;
    S.chat=[...S.chat,{role:"coach",text:a.text,picks:a.picks}];
    render();
  },700);
}

/* Photography comes from picsum.photos. Behind a strict CSP — or simply
   offline — those requests never land, and every card collapses to an empty
   box. Capture-phase, because `error` on <img> does not bubble. The stand-in
   is tinted with the listing's own sport colour, read off the badge that sits
   in the same frame, so a blocked page still reads as the same product. */
document.addEventListener("error",e=>{
  const img=e.target;
  if(!img||img.tagName!=="IMG"||img.dataset.fallback) return;
  img.dataset.fallback="1";
  const dot=img.parentElement&&img.parentElement.querySelector(".sporttag i");
  const c=(dot&&dot.style.background)||"#475569";
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".30"/>
        <stop offset="1" stop-color="${c}" stop-opacity=".08"/>
      </linearGradient></defs>
      <rect width="600" height="400" fill="#EFF2F5"/>
      <rect width="600" height="400" fill="url(#g)"/>
      <text x="300" y="212" text-anchor="middle" font-family="Arial,sans-serif"
            font-size="34" font-weight="800" letter-spacing="6"
            fill="${c}" fill-opacity=".55">SPORVE</text>
    </svg>`);
},true);

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(S.modal){S.modal=null;render();}
  else if(S.sportOpen){S.sportOpen=false;render();}
});
/* Click anywhere outside the sport chooser closes it. Clicks INSIDE it are
   selections, and must not close — multi-select means several in a row. */
document.addEventListener("click",e=>{
  if(!S.sportOpen) return;
  if(e.target.closest(".sportmenu")||e.target.closest("[data-sportmenu]")) return;
  S.sportOpen=false;render();
});
</script>

<!-- ═══ FEATURE MODULES (inlined; each registers a window.MOD_* object) ═══ -->
<script>
/* ---- mod-safety.js ---- */
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   MOD_SAFETY — Trust & Safety for Sporve Web.

   Three real backend flows, mirrored exactly on the client:
     · safety reports   (7 categories, 10–4000 char details, 10/day quota)
     · refund requests  (paid | partially_refunded only, one open per booking)
     · privacy requests (access | export | correction | deletion — case-reviewed)

   Host contract used, never redefined: S, render, toast, esc, money,
   fmtDate, isVerified, requireAuth, PROGRAMS, ICON.
   ═══════════════════════════════════════════════════════════════════ */
(function () {

  /* ── vocabularies (values are the backend's; labels are for humans) ── */
  const CATEGORIES = [
    ["unsafe_behavior",       "Unsafe behavior or supervision"],
    ["harassment",            "Harassment or bullying"],
    ["discrimination",        "Discrimination"],
    ["identity_concern",      "Identity or credential concern"],
    ["inappropriate_content", "Inappropriate content or contact"],
    ["payment_dispute",       "Payment dispute"],
    ["other",                 "Something else"],
  ];
  const CATEGORY_LABEL = Object.fromEntries(CATEGORIES);

  const PRIVACY_TYPES = [
    ["access",     "Access my data",   "See what Sporve holds about you and your athletes."],
    ["export",     "Export my data",   "Get a machine-readable copy you can take elsewhere."],
    ["correction", "Correct my data",  "Fix something that is wrong or out of date."],
    ["deletion",   "Delete my data",   "Opens a reviewed case — not an instant delete."],
  ];
  const PRIVACY_LABEL = Object.fromEntries(PRIVACY_TYPES.map(t => [t[0], t[1]]));

  /* a refund request is "open" in exactly these states */
  const REFUND_OPEN = ["submitted", "reviewing", "approved", "processing"];
  const REFUND_ELIGIBLE_PAYMENT = ["paid", "partially_refunded"];

  const REPORT_DAILY_QUOTA = 10;
  const DETAILS_MIN = 10, DETAILS_MAX = 4000;
  const REASON_MIN = 10, REASON_MAX = 2000;
  const PRIVACY_MAX = 2000;

  const STATUS_LABEL = {
    submitted: "Submitted", untriaged: "Untriaged", reviewing: "In review",
    identity_check: "Identity check", processing: "Processing",
    approved: "Approved", completed: "Completed", fulfilled: "Fulfilled",
    denied: "Denied", failed: "Failed",
  };
  /* warn = still pending on us · good = resolved in your favour ·
     closed = terminal, no longer moving (never --danger: not destructive) */
  const STATUS_TONE = {
    submitted: "warn", untriaged: "warn", reviewing: "warn",
    identity_check: "warn", processing: "warn",
    approved: "good", completed: "good", fulfilled: "good",
    denied: "closed", failed: "closed",
  };
  const PAYMENT_REASON = {
    unpaid: "no payment has been captured for it yet",
    pending: "its payment has not settled yet",
    processing: "its payment is still processing",
    refunded: "it has already been refunded in full",
    failed: "its payment never completed",
    canceled: "it was canceled before any charge was captured",
  };

  /* ── small helpers ────────────────────────────────────────────────── */
  const today = () => new Date().toISOString().slice(0, 10);
  const nowISO = () => new Date().toISOString();
  const bag = () => (S.safety = S.safety || { reports: [], refunds: [], privacy: [], reportsToday: 0, quotaDate: today() });

  function reportsLeft() {
    const s = bag();
    if (s.quotaDate !== today()) { s.quotaDate = today(); s.reportsToday = 0; }
    return Math.max(0, REPORT_DAILY_QUOTA - (s.reportsToday || 0));
  }
  const ref = (prefix, n) => `${prefix}-${String(n).padStart(4, "0")}`;

  function statusPill(v) {
    const tone = STATUS_TONE[v] || "slate";
    const cls = tone === "closed" ? "pill sf-closed" : "pill " + tone;
    return `<span class="${cls}">${esc(STATUS_LABEL[v] || v)}</span>`;
  }
  function priorityPill(v) {
    return `<span class="pill sf-closed">${esc(STATUS_LABEL[v] || v)}</span>`;
  }
  const openRefundFor = id => bag().refunds.find(r => r.bookingId === id && REFUND_OPEN.includes(r.status));
  const paymentEligible = b => !!b && REFUND_ELIGIBLE_PAYMENT.includes(b.paymentStatus);
  const booking = id => (S.bookings || []).find(b => b.id === id);
  const providers = () => {
    const seen = new Map();
    PROGRAMS.forEach(p => { if (!seen.has(p.biz)) seen.set(p.biz, p.id); });
    return [...seen.entries()];
  };

  function targetLabel(m) {
    if (m.providerId) {
      const p = PROGRAMS.find(x => x.id === m.providerId);
      return p ? `${p.biz} — ${p.title}` : String(m.providerId);
    }
    if (m.bookingId) {
      const b = booking(m.bookingId);
      return b ? `${b.program} · ${b.athlete}` : String(m.bookingId);
    }
    if (m.conversationId) {
      const c = (S.conversations || []).find(x => x.id === m.conversationId);
      return c ? `Conversation with ${c.with}` : String(m.conversationId);
    }
    return "";
  }
  function reportTargetLabel(r) {
    return targetLabel({ providerId: r.providerId, bookingId: r.bookingId, conversationId: r.conversationId }) || "—";
  }

  /* modal chrome — the host's exact pattern; body content is ours */
  function wrap(title, body) {
    return `<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><b>${esc(title)}</b><button class="x" data-close="1" aria-label="Close">${ICON.x}</button></div><div class="modal-body"><div class="sf-body">${body}</div></div></div></div>`;
  }
  function counter(id, n, min, max) {
    return `<div class="sf-count num" id="${id}">${n} / ${max} characters · ${min} minimum</div>`;
  }

  /* ═══════════════════ MODAL · SAFETY REPORT ═══════════════════ */
  function reportModal() {
    const m = S.modal || {};
    const left = reportsLeft();
    const known = !!(m.providerId || m.bookingId || m.conversationId);

    if (left <= 0) {
      return wrap("Report a safety concern", `
        <div class="sf-note sf-note-warn">
          <h3>Safety report limit reached</h3>
          <p>You have filed ${REPORT_DAILY_QUOTA} reports today, which is the daily limit on this account.
             The limit resets tomorrow and none of your open reports are affected.</p>
        </div>
        <p class="sf-fine">If something is happening right now that puts a child at risk, contact your
           local emergency services first, then follow up here.</p>
        <button class="btn ghost wide" data-close="1">Close</button>`);
    }

    return wrap("Report a safety concern", `
      <div class="sf-note sf-note-warn">
        <b>If anyone is in immediate danger, call local emergency services first.</b>
        <p>Sporve reviews every report, but we are not an emergency service.</p>
      </div>

      <form id="sfReportForm" novalidate>
        ${known ? `
          <div class="sf-target">
            <span class="eyebrow">Report about</span>
            <b>${esc(targetLabel(m))}</b>
          </div>`
        : `
          <div class="field">
            <label for="sfReportTarget">Who or what is this about</label>
            <select id="sfReportTarget" name="target" required>
              <option value="">Select a provider, booking, or conversation</option>
              <optgroup label="Providers">
                ${providers().map(([biz, id]) => `<option value="provider:${esc(id)}">${esc(biz)}</option>`).join("")}
              </optgroup>
              ${(S.bookings || []).length ? `<optgroup label="Bookings">
                ${(S.bookings || []).map(b => `<option value="booking:${esc(b.id)}">${esc(b.program)} · ${esc(fmtDate(b.date))}</option>`).join("")}
              </optgroup>` : ""}
              ${(S.conversations || []).length ? `<optgroup label="Conversations">
                ${(S.conversations || []).map(c => `<option value="conversation:${esc(c.id)}">${esc(c.with)}</option>`).join("")}
              </optgroup>` : ""}
            </select>
          </div>`}

        <div class="field">
          <label for="sfReportCategory">What happened</label>
          <select id="sfReportCategory" name="category">
            ${CATEGORIES.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label for="sfReportDetails">Details</label>
          <textarea id="sfReportDetails" name="details" rows="6"
            placeholder="When it happened, who was involved, and what you saw or heard."></textarea>
          ${counter("sfReportCount", 0, DETAILS_MIN, DETAILS_MAX)}
        </div>

        <div id="sfReportErr" class="err hide"></div>

        <button class="btn wide" type="submit">Submit report</button>
        <p class="sf-fine num">${left} of ${REPORT_DAILY_QUOTA} reports left today ·
          Reports arrive untriaged and are read by a person.</p>
      </form>`);
  }

  /* ═══════════════════ MODAL · REFUND REQUEST ═══════════════════ */
  function refundModal() {
    const m = S.modal || {};
    const b = m.bookingId ? booking(m.bookingId) : null;

    if (m.bookingId && !b) {
      return wrap("Request a refund", `
        <div class="sf-note"><h3>We can't find that booking</h3>
          <p>It may have been removed from your account. Open Bookings and try again from there.</p></div>
        <button class="btn ghost wide" data-close="1">Close</button>`);
    }

    if (b && !paymentEligible(b)) {
      const why = PAYMENT_REASON[b.paymentStatus] || `its payment status is “${b.paymentStatus}”`;
      return wrap("Request a refund", `
        <div class="sf-note sf-note-warn">
          <h3>This booking isn't refundable through this form</h3>
          <p><b>${esc(b.program)}</b> can't be refunded because ${esc(why)}.
             A refund can only be requested for a booking that is <b>paid</b> or <b>partially refunded</b>.</p>
        </div>
        <p class="sf-fine">If money did leave your account for this booking, file a safety report under
           <b>Payment dispute</b> and our team will trace the charge.</p>
        <button class="btn wide" data-sf-open="report" ${b.id ? `data-sf-booking="${esc(b.id)}"` : ""}>Report a payment dispute</button>
        <button class="btn ghost wide sf-gap" data-close="1">Close</button>`);
    }

    if (b) {
      const open = openRefundFor(b.id);
      if (open) {
        return wrap("Request a refund", `
          <div class="sf-note">
            <h3>A refund request is already open</h3>
            <p>Request <b class="num">${esc(open.ref)}</b> for <b>${esc(b.program)}</b> is
               ${esc((STATUS_LABEL[open.status] || open.status).toLowerCase())}.
               Only one request can be open per booking, so this one has to close before you can file another.</p>
            <div class="sf-gap">${statusPill(open.status)}</div>
          </div>
          <button class="btn ghost wide" data-nav="trust">See request status</button>`);
      }
    }

    /* no booking passed in — let them pick, showing why ineligible ones are blocked */
    const list = S.bookings || [];
    const pickable = list.filter(x => paymentEligible(x) && !openRefundFor(x.id));
    if (!b && !pickable.length) {
      return wrap("Request a refund", `
        <div class="sf-note">
          <h3>Nothing to refund right now</h3>
          <p>Refunds apply to bookings that are <b>paid</b> or <b>partially refunded</b> and don't already
             have an open request. None of your bookings match that today.</p>
        </div>
        <button class="btn ghost wide" data-nav="bookings">View bookings</button>`);
    }

    const amount = b ? money(b.price) : null;
    return wrap("Request a refund", `
      <form id="sfRefundForm" novalidate>
        ${b ? `
          <div class="sf-target">
            <span class="eyebrow">Booking</span>
            <b>${esc(b.program)}</b>
            <span class="sf-meta num">${esc(b.athlete)} · ${esc(fmtDate(b.date))} · ${esc(b.startTime || "")}</span>
          </div>
          <div class="linerow"><span>Paid</span><span class="num">${amount}</span></div>
          <div class="linerow"><span>Payment status</span><span class="pill slate">${esc(b.paymentStatus)}</span></div>`
        : `
          <div class="field">
            <label for="sfRefundBooking">Booking</label>
            <select id="sfRefundBooking" name="bookingId" required>
              <option value="">Select a booking</option>
              ${list.map(x => {
                const openReq = openRefundFor(x.id);
                const bad = !paymentEligible(x) ? "not eligible" : openReq ? "request already open" : "";
                return `<option value="${esc(x.id)}" ${bad ? "disabled" : ""}>${esc(x.program)} · ${esc(fmtDate(x.date))} · ${money(x.price)}${bad ? ` — ${bad}` : ""}</option>`;
              }).join("")}
            </select>
          </div>`}

        <div class="field">
          <label for="sfRefundReason">Why you're asking for a refund</label>
          <textarea id="sfRefundReason" name="reason" rows="5"
            placeholder="What went wrong, and what you'd like to happen."></textarea>
          ${counter("sfRefundCount", 0, REASON_MIN, REASON_MAX)}
        </div>

        <div id="sfRefundErr" class="err hide"></div>

        <button class="btn wide" type="submit">Submit request</button>
        <p class="sf-fine">Requests are reviewed before any money moves. A review can end in a full refund,
          a partial refund, or a denial with a written reason — and only one request stays open per booking.</p>
      </form>`);
  }

  /* ═══════════════════ MODAL · PRIVACY REQUEST ═══════════════════ */
  function privacyModal() {
    return wrap("Make a privacy request", `
      <form id="sfPrivacyForm" novalidate>
        <p class="sf-lede">Choose what you want to happen to the data Sporve holds about you and
          the athletes on your account.</p>

        <div class="sf-choices" role="radiogroup" aria-label="Request type">
          ${PRIVACY_TYPES.map(([v, l, d], i) => `
            <label class="sf-choice">
              <input type="radio" name="type" value="${v}" ${i === 0 ? "checked" : ""}>
              <span class="sf-choice-in"><b>${esc(l)}</b><span>${esc(d)}</span></span>
            </label>`).join("")}
        </div>

        <div id="sfPrivacyDeletion" class="sf-note sf-note-warn hide">
          <h3>Deletion is reviewed as a case, not an instant delete</h3>
          <p>We verify who you are, then work through the request record by record. Financial records
             (payments, refunds, payouts) and safety records (reports and their investigations) are kept
             under legal hold and survive a deletion — we are required to retain them. Everything outside
             that hold is removed, and we write back to tell you exactly what stayed and why.</p>
        </div>

        <div class="field sf-gap">
          <label for="sfPrivacyDetails">Details <span class="sf-optional">(required for a correction)</span></label>
          <textarea id="sfPrivacyDetails" name="details" rows="4"
            placeholder="Which records, and what should change."></textarea>
          <div class="sf-count num" id="sfPrivacyCount">0 / ${PRIVACY_MAX} characters</div>
        </div>

        <div id="sfPrivacyErr" class="err hide"></div>

        <button class="btn wide" type="submit">Submit request</button>
        <p class="sf-fine">Every request starts as <b>submitted</b> and passes an <b>identity check</b>
          before it is fulfilled — that step exists so nobody else can pull your family's records.</p>
      </form>`);
  }

  /* ═══════════════════ VIEW · TRUST &amp; SAFETY ═══════════════════ */
  function trustView() {
    const s = bag();
    const sub = typeof subnavHTML === "function" ? subnavHTML() : "";
    const left = reportsLeft();
    const paid = (S.bookings || []).filter(paymentEligible);

    const reportRows = s.reports.map(r => `<tr>
      <td class="num">${esc(r.ref)}</td>
      <td class="num">${esc(fmtDate(r.createdAt))}</td>
      <td>${esc(CATEGORY_LABEL[r.category] || r.category)}</td>
      <td>${esc(reportTargetLabel(r))}</td>
      <td>${priorityPill(r.priority)}</td>
      <td>${statusPill(r.status)}</td></tr>`).join("");

    const refundRows = s.refunds.map(r => {
      const b = booking(r.bookingId);
      return `<tr>
        <td class="num">${esc(r.ref)}</td>
        <td class="num">${esc(fmtDate(r.createdAt))}</td>
        <td>${esc(b ? b.program : r.bookingId)}</td>
        <td class="num">${b ? money(b.price) : "—"}</td>
        <td>${statusPill(r.status)}</td></tr>`;
    }).join("");

    const privacyRows = s.privacy.map(r => `<tr>
      <td class="num">${esc(r.ref)}</td>
      <td class="num">${esc(fmtDate(r.createdAt))}</td>
      <td>${esc(PRIVACY_LABEL[r.type] || r.type)}</td>
      <td>${statusPill(r.status)}</td></tr>`).join("");

    const table = (head, rows, empty, label) => rows
      ? `<div class="tblwrap"><table class="tbl" aria-label="${esc(label)}">
           <thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
           <tbody>${rows}</tbody></table></div>`
      : `<p class="sf-none">${esc(empty)}</p>`;

    return `${sub}<main class="shell sf-wrap">
      <div class="sec-head"><div>
        <p class="eyebrow">Trust &amp; Safety</p>
        <h1>Who is checked, and what to do when something goes wrong</h1>
        <p class="sf-lede">Every request you file here is tracked with a reference and a status you can
          follow. Nothing is closed silently.</p>
      </div></div>

      <div class="sf-note sf-note-warn sf-emergency" role="note">

  /* ═══════════════════ WIRING ═══════════════════ */
  function bindCounter(taId, outId, min, max) {
    const ta = document.getElementById(taId);
    const out = document.getElementById(outId);
    if (!ta || !out) return;
    const upd = () => {
      const n = ta.value.trim().length;
      out.textContent = min
        ? `${n} / ${max} characters · ${min} minimum`
        : `${n} / ${max} characters`;
      out.classList.toggle("out", n > max || (n > 0 && n < min));
    };
    ta.oninput = upd;
    upd();
  }
  function showErr(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.remove("hide");
  }

  function wire() {
    const all = sel => document.querySelectorAll(sel);

    /* open our modals — behind the host's auth gate, intent resumes after sign-in */
    all("[data-sf-open]").forEach(btn => btn.onclick = () => {
      const type = btn.dataset.sfOpen;
      const next = {
        type,
        providerId: btn.dataset.sfProvider || null,
        bookingId: btn.dataset.sfBooking || null,
        conversationId: btn.dataset.sfConversation || null,
      };
      requireAuth(() => { S.modal = next; render(); });
    });

    /* our modal's close affordances (the host's handler misses clicks on the icon) */
    const mine = document.querySelector(".sf-body");
    if (mine) {
      const scrim = mine.closest(".scrim");
      if (scrim) {
        const x = scrim.querySelector(".x[data-close]");
        if (x) x.onclick = () => { S.modal = null; render(); };
        scrim.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { S.modal = null; render(); });
        scrim.onclick = e => { if (e.target === scrim) { S.modal = null; render(); } };
      }
    }

    bindCounter("sfReportDetails", "sfReportCount", DETAILS_MIN, DETAILS_MAX);
    bindCounter("sfRefundReason", "sfRefundCount", REASON_MIN, REASON_MAX);
    bindCounter("sfPrivacyDetails", "sfPrivacyCount", 0, PRIVACY_MAX);

    /* ── report submit ── */
    const rf = document.getElementById("sfReportForm");
    if (rf) rf.onsubmit = e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(rf));
      const m = S.modal || {};
      const s = bag();

      if (reportsLeft() <= 0) return showErr("sfReportErr", "Safety report limit reached");

      let providerId = m.providerId || null,
          bookingId = m.bookingId || null,
          conversationId = m.conversationId || null;
      if (!providerId && !bookingId && !conversationId) {
        const [kind, id] = String(d.target || "").split(":");
        if (!id) return showErr("sfReportErr", "Choose the provider, booking, or conversation this report is about.");
        if (kind === "provider") providerId = id;
        else if (kind === "booking") bookingId = id;
        else conversationId = id;
      }

      const details = String(d.details || "").trim();
      if (details.length < DETAILS_MIN || details.length > DETAILS_MAX)
        return showErr("sfReportErr", "Details must be 10 to 4000 characters.");

      const category = CATEGORY_LABEL[d.category] ? d.category : "other";
      const r = {
        id: "rep_" + Date.now(),
        ref: ref("SR", s.reports.length + 1),
        category, details, providerId, bookingId, conversationId,
        status: "submitted", priority: "untriaged",
        createdAt: today(), at: nowISO(),
      };
      s.reports = [r, ...s.reports];
      s.reportsToday = (s.reportsToday || 0) + 1;
      S.modal = null;
      render();
      toast(`Safety report ${r.ref} submitted`);
    };

    /* ── refund submit ── */
    const ff = document.getElementById("sfRefundForm");
    if (ff) ff.onsubmit = e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(ff));
      const s = bag();
      const id = (S.modal && S.modal.bookingId) || d.bookingId || "";
      const b = booking(id);

      if (!b) return showErr("sfRefundErr", "Choose the booking you want refunded.");
      if (!paymentEligible(b))
        return showErr("sfRefundErr", "Only a paid or partially refunded booking can be refunded.");
      if (openRefundFor(b.id))
        return showErr("sfRefundErr", "A refund request is already open for this booking.");

      const reason = String(d.reason || "").trim();
      if (reason.length < REASON_MIN || reason.length > REASON_MAX)
        return showErr("sfRefundErr", "Reason must be 10 to 2000 characters.");

      const r = {
        id: "ref_" + Date.now(),
        ref: ref("RR", s.refunds.length + 1),
        bookingId: b.id, reason, amount: b.price,
        status: "submitted", createdAt: today(), at: nowISO(),
      };
      s.refunds = [r, ...s.refunds];
      S.modal = null;
      render();
      toast(`Refund request ${r.ref} submitted`);
    };

    /* ── privacy: live deletion notice + submit ── */
    const pf = document.getElementById("sfPrivacyForm");
    if (pf) {
      const notice = document.getElementById("sfPrivacyDeletion");
      const sync = () => {
        const v = (pf.querySelector('input[name="type"]:checked') || {}).value;
        if (notice) notice.classList.toggle("hide", v !== "deletion");
        pf.querySelectorAll(".sf-choice").forEach(l => {
          const i = l.querySelector("input");
          l.classList.toggle("on", !!i && i.checked);
        });
      };
      pf.querySelectorAll('input[name="type"]').forEach(i => i.onchange = sync);
      sync();

      pf.onsubmit = e => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(pf));
        const s = bag();
        const type = PRIVACY_LABEL[d.type] ? d.type : "access";
        const details = String(d.details || "").trim();

        if (details.length > PRIVACY_MAX)
          return showErr("sfPrivacyErr", `Details must be ${PRIVACY_MAX} characters or fewer.`);
        if (type === "correction" && details.length < DETAILS_MIN)
          return showErr("sfPrivacyErr", "Tell us what is incorrect — at least 10 characters.");

        const r = {
          id: "prv_" + Date.now(),
          ref: ref("PR", s.privacy.length + 1),
          type, details, status: "submitted",
          createdAt: today(), at: nowISO(),
        };
        s.privacy = [r, ...s.privacy];
        S.modal = null;
        render();
        toast(type === "deletion"
          ? `Deletion case ${r.ref} opened for review`
          : `Privacy request ${r.ref} submitted`);
      };
    }
  }

/* ═══════════════════ state plumbing ═══════════════════ */
function ensure(){
  if(typeof S==="undefined") return;
  if(!Array.isArray(S.reviews)) S.reviews=REVIEWS.map(r=>({...r}));
  if(!Array.isArray(S.goals))   S.goals=GOALS.map(g=>({...g}));
}
const allReviews=()=>{ensure();return (typeof S!=="undefined"&&Array.isArray(S.reviews))?S.reviews:REVIEWS;};
const allGoals=()=>{ensure();return (typeof S!=="undefined"&&Array.isArray(S.goals))?S.goals:GOALS;};
const prog=id=>PROGRAMS.find(p=>p.id===id);

const initialsOf=name=>String(name).trim().split(/\s+/).map(w=>w[0]||"").slice(0,2).join("").toUpperCase();
const authorName=u=>u?`${u.firstName} ${u.lastName?u.lastName[0]+".":""}`.trim():"You";
const athleteLabel=a=>`${a.firstName} ${a.lastName||""}`.trim();

/* the host's family tab rail, when this module's view is routed as a tab */
function nav(){
  return (typeof subnavHTML==="function"&&typeof S!=="undefined"&&S.portal!=="coach")?subnavHTML():"";
}

/* ═══════════════════ shared bits ═══════════════════ */
function starRow(n,extra){
  const r=Math.round(n);
  return `<span class="rv-stars ${extra||""}" role="img" aria-label="${Number(n).toFixed(1)} out of 5 stars">`+
    [1,2,3,4,5].map(i=>`<span class="${i<=r?"":"off"}" aria-hidden="true">${ICON.star}</span>`).join("")+`</span>`;
}
function aggregate(list){
  const total=list.length;
  const sum=list.reduce((s,r)=>s+r.rating,0);
  const dist=[5,4,3,2,1].map(v=>({v,n:list.filter(r=>r.rating===v).length}));
  return {total,avg:total?sum/total:0,dist};
}
/* a completed booking is the only ticket to writing a review */
function completedBooking(pid){
  if(typeof S==="undefined") return null;
  return (S.bookings||[]).find(b=>b.programId===pid&&
    (b.status==="completed"||(b.status==="confirmed"&&b.date<=TODAY)))||null;
}
function eligibility(pid){
  ensure();
  if(!isVerified()) return {ok:false,why:"guest"};
  if(!completedBooking(pid)) return {ok:false,why:"nosession"};
  const me=authorName(S.auth.user);
  if(allReviews().some(r=>r.programId===pid&&r.author===me)) return {ok:false,why:"already"};
  return {ok:true};
}

/* ═══════════════════ 1 · reviews block ═══════════════════ */
function reviewsFor(programId){
  ensure();
  const p=prog(programId);
  if(!p) return "";
  const list=allReviews().filter(r=>r.programId===programId)
    .slice().sort((a,b)=>b.date.localeCompare(a.date));
  const {total,avg,dist}=aggregate(list);
  const el=eligibility(programId);
  const cta=
    el.ok
      ? `<button class="btn ghost sm" data-writereview="${esc(programId)}">Write a review</button>`
      : el.why==="guest"
        ? `<button class="btn ghost sm" data-signin="1">Log in to review</button>`
        : el.why==="already"
          ? `<span class="pill good">${ICON.check} You reviewed this</span>`
          : `<span class="pill slate">Attend a session to review</span>`;
  const why=
    el.ok?`You attended a session here — your review will carry a verified-booking mark.`
    :el.why==="guest"?`Only families with a completed booking on Sporve can review a program.`
    :el.why==="already"?`One review per family, per program. Message the coach for anything else.`
    :`Reviews unlock after your athlete has attended a session with ${esc(p.biz)}. It keeps the ratings worth reading.`;

  return `<section class="rv-wrap" aria-label="Reviews">
    <div class="sec-head" style="margin-bottom:0"><h2>Reviews</h2>${cta}</div>
    ${total?`
    <div class="rv-agg">
      <div>
        <div class="rv-score num">${avg.toFixed(1)}</div>
        ${starRow(avg)}
        <div class="num rv-sub">${total} review${total===1?"":"s"} · catalogue rating ${p.rating}</div>
      </div>
      <div class="rv-hist">
        ${dist.map(d=>`<div class="rv-hrow">
          <span class="num rv-hlbl">${d.v} star${d.v===1?"":"s"}</span>
          <span class="rv-track"><span class="rv-fill" style="width:${total?((d.n/total)*100).toFixed(1):0}%"></span></span>
          <span class="num rv-hn">${d.n}</span>
        </div>`).join("")}
      </div>
    </div>
    <div class="rv-list">
      ${list.map(r=>`<article class="rv-item">
        <span class="avatar rv-av" aria-hidden="true">${esc(r.initials)}</span>
        <div class="rv-body">
          <div class="rv-meta">
            <b>${esc(r.author)}</b>
            ${r.verifiedBooking?`<span class="pill good">${ICON.check} Verified booking</span>`:""}
            <span class="num rv-date">${fmtDate(r.date)}</span>
          </div>
          ${starRow(r.rating)}
          <p class="rv-text">${esc(r.body)}</p>
        </div>
      </article>`).join("")}
    </div>`
    :`<div class="rv-agg rv-agg-empty">
        <div><div class="rv-score num">—</div>${starRow(0)}
          <div class="num rv-sub">No written reviews yet</div></div>
        <p class="rv-none">This program carries a catalogue rating of ${p.rating} from ${p.reviews} historical ratings, but nobody has written a review on Sporve yet. Families who complete a session here can be the first.</p>
      </div>`}
    <p class="rv-note">${why}</p>
  </section>`;
}

function sportOf(a){
  if(a.preferredSports&&a.preferredSports.length) return a.preferredSports[0];
  const b=(S.bookings||[]).find(x=>x.athlete===athleteLabel(a));
  const p=b&&prog(b.programId);
  return p?p.sport:null;
}
function milestonesFor(sport,anchor){
  const f=focusFor(sport);
  const s=sport||"training";
  return [
    {off:9,title:`Baseline assessment logged`,
     body:`Staff recorded a first read on where ${s.toLowerCase()} stands today: ${f[0][0].toLowerCase()} and ${f[0][1].toLowerCase()} came back as the two areas to build from.`,
     skills:[f[0][0],f[0][1]]},
    {off:31,title:`Technique held at game speed`,
     body:`${f[1][0]} carried out of drill work and into live reps without breaking down — the first real sign the pattern is sticking rather than being remembered.`,
     skills:[f[1][0],f[1][1]]},
    {off:58,title:`First competitive application`,
     body:`${f[2][0]} showed up unprompted in a scrimmage setting. The next block shifts toward ${f[2][1].toLowerCase()}.`,
     skills:[f[2][0],f[2][1]]},
  ].map(m=>({date:addDays(anchor,m.off),kind:"Milestone",title:m.title,body:m.body,skills:m.skills}));
}
function entriesFor(a){
  const name=athleteLabel(a);
  const out=[];
  (S.bookings||[]).filter(b=>b.athlete===name).forEach(b=>{
    const p=prog(b.programId);
    out.push({date:b.date,kind:"Session attended",title:b.program,
      body:`${b.session} at ${b.startTime}${p?` with ${p.biz}`:""} · ${b.tier} tier${p?` · ${p.skill} group, ages ${p.minAge}–${p.maxAge}`:""}.`,
      skills:[]});
  });
  const updates=(typeof SEED!=="undefined"&&SEED.parentUpdates)?SEED.parentUpdates:[];
  updates.filter(u=>u.childId===a.id).forEach(u=>{
    out.push({date:String(u.at).slice(0,10),kind:"Coach update",
      title:u.signal?u.signal.charAt(0).toUpperCase()+u.signal.slice(1):"Progress update",
      body:u.body,skills:u.skills||[],
      practice:(u.practice||[])[0]||"",encouragement:u.encouragement||""});
  });
  const anchor=out.length?out.map(e=>e.date).sort()[0]:"2026-05-01";
  milestonesFor(sportOf(a),anchor).forEach(m=>{if(m.date<=TODAY) out.push(m);});
  return out.sort((x,y)=>y.date.localeCompare(x.date));
}

/* ═══════════════════ 4 · goal intake + plan ═══════════════════ */
const SPORTS_WITH_LISTINGS=()=>[...new Set(PROGRAMS.map(p=>p.sport))].sort();

function planFor(g){
  const a=(S.athletes||[]).find(x=>x.id===g.athleteId);
  const age=a?ageOf(a.dob):null;
  const weeks=Math.max(3,weeksBetween(TODAY,g.target));
  let wF=Math.max(1,Math.round(weeks*0.40));
  let wB=Math.max(1,Math.round(weeks*0.35));
  if(wF+wB>=weeks){wF=Math.max(1,weeks-2);wB=1;}
  const wC=Math.max(1,weeks-wF-wB);
  const f=focusFor(g.sport);
  const phases=[
    {name:"Foundation",weeks:wF,focus:f[0],note:"Build the base the rest of the plan leans on."},
    {name:"Build",weeks:wB,focus:f[1],note:"Add difficulty while the fundamentals hold."},
    {name:"Compete",weeks:wC,focus:f[2],note:"Rehearse the thing you're actually training for."},
  ];
  const picks=PROGRAMS
    .filter(p=>p.verified===true&&p.sport===g.sport&&(age==null||(age>=p.minAge&&age<=p.maxAge)))
    .sort((x,y)=>(y.rating-x.rating)||(x.price-y.price))
    .slice(0,3);
  return {age,weeks,phases,picks,athlete:a,sessions:weeks*g.weekly};
}
function costLine(p,weeks,sessions){
  if(p.model==="single_session") return `≈ ${money(p.price*sessions)} across ${sessions} sessions`;
  if(p.model==="monthly"){const mo=Math.max(1,Math.ceil(weeks/4));return `≈ ${money(p.price*mo)} across ${mo} month${mo===1?"":"s"}`;}
  return `${money(p.price)} ${MODEL_LABEL[p.model]||p.model}`;
}

function submitGoal(form,errEl){
  const d=Object.fromEntries(new FormData(form));
  const show=m=>{if(errEl){errEl.textContent=m;errEl.classList.remove("hide");}};
  const outcome=String(d.outcome||"").trim();
  if(outcome.length<6) return show("Describe the outcome in a few more words.");
  if(!d.athleteId) return show("Choose which athlete this is for.");
  if(!d.target) return show("Pick a target date.");
  if(d.target<=TODAY) return show("The target date needs to be in the future.");
  const g={id:"goal_"+Date.now(),athleteId:d.athleteId,outcome,sport:d.sport,
    target:d.target,weekly:+d.weekly||2,createdAt:TODAY};
  ensure();
  S.goals=[g,...S.goals];
  S.modal=null;
  render();
  toast("Plan built from the catalogue");
}
function wire(){
  ensure();
  const $=s=>document.querySelectorAll(s);

  $("[data-writereview]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.writereview;
    requireAuth(()=>{S.modal={type:"review",programId:id};render();});
  });
  $("[data-goalintake]").forEach(b=>b.onclick=()=>{
    requireAuth(()=>{S.modal={type:"goalintake"};render();});
  });
  $("[data-goaldrop]").forEach(b=>b.onclick=()=>{
    S.goals=allGoals().filter(g=>g.id!==b.dataset.goaldrop);
    render();toast("Goal removed");
  });

  /* review form — live counter, star word, validation */
  const body=document.getElementById("rvBody");
  const count=document.getElementById("rvCount");
  const paint=()=>{
    if(!body||!count) return;
    const n=body.value.length;
    count.textContent=n<20
      ? `${n} / 2000 · ${20-n} more character${20-n===1?"":"s"} needed`
      : `${n} / 2000`;
    count.classList.toggle("short",n<20);
  };
  if(body){body.oninput=paint;paint();}
  const word=document.getElementById("rvWord");
  document.querySelectorAll('.rv-pick input[name="rating"]').forEach(r=>{
    r.onchange=()=>{
      if(word) word.textContent=`${r.value} of 5 — ${RATING_WORD[r.value]}`;
      const e=document.getElementById("rvErr"); if(e) e.classList.add("hide");
    };
  });

  const rf=document.getElementById("reviewForm");
  if(rf) rf.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(rf));
    const err=document.getElementById("rvErr");
    const show=m=>{err.textContent=m;err.classList.remove("hide");};
    const pid=S.modal&&S.modal.programId;
    if(!d.rating) return show("Pick a star rating from 1 to 5.");
    const text=String(d.body||"").trim();
    if(text.length<20) return show("Write at least 20 characters — enough for another parent to learn something.");
    if(text.length>2000) return show("Reviews are capped at 2,000 characters.");
    if(!eligibility(pid).ok) return show("This program is no longer open for a review from your account.");
    const u=S.auth.user;
    const author=authorName(u);
    S.reviews=[{id:"rev_"+Date.now(),programId:pid,author,initials:initialsOf(author),
      rating:+d.rating,date:TODAY,body:text,verifiedBooking:true},...allReviews()];
    S.modal=null;
    render();
    toast("Review posted");
  };

  const gf=document.getElementById("goalForm");
  if(gf) gf.onsubmit=e=>{e.preventDefault();submitGoal(gf,document.getElementById("goalForm_err"));};
  const gm=document.getElementById("goalFormModal");
  if(gm) gm.onsubmit=e=>{e.preventDefault();submitGoal(gm,document.getElementById("goalFormModal_err"));};
}

/* ═══════════════════ DERIVED LOGIC ═══════════════════ */

/* An offer that ran past its 24-hour window reads as expired without
   anyone having to touch the record. */
function effStatus(e){
  if (e.status === "offered" && e.expiresAt && new Date(e.expiresAt) <= NOW()) return "expired";
  return e.status;
}
const STATUS_PILL = { waiting: ["slate", "Waiting"], offered: ["warn", "Offer sent"],
  accepted: ["good", "Accepted"], expired: ["warn", "Offer expired"] };

/* Queue position within a program, oldest first. Only an athlete who
   accepted has left the line — an expired offer keeps its place and can
   be re-offered. */
function position(e){
  const peers = state.waitlistEntries
    .filter(x => x.programId === e.programId && effStatus(x) !== "accepted")
    .sort((a, b) => a.joinedAt.localeCompare(b.joinedAt));
  const i = peers.findIndex(x => x.id === e.id);
  return i < 0 ? null : i + 1;
}
function statusCounts(){
  const c = { waiting: 0, offered: 0, accepted: 0, expired: 0 };
  state.waitlistEntries.forEach(e => { c[effStatus(e)]++; });
  return c;
}

/* Two rules clash when they fall on the same weekday, their effective
   date windows overlap, and their time ranges genuinely intersect.
   The reported overlap is the real intersection, in minutes. */
function windowsOverlap(a, b){
  const aFrom = a.effectiveFrom || "0000-01-01", aTo = a.effectiveUntil || "9999-12-31";
  const bFrom = b.effectiveFrom || "0000-01-01", bTo = b.effectiveUntil || "9999-12-31";
  return aFrom <= bTo && bFrom <= aTo;
}
function conflicts(){
  const out = [], rs = state.recurringSlots;
  for (let i = 0; i < rs.length; i++){
    for (let j = i + 1; j < rs.length; j++){
      const a = rs[i], b = rs[j];
      if (a.weekday !== b.weekday) continue;
      if (!windowsOverlap(a, b)) continue;
      const s = Math.max(toMin(a.start), toMin(b.start));
      const e = Math.min(toMin(a.end), toMin(b.end));
      if (isNaN(s) || isNaN(e) || s >= e) continue;
      out.push({ a: a, b: b, start: fromMin(s), end: fromMin(e), minutes: e - s });
    }
  }
  return out;
}
const covers = (r, weekday, hour) =>
  r.weekday === weekday && toMin(r.start) < (hour + 1) * 60 && toMin(r.end) > hour * 60;
function rulesAt(weekday, hour){ return state.recurringSlots.filter(r => covers(r, weekday, hour)); }
function clashAt(weekday, hour){
  return conflicts().some(c =>
    c.a.weekday === weekday && toMin(c.start) < (hour + 1) * 60 && toMin(c.end) > hour * 60);
}
const GRID_START = 7, GRID_END = 21;                       // 7am → 9pm rows

      <div class="co-week" role="group" aria-label="Weekly recurring availability">
        <div></div>
        ${WD.map(w => `<div class="co-day">${w.s}</div>`).join("")}
        ${hours.map(h => `
          <div class="co-hh num">${esc(t12(fromMin(h * 60)))}</div>
          ${WD.map(w => {
            const rs = rulesAt(w.n, h), on = rs.length > 0, clash = on && clashAt(w.n, h);
            const p = on ? prog(rs[0].programId) : null;
            const tint = p ? `color-mix(in srgb,${sportColor(p.sport)} 22%,transparent)` : "transparent";
            const label = on
              ? `${w.l} ${t12(fromMin(h * 60))} — ${rs.map(r => (prog(r.programId) || {}).title || r.programId).join(", ")}. Clear this block.`
              : `${w.l} ${t12(fromMin(h * 60))} — open. Hold this hour.`;
            return `<button class="co-cell ${on ? "on" : ""} ${clash ? "clash" : ""}"
              style="--cc:${tint}" data-co-cell="${w.n}-${h}" aria-pressed="${on}"
              aria-label="${esc(label)}" title="${esc(label)}"></button>`;
          }).join("")}`).join("")}
      </div>
    </div>
    <div class="co-legend">
      <span><i style="background:var(--raise2);border:1px solid var(--rule)"></i>Open</span>
      ${[...new Set(rules.map(r => r.programId))].slice(0, 4).map(id => {
        const p = prog(id); if (!p) return "";
        return `<span><i style="background:color-mix(in srgb,${sportColor(p.sport)} 22%,transparent)"></i>${esc(p.title)}</span>`;
      }).join("")}
      <span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--danger)"></i>Conflict</span>
    </div>
  </div>

  <div class="sec-head" style="margin:26px 0 12px"><h3>Recurring rules</h3>
    <span class="num" style="color:var(--muted);font-size:13.5px">${rules.length} rule${rules.length === 1 ? "" : "s"}</span></div>

  ${rules.length ? `<div class="tblwrap panel" style="padding:18px"><table class="tbl">
    <thead><tr><th>Program</th><th>Day</th><th>Time</th><th>Capacity</th><th>Effective</th><th>Status</th><th></th></tr></thead>
    <tbody>${rules.map(r => {
      const p = prog(r.programId);
      const bad = cl.some(c => c.a.id === r.id || c.b.id === r.id);
      return `<tr>
        <td>${p ? `<b style="font-weight:600">${esc(p.title)}</b>
          <div style="margin-top:4px"><span class="pill" style="background:${sportColor(p.sport)}1A;color:${sportColor(p.sport)}">${esc(p.sport)}</span></div>`
          : `<span style="color:var(--muted)">${esc(r.programId)}</span>`}</td>
        <td>${esc(wdName(r.weekday))}</td>
        <td class="num">${esc(t12(r.start))} – ${esc(t12(r.end))}
          <div style="color:var(--muted);font-size:12.5px">${esc(durLabel(toMin(r.end) - toMin(r.start)))}</div></td>
        <td class="num">${r.capacity}</td>
        <td class="num">${esc(fmtDate(r.effectiveFrom))}
          <div style="color:var(--muted);font-size:12.5px">through ${esc(r.effectiveUntil ? fmtDate(r.effectiveUntil) : "no end date")}</div></td>
        <td>${bad ? `<span class="pill warn">Conflict</span>` : `<span class="pill good">Clear</span>`}</td>
        <td><button class="x" data-co-delslot="${esc(r.id)}"
          aria-label="Delete the ${esc(wdName(r.weekday))} ${esc(t12(r.start))} block">${ICON.x}</button></td>
      </tr>`;
    }).join("")}</tbody></table></div>`
  : `<div class="empty" style="border:1px solid var(--rule);border-radius:var(--r-l)">
      <p>No recurring blocks yet. Click any cell above, or add one with the full form.</p></div>`}`;
}

  <div style="margin-top:18px">

              aria-label="Send the ${esc(label)} message automatically">
            <span class="co-track" aria-hidden="true"><span class="co-knob"></span></span>

        <div class="co-body">

            <button type="button" class="co-chip" data-co-reset="${esc(k)}"

          </div>
          <div class="err ${bad.length ? "" : "hide"}" data-co-warn="${esc(k)}">${

          <div class="co-prevbox">
            <div class="eyebrow">Preview</div>
            <p data-co-preview="${esc(k)}">${esc(substitute(m.body))}</p>
          </div>
        </div>
      </div>`;
    }).join("")}
  </div>
  <button class="btn" data-co-savemsg="1">Save message settings</button>`;
}

/* ═══════════════════ WIRING ═══════════════════ */
function ensureCSS(){
  if (document.getElementById("mod-coachops-css")) return;
  const el = document.createElement("style");
  el.id = "mod-coachops-css";
  el.textContent = CSS;
  document.head.appendChild(el);
}

/* Message previews repaint in place. A full render() would blow away the
   caret in the textarea the coach is typing into. */
function paint(trigger){
  const m = state.autoMessages.find(x => x.trigger === trigger);
  if (!m) return;
  const pv = document.querySelector('[data-co-preview="' + trigger + '"]');
  if (pv) pv.textContent = substitute(m.body);
  const wn = document.querySelector('[data-co-warn="' + trigger + '"]');
  if (wn){
    const bad = unknownTokens(m.body);
    if (bad.length){
      wn.textContent = "Unknown placeholder" + (bad.length > 1 ? "s" : "") + ": " +
        bad.map(b => "{{" + b + "}}").join(", ") + " — this will send as literal text.";
      wn.classList.remove("hide");
    } else {
      wn.textContent = "";
      wn.classList.add("hide");
    }
  }
}

function wire(){
  ensureCSS();
  const q = s => document.querySelectorAll(s);

  /* ── policies ─────────────────────────────────────────────────── */
  const readPolicy = (form, errId, partial) => {
    const d = Object.fromEntries(new FormData(form));
    const err = document.getElementById(errId);
    const show = msg => { if (err){ err.textContent = msg; err.classList.remove("hide"); } return false; };
    if (CANCEL.every(c => c[0] !== d.cancellation)) return show("Pick a cancellation policy.");
    const grace = Number(d.graceMinutes), fee = Number(d.noShowFee);
    if (!isFinite(grace) || grace < 0 || grace > 60) return show("Grace period must be between 0 and 60 minutes.");
    if (!isFinite(fee) || fee < 0) return show("A no-show fee cannot be negative.");
    const next = { cancellation: d.cancellation, graceMinutes: Math.round(grace), noShowFee: Math.round(fee) };
    if (!partial){
      const equip = String(d.equipment || "").trim();
      if (!equip) return show("Tell families what equipment they need to bring — this note is required.");
      const raw = String(d.minAgeOverride || "").trim();
      let minAge = null;
      if (raw !== ""){
        minAge = Number(raw);
        if (!isFinite(minAge) || minAge < 4 || minAge > 18) return show("A minimum age override must be between 4 and 18.");
        minAge = Math.round(minAge);
      }
      if (WEATHER.every(w => w[0] !== d.weather)) return show("Pick a weather and make-up policy.");
      next.weather = d.weather;
      next.minAgeOverride = minAge;
      next.equipment = equip;
    }
    Object.assign(state.policies, next, { savedAt: iso(NOW()) });
    if (err) err.classList.add("hide");
    return true;
  };

  const pf = document.getElementById("coPolicyForm");
  if (pf){
    pf.onsubmit = ev => {
      ev.preventDefault();
      if (readPolicy(pf, "coPolicyErr", false)){ render(); toast("Policies saved — families see the new terms"); }
    };
    pf.oninput = () => {
      const flag = document.getElementById("coDraftFlag");
      if (flag) flag.classList.remove("hide");
    };
  }
  const qf = document.getElementById("coQuickForm");
  if (qf) qf.onsubmit = ev => {
    ev.preventDefault();
    if (readPolicy(qf, "coQuickErr", true)){
      S.modal = null; S.coachTab = "policies"; render(); toast("Policy updated");
    }
  };

  /* ── waitlist ─────────────────────────────────────────────────── */
  q("[data-co-offer]").forEach(b => b.onclick = () => {
    S.modal = { type: "offerspot", entryId: b.dataset.coOffer };
    render();
  });
  q("[data-co-accept]").forEach(b => b.onclick = () => {
    const e = state.waitlistEntries.find(x => x.id === b.dataset.coAccept);
    if (!e || effStatus(e) !== "offered") return;
    e.status = "accepted";
    const p = prog(e.programId);
    if (p && p.enrolled < p.cap) p.enrolled += 1;      // the spot is now genuinely taken
    render();
    toast(e.athlete.split(" ")[0] + " accepted — enrolled");
  });
  const of = document.getElementById("coOfferForm");
  if (of) of.onsubmit = ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(of));
    const e = state.waitlistEntries.find(x => x.id === S.modal.entryId);
    if (!e){ S.modal = null; render(); return; }
    const now = NOW();
    e.status = "offered";
    e.via = d.via;
    e.note = String(d.note || "").trim() || null;
    e.offeredAt = iso(now);
    e.expiresAt = iso(new Date(now.getTime() + 24 * 3600 * 1000));
    S.modal = null;
    render();
    toast("Spot offered to " + e.athlete.split(" ")[0] + " — expires in 24 hours");
  };

  /* ── recurring slots ──────────────────────────────────────────── */
  q("[data-co-cell]").forEach(b => b.onclick = () => {
    const parts = String(b.dataset.coCell).split("-");
    const wd = Number(parts[0]), h = Number(parts[1]);
    const hit = rulesAt(wd, h);
    if (hit.length){
      const r = hit[0], p = prog(r.programId);
      state.recurringSlots = state.recurringSlots.filter(x => x.id !== r.id);
      render();
      toast("Cleared " + wdShort(wd) + " " + t12(r.start) + "–" + t12(r.end) +
        (p ? " · " + p.title : ""));
      return;
    }
    const base = myListings()[0] || PROGRAMS[0];
    state.recurringSlots = state.recurringSlots.concat([{
      id: "rs_" + Date.now(),
      programId: base.id,
      weekday: wd,
      start: fromMin(h * 60),
      end: fromMin(h * 60 + 60),
      capacity: base.cap,
      effectiveFrom: TODAY,
      effectiveUntil: "2026-12-18",
    }]);
    render();
    toast("Holding " + wdShort(wd) + " " + t12(fromMin(h * 60)) + " for " + base.title);
  });
  q("[data-co-delslot]").forEach(b => b.onclick = () => {
    const r = state.recurringSlots.find(x => x.id === b.dataset.coDelslot);
    if (!r) return;
    state.recurringSlots = state.recurringSlots.filter(x => x.id !== r.id);
    render();
    toast("Removed the " + wdShort(r.weekday) + " " + t12(r.start) + " block");
  });
  const sf = document.getElementById("coSlotForm");
  if (sf) sf.onsubmit = ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(sf));
    const err = document.getElementById("coSlotErr");
    const show = msg => { err.textContent = msg; err.classList.remove("hide"); return null; };
    const s = toMin(d.start), e = toMin(d.end);
    if (isNaN(s) || isNaN(e)) return show("Enter a start and an end time.");
    if (e <= s) return show("The block has to end after it starts.");
    const cap = Number(d.capacity);
    if (!isFinite(cap) || cap < 1) return show("Capacity must be at least 1.");
    if (d.effectiveUntil && d.effectiveUntil < d.effectiveFrom) return show("The end date falls before the start date.");
    const rule = {
      id: "rs_" + Date.now(),
      programId: d.programId,
      weekday: Number(d.weekday),
      start: fromMin(s),
      end: fromMin(e),
      capacity: Math.round(cap),
      effectiveFrom: d.effectiveFrom,
      effectiveUntil: d.effectiveUntil || null,
    };
    const before = conflicts().length;
    state.recurringSlots = state.recurringSlots.concat([rule]);
    const added = conflicts().length - before;
    S.modal = null; S.coachTab = "slots"; render();
    toast(added > 0
      ? "Block added — it conflicts with " + added + " existing block" + (added > 1 ? "s" : "")
      : "Recurring block added");
  };

  /* ── automated messages ───────────────────────────────────────── */
  q("[data-co-toggle]").forEach(cb => cb.onchange = () => {
    const k = cb.dataset.coToggle;
    const m = state.autoMessages.find(x => x.trigger === k);
    if (!m) return;
    m.enabled = cb.checked;
    const row = document.querySelector('[data-co-rowfor="' + k + '"]');
    if (row) row.classList.toggle("off", !m.enabled);
    const txt = document.querySelector('[data-co-swtxt="' + k + '"]');
    if (txt) txt.textContent = m.enabled ? "On" : "Off";
    toast(trigRow(k)[1] + (m.enabled ? " — on" : " — off"));
  });
  q("[data-co-body]").forEach(ta => ta.oninput = () => {
    const m = state.autoMessages.find(x => x.trigger === ta.dataset.coBody);
    if (!m) return;
    m.body = ta.value;
    paint(m.trigger);
  });
  q("[data-co-ins]").forEach(b => b.onclick = () => {
    const parts = String(b.dataset.coIns).split("|");
    const k = parts[0], token = "{{" + parts[1] + "}}";
    const ta = document.getElementById("coTa-" + k);
    const m = state.autoMessages.find(x => x.trigger === k);
    if (!ta || !m) return;
    const a = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
    const z = ta.selectionEnd == null ? a : ta.selectionEnd;
    ta.value = ta.value.slice(0, a) + token + ta.value.slice(z);
    m.body = ta.value;
    ta.focus();
    ta.setSelectionRange(a + token.length, a + token.length);
    paint(k);
  });
  q("[data-co-reset]").forEach(b => b.onclick = () => {
    const k = b.dataset.coReset;
    const def = seedMessages().find(x => x.trigger === k);
    const m = state.autoMessages.find(x => x.trigger === k);
    if (!def || !m) return;
    m.body = def.body;
    render();
    toast(trigRow(k)[1] + " reset to default");
  });
  q("[data-co-savemsg]").forEach(b => b.onclick = () => {
    const broken = state.autoMessages.filter(m => m.enabled && unknownTokens(m.body).length);
    if (broken.length){
      toast(broken.length + " enabled template" + (broken.length > 1 ? "s" : "") + " still use an unknown placeholder");
      return;
    }
    toast("Message settings saved");
  });
}

/* ═══════════════════ EXPORT ═══════════════════ */
window.MOD_COACHOPS = {
  css: CSS,
  tabs: { policies: "Policies", waitlist: "Waitlist", slots: "Recurring slots", messages: "Automated messages" },
  views: { policies: policiesView, waitlist: waitlistView, slots: slotsView, messages: messagesView },
  modals: { editpolicy: editPolicyModal, addslot: addSlotModal, offerspot: offerSpotModal },
  wire: wire,
  state: state,
};

})();

</script>
