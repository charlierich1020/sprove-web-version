}
function noteById(id){ return notes().find(n => n.id === id) || null; }
function noteForSession(sid){ return notes().find(n => n.sessionId === sid) || null; }

/* Completed sessions that still have nothing written against them. */
function pendingList(){
  const have = {};
  notes().forEach(n => { have[n.sessionId] = 1; });
  return completed().filter(s => !have[s.id]);
}
function pendingNotes(){ return pendingList().length; }

/* ═══════════════════ DERIVED READS (all from real note dates) ═══════════════════ */

/* A frequency read, not a trend line. Every number below is measured off the
   note dates themselves — nothing is modelled, projected, or scored. */
function cadence(dates){
  const d = dates.slice().sort();
  const n = d.length;
  if (n === 0) return { line: "No notes written yet — nothing to read a pattern from.", gap: null };
  if (n === 1) return {
    line: "1 session logged, on " + fmtDate(d[0]) + ". One note is not a pattern yet.",
    gap: null,
  };
  const span = daysBetween(d[0], d[n - 1]);
  const gap = span / (n - 1);
  let word;
  if (gap <= 4.5) word = "about twice a week";
  else if (gap <= 9) word = "roughly weekly";
  else if (gap <= 17) word = "roughly every two weeks";
  else word = "about every " + Math.round(gap) + " days";
  return { line: n + " sessions since " + fmtDate(d[0]) + ", " + word + ".", gap: gap };
}
function longestGap(dates){
  const d = dates.slice().sort();
  let worst = 0, pair = null;
  for (let i = 1; i < d.length; i++){
    const g = daysBetween(d[i - 1], d[i]);
    if (g > worst){ worst = g; pair = [d[i - 1], d[i]]; }
  }
  return { days: worst, pair: pair };
}

/* Athletes who have at least one completed session or one note. */
function athleteIds(){
  const out = [];
  completed().forEach(s => { if (out.indexOf(s.athleteId) < 0) out.push(s.athleteId); });
  notes().forEach(n => { if (out.indexOf(n.athleteId) < 0) out.push(n.athleteId); });
  return out;
}
function athleteName(id){
  const a = athleteById(id);
  if (a) return a.name;
  const n = notes().find(x => x.athleteId === id) || completed().find(x => x.athleteId === id);
  return n ? n.athlete : id;
}
function athleteProgramId(id){
  const a = athleteById(id);
  if (a) return a.programId;
  const n = notes().find(x => x.athleteId === id) || completed().find(x => x.athleteId === id);
  return n ? n.programId : (myListings()[0] || PROGRAMS[0]).id;
}
function notesFor(id){
  return notes().filter(n => n.athleteId === id).sort((a, b) => a.date.localeCompare(b.date));
}

/* Months an athlete has any real record in, newest first. */
function monthsFor(id){
  const ks = [];
  completed().filter(s => s.athleteId === id).forEach(s => {
    const k = monthKey(s.date); if (ks.indexOf(k) < 0) ks.push(k);
  });
  notesFor(id).forEach(n => { const k = monthKey(n.date); if (ks.indexOf(k) < 0) ks.push(k); });
  const cur = monthKey(TODAY);
  if (ks.indexOf(cur) < 0) ks.push(cur);
  return ks.sort().reverse();
}
function defaultMonth(id){
  const ns = notesFor(id);
  if (ns.length) return monthKey(ns[ns.length - 1].date);
  const ms = monthsFor(id);
  return ms[0] || monthKey(TODAY);
}

/* Compile one month for one athlete. Zero notes is a real, reportable answer. */
function compile(athleteId, month){
  const ns = notesFor(athleteId).filter(n => monthKey(n.date) === month);
  const attended = completed().filter(s => s.athleteId === athleteId && monthKey(s.date) === month).length;
  const skills = [];
  ns.forEach(n => (n.skills || []).forEach(s => { if (skills.indexOf(s) < 0) skills.push(s); }));
  const wins = ns.map(n => ({ date: n.date, text: n.win }));
  const focus = [];
  ns.slice().reverse().forEach(n => {
    const t = String(n.next || "").trim();
    if (t && focus.indexOf(t) < 0 && focus.length < 3) focus.push(t);
  });
  return {
    athleteId: athleteId, name: athleteName(athleteId), month: month,
    notes: ns, attended: attended, skills: skills, wins: wins, focus: focus,
  };
}
function reportFor(athleteId, month){
  return reports().find(r => r.athleteId === athleteId && r.month === month) || null;
}

/* ═══════════════════ SHARING INTO THE FAMILY THREAD ═══════════════════ */
/* One note or one report becomes exactly one message. Both paths refuse to
   run twice, so a re-click can never double-post into the family's thread. */
function threadFor(programId){
  if (!S.conversations) S.conversations = [];
  if (!S.messages) S.messages = {};
  let c = S.conversations.find(x => x.programId === programId) || S.conversations[0] || null;
  if (!c){
    c = {
      id: "conv_nt_" + Date.now(), with: SEED.providerProfile.businessName,
      programId: programId, last: "", at: isoNow(),
    };
    S.conversations = [c].concat(S.conversations);
  }
  if (!S.messages[c.id]) S.messages[c.id] = [];
  return c;
}
function post(programId, text){
  const c = threadFor(programId);
  S.messages[c.id] = S.messages[c.id].concat([{
    id: "m_nt_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    me: false, text: text, at: isoNow(),
  }]);
  c.last = text;
  c.at = isoNow();
  return c;
}
function noteMessage(n){
  const p = prog(n.programId);
  return "Session note — " + fmtDate(n.date) + (p ? " · " + p.title : "") +
    ". What we worked on: " + n.worked +
    " One win: " + n.win +
    " Next focus: " + n.next +
    ((n.skills && n.skills.length) ? " Skills worked: " + n.skills.join(", ") + "." : "");
}
function reportMessage(r){
  const parts = [
    "Progress report — " + firstName(r.name) + ", " + monthLabel(r.month) + ".",
    plural(r.attended, "session") + " attended, " + r.notes.length + " with a written note.",
  ];
  if (r.skills.length) parts.push("Skills worked: " + r.skills.join(", ") + ".");
  if (r.wins.length) parts.push("Wins: " + r.wins.map(w => fmtDate(w.date) + " — " + w.text).join(" | "));
  if (r.focus.length) parts.push("Focus for " + monthLabel(nextMonthKey(r.month)) + ": " + r.focus.join(" | "));
  return parts.join(" ");
}

/* Returns true only when a message was genuinely appended. */
function shareNote(noteId){
  const n = noteById(noteId);
  if (!n || n.shared) return false;
  post(n.programId, noteMessage(n));
  n.shared = true;
  n.sharedAt = isoNow();
  return true;
}
function sendReport(athleteId, month){
  if (reportFor(athleteId, month)) return false;
  const r = compile(athleteId, month);
  if (!r.notes.length) return false;              // nothing real to send
  post(athleteProgramId(athleteId), reportMessage(r));
  reports().push({
    id: "pr_" + athleteId + "_" + month,
    athleteId: athleteId, athlete: r.name, month: month,
    sessionsAttended: r.attended, notesWritten: r.notes.length,
    skills: r.skills.slice(), wins: r.wins.slice(), focus: r.focus.slice(),
    sentAt: isoNow(),
  });
  return true;
}

          ${(n.skills && n.skills.length) ? skillChips(n.skills, n.programId) : ""}
          <div class="nt-tlline"><span>Win</span>${esc(n.win)}</div>
          <div class="nt-tlline"><span>Next focus</span>${esc(n.next)}</div>
        </div>`).join("")}
      </div>` : `<div class="nt-blank">No notes yet, so there is no development record to show.</div>`}
    </div>`;
  }).join("");
}

/* ═══════════════════ MODALS ═══════════════════ */
const wrap = (title, body) =>
  `<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><b>${esc(title)}</b><button class="x" data-close="1" aria-label="Close">${ICON.x}</button></div>
    <div class="modal-body">${body}</div></div></div>`;

function writeNoteModal(){
  const m = S.modal || {};
  const existing = m.noteId ? noteById(m.noteId) : (m.bookingId ? noteForSession(m.bookingId) : null);
  const sess = sessionById(m.bookingId) ||
    (existing ? { id: existing.sessionId, athlete: existing.athlete, athleteId: existing.athleteId,
                  programId: existing.programId, date: existing.date } : null);
  if (!sess) return wrap("Session note",
    `<p style="color:var(--muted)">That session is no longer on your schedule, so there is nothing to write against.</p>`);

  const p = prog(sess.programId);
  const cands = skillsFor(sess.sport || sportOf(sess.programId));
  const chosen = existing ? (existing.skills || []) : [];
  const title = existing ? "Edit session note" : "Session note";

  return wrap(title, `
    <div class="panel" style="background:var(--raise);border:0;margin-bottom:18px">
      <b>${esc(firstName(sess.athlete))}</b>
      <span class="nt-sub"> · ${esc(sess.athlete)}</span>
      <div class="nt-sub" style="margin-top:4px">
        <span class="num">${esc(fmtDate(sess.date))}</span>${p ? " · " + esc(p.title) : ""}</div>
      <div style="margin-top:9px">${sportTag(sess.programId)}</div>
    </div>

    <div class="nt-warn hide" id="ntDraftWarn" role="status">
      <b>Nothing was recorded</b>
      No audio was captured and nothing was transcribed — this build has no speech capture wired up at all.
      The three fields below now hold a generic example so you have something to cut down. Every line in it is
      invented, not yours. Replace all three before you save; the form will not accept the example text.
    </div>

    <form id="ntNoteForm">
      ${FIELDS.map(([k, label, hint]) => {
        const v = existing ? existing[k] : "";
        return `<div class="field" style="margin-bottom:6px">
          <div class="nt-fieldhead">
            <label for="ntF-${k}">${esc(label)}</label>
            <span class="nt-count num" data-nt-count="${k}">${String(v).trim().length} / ${MAX}</span>
          </div>
          <textarea id="ntF-${k}" name="${k}" rows="3" data-nt-field="${k}"
            placeholder="${esc(hint)}">${esc(v)}</textarea>
        </div>
        <p class="nt-hint">${esc(hint)}</p>`;
      }).join("")}

      <div class="field" style="margin-bottom:8px">
        <label id="ntSkillsLabel">Skills worked (optional)</label>
        <div class="nt-chips" role="group" aria-labelledby="ntSkillsLabel" style="margin-top:2px">
          ${cands.map(s => `<button type="button" class="nt-pick" data-nt-skill="${esc(s)}"
            aria-pressed="${chosen.indexOf(s) >= 0}">${esc(s)}</button>`).join("")}
        </div>
      </div>
      <p class="nt-hint">Drawn from ${esc(sportOf(sess.programId) || "this sport")}. Tap what you actually
        covered — leaving them all off is fine.</p>

      <div id="ntNoteErr" class="err hide" style="margin-bottom:12px"></div>

      <button class="btn wide" type="submit">${existing ? "Save changes" : "Save note"}</button>
      <button class="btn ghost wide" type="button" id="ntVoice" style="margin-top:9px">Draft from voice memo</button>
      <p class="nt-hint" style="margin-top:9px;margin-bottom:0">The draft button does not record you. It fills
        the fields with a labelled example you must rewrite — Sporve has no transcription in this build.</p>
    </form>`);
}

function progressReportModal(){
  const m = S.modal || {};
  const id = m.athleteId;
  if (!id || athleteIds().indexOf(id) < 0) return wrap("Monthly report",
    `<p style="color:var(--muted)">That athlete is no longer on your roster.</p>`);

  const months = monthsFor(id);
  const month = (m.month && months.indexOf(m.month) >= 0) ? m.month : defaultMonth(id);
  const r = compile(id, month);
  const already = reportFor(id, month);
  const c = sportColor(sportOf(athleteProgramId(id)));

  const picker = `<div class="field">
      <label for="ntMonth">Month</label>
      <select id="ntMonth">${months.map(k =>
        `<option value="${esc(k)}" ${k === month ? "selected" : ""}>${esc(monthLabel(k))}</option>`).join("")}
      </select></div>`;

  if (!r.notes.length){
    return wrap("Monthly report", `
      <div class="panel" style="background:var(--raise);border:0;margin-bottom:18px">
        <b>${esc(r.name)}</b>
        <div class="nt-sub" style="margin-top:3px">${esc(monthLabel(month))}</div>
      </div>
      ${picker}
      <div class="nt-blank" style="text-align:left">
        <b style="display:block;color:var(--ink);margin-bottom:6px">No notes were written in ${esc(monthLabel(month))}.</b>
        ${r.attended > 0
          ? `There ${r.attended === 1 ? "was" : "were"} <span class="num">${r.attended}</span> completed
             session${r.attended === 1 ? "" : "s"} that month, but nothing was written against
             ${r.attended === 1 ? "it" : "them"}. A report built from zero notes would be a report about nothing,
             so there is nothing here to send. Write the notes first and this page fills itself in.`
          : `There were no completed sessions that month either, so there is nothing to report.`}
      </div>
      <p class="nt-hint" style="margin-top:14px;margin-bottom:0">Sporve will not compose a summary out of
        sessions it has no record of.</p>`);
  }

  return wrap("Monthly report", `
    <div class="panel" style="background:var(--raise);border:0;margin-bottom:18px">
      <b>${esc(r.name)}</b>
      <div class="nt-sub" style="margin-top:3px">${esc(monthLabel(month))} ·
        ${esc((prog(athleteProgramId(id)) || {}).title || "")}</div>
    </div>
    ${picker}

    <div class="nt-repline"><span>Sessions attended</span>
      <b class="num">${r.attended}</b></div>
    <div class="nt-repline"><span>Sessions with a written note</span>
      <b class="num">${r.notes.length}</b></div>
    <div class="nt-repline"><span>Distinct skills worked</span>
      <b class="num">${r.skills.length}</b></div>
    ${r.attended > r.notes.length ? `<p class="nt-hint" style="margin-top:10px">
      <span class="num">${r.attended - r.notes.length}</span> session${r.attended - r.notes.length === 1 ? "" : "s"}
      that month ${r.attended - r.notes.length === 1 ? "has" : "have"} no note, so nothing from
      ${r.attended - r.notes.length === 1 ? "it" : "them"} appears below.</p>` : ""}

    ${r.skills.length ? `<div style="margin-top:16px">
      <div class="nt-flabel">Skills worked</div>
      <div class="nt-chips">${r.skills.map(s =>
        `<span class="nt-chip" style="background:color-mix(in srgb,${c} 13%,transparent);color:${c}">${esc(s)}</span>`).join("")}
      </div></div>` : ""}

    <div style="margin-top:18px">
      <div class="nt-flabel">Wins this month</div>
      <ul class="nt-list">${r.wins.map(w =>
        `<li><b class="num">${esc(fmtDate(w.date))}</b>${esc(w.text)}</li>`).join("")}</ul>
    </div>

    <div style="margin-top:18px">
      <div class="nt-flabel">Focus for ${esc(monthLabel(nextMonthKey(month)))}</div>
      <ul class="nt-list">${r.focus.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <p class="nt-hint" style="margin-top:8px">Taken verbatim from the most recent next-focus lines you wrote —
        newest first, duplicates dropped. Nothing here was generated.</p>
    </div>

    <div style="margin-top:22px">
      ${already
        ? `<p class="nt-hint" style="margin:0">Sent to the family already. A month is only sent once, so there is
             nothing further to send here.</p>`
        : `<button class="btn wide" id="ntSendReport">${ICON.send} Send to ${esc(firstName(r.name))}'s family</button>
           <p class="nt-hint" style="margin-top:9px;margin-bottom:0">Sending posts this summary once into the
             family's message thread and files it under your progress reports.</p>`}
    </div>`);
}

/* ═══════════════════ WIRING ═══════════════════ */
function ensureCSS(){
  if (typeof document === "undefined" || document.getElementById("mod-notes-css")) return;
  const el = document.createElement("style");
  el.id = "mod-notes-css";
  el.textContent = CSS;
  document.head.appendChild(el);
}

/* Repaint the character counter in place. A full render() here would rebuild
   the modal and take the caret out of the textarea the coach is typing in. */
function paintCount(key){
  const ta = document.getElementById("ntF-" + key);
  const out = document.querySelector('[data-nt-count="' + key + '"]');
  if (!ta || !out) return;
  const n = ta.value.trim().length;
  out.textContent = n + " / " + MAX;
  out.classList.toggle("nt-bad", n > 0 && (n < MIN || n > MAX));
}
function pickedSkills(){
  const out = [];
  document.querySelectorAll('[data-nt-skill]').forEach(b => {
    if (b.getAttribute("aria-pressed") === "true") out.push(b.dataset.ntSkill);
  });
  return out;
}
/* Returns an error string, or null when the three fields are good. */
function validate(vals){
  for (let i = 0; i < FIELDS.length; i++){
    const k = FIELDS[i][0], label = FIELDS[i][1];
    const v = String(vals[k] == null ? "" : vals[k]).trim();
    if (isExample(v)) return "“" + label + "” still holds the example draft. That text is invented, not a " +
      "transcript of anything you said — rewrite it in your own words before saving.";
    if (v.length < MIN) return "“" + label + "” needs at least " + MIN + " characters.";
    if (v.length > MAX) return "“" + label + "” is " + v.length + " characters — keep it under " + MAX + ".";
  }
  return null;
}
/* Create or update. Returns the saved note. */
function saveNote(sess, vals, skills, noteId){
  const now = isoNow();
  const existing = noteId ? noteById(noteId) : noteForSession(sess.id);
  if (existing){
    existing.worked = String(vals.worked).trim();
    existing.win = String(vals.win).trim();
    existing.next = String(vals.next).trim();
    existing.skills = skills.slice();
    existing.updatedAt = now;
    return existing;
  }
  const n = {
    id: "nt_" + sess.athleteId + "_" + sess.date + "_" + Date.now(),
    sessionId: sess.id, athleteId: sess.athleteId, athlete: sess.athlete,
    programId: sess.programId, date: sess.date,
    worked: String(vals.worked).trim(), win: String(vals.win).trim(), next: String(vals.next).trim(),
    skills: skills.slice(), shared: false, sharedAt: null,
    createdAt: now, updatedAt: now,
  };
  notes().push(n);
  return n;
}

function wire(){
  ensureCSS();
  if (typeof document === "undefined") return;
  const q = s => document.querySelectorAll(s);

  /* ── workspace ─────────────────────────────────────────────────── */
  q("[data-nt-panel]").forEach(b => b.onclick = () => { ui.panel = b.dataset.ntPanel; render(); });
  const sel = document.getElementById("ntAthlete");
  if (sel) sel.onchange = () => { ui.athlete = sel.value; render(); };

  q("[data-nt-write]").forEach(b => b.onclick = () => {
    S.modal = { type: "writenote", bookingId: b.dataset.ntWrite };
    render();
  });
  q("[data-nt-edit]").forEach(b => b.onclick = () => {
    const n = noteById(b.dataset.ntEdit);
    if (!n) return;
    S.modal = { type: "writenote", bookingId: n.sessionId, noteId: n.id };
    render();
  });
  q("[data-nt-share]").forEach(b => b.onclick = () => {
    const n = noteById(b.dataset.ntShare);
    if (!n) return;
    if (!shareNote(n.id)){ toast("That note has already been shared"); return; }
    render();
    toast("Note shared with " + firstName(n.athlete) + "'s family");
  });
  q("[data-nt-report]").forEach(b => b.onclick = () => {
    const id = b.dataset.ntReport;
    S.modal = { type: "progressreport", athleteId: id, month: defaultMonth(id) };
    render();
  });

  /* ── write-note modal ─────────────────────────────────────────── */
  q("[data-nt-field]").forEach(ta => ta.oninput = () => paintCount(ta.dataset.ntField));
  q("[data-nt-skill]").forEach(b => b.onclick = () => {
    /* Toggled in place: a render() would rebuild the form and throw away
       whatever the coach has already typed but not yet saved. */
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });

  const voice = document.getElementById("ntVoice");
  if (voice) voice.onclick = () => {
    FIELDS.forEach(([k]) => {
      const ta = document.getElementById("ntF-" + k);
      if (ta){ ta.value = EXAMPLE[k]; paintCount(k); }
    });
    const warn = document.getElementById("ntDraftWarn");
    if (warn) warn.classList.remove("hide");
    const err = document.getElementById("ntNoteErr");
    if (err) err.classList.add("hide");
    toast("Example draft inserted — nothing was recorded");
  };

  const form = document.getElementById("ntNoteForm");
  if (form) form.onsubmit = ev => {
    ev.preventDefault();
    const m = S.modal || {};
    const existing = m.noteId ? noteById(m.noteId) : null;
    const sess = sessionById(m.bookingId) ||
      (existing ? { id: existing.sessionId, athlete: existing.athlete, athleteId: existing.athleteId,
                    programId: existing.programId, date: existing.date } : null);
    const err = document.getElementById("ntNoteErr");
    const show = msg => { if (err){ err.textContent = msg; err.classList.remove("hide"); } return false; };
    if (!sess) return show("That session is no longer on your schedule.");

    const d = {};
    FIELDS.forEach(([k]) => {
      const ta = document.getElementById("ntF-" + k);
      d[k] = ta ? ta.value : "";
    });
    const bad = validate(d);
    if (bad) return show(bad);

    const saved = saveNote(sess, d, pickedSkills(), m.noteId);
    S.modal = null;
    S.coachTab = "notes";
    ui.panel = existing ? ui.panel : "written";
    render();
    toast(existing
      ? "Note updated for " + firstName(saved.athlete)
      : "Note saved — " + firstName(saved.athlete) + ", " + fmtDate(saved.date));
    return true;
  };

  /* ── monthly report modal ─────────────────────────────────────── */
  const mo = document.getElementById("ntMonth");
  if (mo) mo.onchange = () => {
    S.modal = { type: "progressreport", athleteId: S.modal.athleteId, month: mo.value };
    render();
  };
  const send = document.getElementById("ntSendReport");
  if (send) send.onclick = () => {
    const m = S.modal || {};
    const month = m.month || defaultMonth(m.athleteId);
    if (!sendReport(m.athleteId, month)){ toast("Nothing to send for that month"); return; }
    const name = firstName(athleteName(m.athleteId));
    S.modal = null;
    render();
    toast(monthLabel(month) + " report sent to " + name + "'s family");
  };
}

/* ═══════════════════ EXPORT ═══════════════════ */
window.MOD_NOTES = {
  css: CSS,
  tabs: { notes: "Session notes" },
  views: { notes: notesView },
  modals: { writenote: writeNoteModal, progressreport: progressReportModal },
  wire: wire,
  state: { sessionNotes: seedNotes(), progressReports: [] },
  pendingNotes: pendingNotes,
};

})();

</script>
<script>
/* ---- mod-insights.js ---- */
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   MOD_INSIGHTS — demand, funnel, and client retention for the coach.

   One tab (Insights) plus three card renderers the coach dashboard can
   embed: demandCard(), watchlistCard(), availabilityWarnings().

   Host contract used (never redefined here):
     S, render(), toast(), esc(), money(), fmtDate(), slotsFor(),
     modelLabel(), PROGRAMS, SEED, sportColor(), sportGlyph(), ICON.

   HONESTY RULE THAT SHAPES THIS WHOLE FILE
   This is a pre-launch account. Nothing in the app measures search
   impressions or profile views, so those numbers cannot be real. They
   are seeded once, in state, and every surface that shows them carries
   a "Sample data" badge. Everything else — price positioning against
   the catalogue, open availability, rebooking cadence off real booking
   dates — is computed from state at render time and badged "Derived".
   The two are never mixed inside one sentence.

   The demo clock is pinned to the app's seeded "today" (2026-08-03) so
   gaps and week windows stay coherent with the seeded bookings instead
   of drifting against the real wall clock.
   ═══════════════════════════════════════════════════════════════════ */
(function(){

/* ── clock ───────────────────────────────────────────────────────── */
const TODAY = "2026-08-03";
const NOW = () => new Date(2026, 7, 3, 9, 30);          // Mon 3 Aug 2026, 9:30am
const iso = d => d.toISOString();

/* ── date helpers — plain "YYYY-MM-DD" arithmetic, no timezone drift ─ */
const dnum = s => {
  const parts = String(s).slice(0, 10).split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
};
const isDate = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || ""));
const daysBetween = (a, b) => Math.round((dnum(b) - dnum(a)) / 86400000);
const daysSince = s => daysBetween(s, TODAY);
function addDays(s, n){
  const d = dnum(s);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
    "-" + String(d.getDate()).padStart(2, "0");
}
const WEEKDAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const weekdayOf = s => dnum(s).getDay();

/* ── number helpers ──────────────────────────────────────────────── */
const n0 = n => Number(n).toLocaleString("en-US");
const pct1 = (a, b) => (b > 0 ? (a / b * 100) : 0).toFixed(1) + "%";
function median(list){
  const a = list.slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
const money2 = n => (Number(n) % 1 === 0 ? money(n) : "$" + Number(n).toFixed(2));

/* ── catalogue helpers ───────────────────────────────────────────── */
const prog = id => PROGRAMS.find(p => p.id === id) || null;
const myListings = () => PROGRAMS.filter(p => S.listings.indexOf(p.id) >= 0);
const mySports = () => {
  const out = [];
  myListings().forEach(p => { if (out.indexOf(p.sport) < 0) out.push(p.sport); });
  return out;
};
const firstName = s => String(s || "").trim().split(/\s+/)[0] || String(s || "");
function coachName(){
  const u = S.auth && S.auth.user;
  if (u && u.role === "provider" && u.firstName) return (u.firstName + " " + (u.lastName || "")).trim();
  return SEED.providerProfile.businessName;
}

/* ── phrasing ────────────────────────────────────────────────────── */
function gapPhrase(days){
  if (days < 1) return "less than a day";
  if (days === 1) return "1 day";
  if (days < 14) return days + " days";
  const w = Math.round(days / 7);
  return w + (w === 1 ? " week" : " weeks");
}
function cadenceShort(d){
  if (d == null) return null;
  if (d >= 6 && d <= 8) return "weekly";
  if (d >= 13 && d <= 15) return "every two weeks";
  if (d >= 27 && d <= 31) return "monthly";
  return "every " + d + " days";
}
function cadenceLong(d){
  if (d == null) return null;
  if (d >= 6 && d <= 8) return "about once a week";
  if (d >= 13 && d <= 15) return "about every two weeks";
  if (d >= 27 && d <= 31) return "about once a month";
  return "about every " + d + " days";
}

/* ═══════════════════ STATE ═══════════════════
   demand + funnel are seeded sample figures for a pre-launch account.
   watchlist holds only the seeded demo families; families with real
   bookings are derived from S.bookings at render time and merged in. */
const state = {
  demand: {
    /* Sample. Nothing in this app measures searches. */
    radiusMiles: 10,
    windowLabel: "the last 7 days",
    searches: { Basketball: 14, Soccer: 22, Tennis: 9, Volleyball: 6, Swimming: 11 },
    unmet: { weekday: 6, timeLabel: "9:00 – 11:00 AM", requests: 8 },
  },
  funnel: {
    /* Sample. A 30-day window for a comparable Miami coach, used to show
       the shape of the funnel — not a measurement of this account. */
    windowLabel: "a 30-day window",
    stages: [
      { key: "appearances", label: "Search appearances", n: 1240,
        note: "times a listing of yours appeared in a family's search results" },
      { key: "views",       label: "Profile views",      n: 186,
        note: "families who opened a listing after seeing it" },
      { key: "requests",    label: "Booking requests",   n: 24,
        note: "families who started checkout on a session" },
      { key: "completed",   label: "Completed bookings", n: 17,
        note: "requests that were paid and confirmed" },
    ],
  },
  watchlist: [
    { id: "in_wl_1", family: "Renata Okafor", athlete: "Nia Okafor",
      programId: "prog_3", lastSessionDate: "2026-07-13", typicalGapDays: 7, sessions: 9 },
    { id: "in_wl_2", family: "Daniel Whitfield", athlete: "Cole Whitfield",
      programId: "prog_2", lastSessionDate: "2026-06-29", typicalGapDays: 14, sessions: 6 },
    { id: "in_wl_3", family: "Priya Raman", athlete: "Aarav Raman",
      programId: "prog_5", lastSessionDate: "2026-07-06", typicalGapDays: 14, sessions: 11 },
    { id: "in_wl_4", family: "Marisol Ibarra", athlete: "Sofia Ibarra",
      programId: "prog_4", lastSessionDate: "2026-07-27", typicalGapDays: 7, sessions: 5 },
  ],
};
/* rows the coach has already reached out to, this session */
const checkedIn = {};

/* ═══════════════════ DERIVED — PRICE POSITIONING ═══════════════════
   Genuinely computable: every listing in PROGRAMS carries a price and a
   billing model. Comparing a monthly price against a per-session price
   would be a lie, so the peer set is same sport AND same billing model. */
function pricePosition(listing){
  const peers = PROGRAMS.filter(p => p.sport === listing.sport && p.model === listing.model);
  const others = peers.filter(p => p.id !== listing.id);
  const prices = peers.map(p => p.price);
  const min = Math.min.apply(null, prices);
  const max = Math.max.apply(null, prices);
  const med = median(prices);
  const dearer = others.filter(p => p.price > listing.price).length;
  const cheaper = others.filter(p => p.price < listing.price).length;

  let read;
  if (!others.length){
    read = "The only " + listing.sport.toLowerCase() + " listing priced " + modelLabel(listing.model) +
      " in the catalogue — there is no local range to sit inside yet.";
  } else if (listing.price <= min){
    read = "The lowest of " + peers.length + " comparable listings. " +
      dearer + " of " + others.length + " cost more.";
  } else if (listing.price >= max){
    read = "The highest of " + peers.length + " comparable listings. " +
      cheaper + " of " + others.length + " cost less.";
  } else if (listing.price === med){
    read = "Exactly at the median of " + peers.length + " comparable listings.";
  } else if (listing.price < med){
    read = "Below the median of " + peers.length + " comparable listings. " +
      dearer + " of " + others.length + " cost more.";
  } else {
    read = "Above the median of " + peers.length + " comparable listings. " +
      cheaper + " of " + others.length + " cost less.";
  }

  return {
    listing: listing, peers: peers.length, others: others.length,
    min: min, max: max, median: med, cheaper: cheaper, dearer: dearer,
    comparable: others.length > 0, read: read,
    /* marker position along the min→max track, in percent */
    at: max > min ? Math.max(0, Math.min(100, (listing.price - min) / (max - min) * 100)) : 50,
    medAt: max > min ? Math.max(0, Math.min(100, (med - min) / (max - min) * 100)) : 50,
  };
}
const myPricePositions = () => myListings().map(pricePosition);

/* ═══════════════════ DERIVED — AVAILABILITY ═══════════════════
   A slot is bookable only if it falls inside the window AND its program
   still has room. Both facts come from state. */
function openSlots(days){
  const from = TODAY, to = addDays(TODAY, days);
  const out = [];
  myListings().forEach(p => {
    if (p.enrolled >= p.cap) return;
    (slotsFor(p.id) || []).forEach(s => {
      if (isDate(s.date) && s.date >= from && s.date <= to) out.push({ p: p, s: s });
    });
  });
  return out.sort((a, b) => a.s.date.localeCompare(b.s.date));
}
function futureSlots(){
  const out = [];
  myListings().forEach(p => {
    (slotsFor(p.id) || []).forEach(s => {
      if (isDate(s.date) && s.date >= TODAY) out.push({ p: p, s: s });
    });
  });
  return out.sort((a, b) => a.s.date.localeCompare(b.s.date));
}
function lastSlotOverall(){
  let last = null;
  myListings().forEach(p => {
    (slotsFor(p.id) || []).forEach(s => {
      if (isDate(s.date) && (!last || s.date > last.s.date)) last = { p: p, s: s };
    });
  });
  return last;
}
/* how many of the coach's slots ever land on a given weekday (0=Sun) */
function slotsOnWeekday(wd){
  let n = 0;
  myListings().forEach(p => {
    (slotsFor(p.id) || []).forEach(s => { if (isDate(s.date) && weekdayOf(s.date) === wd) n++; });
  });
  return n;
}

function availabilityWarnings(){
  const out = [];
  const mine = myListings();
  const open = openSlots(7);
  const windowText = fmtDate(TODAY) + " and " + fmtDate(addDays(TODAY, 7));

  if (!mine.length){
    out.push({ level: "warn",
      text: "You have no published listings, so nothing of yours can appear in a family's search.",
      action: "Create a listing" });
    return out;
  }

  if (!open.length){
    const next = futureSlots()[0];
    const last = lastSlotOverall();
    let tail;
    if (next) tail = " Your next bookable session is " + fmtDate(next.s.date) + ", " +
      daysBetween(TODAY, next.s.date) + " days out.";
    else if (last) tail = " There is no future session on your calendar at all — the last one was " +
      fmtDate(last.s.date) + ".";
    else tail = " There is no session on your calendar at all.";
    out.push({ level: "warn",
      text: "No bookable session across your " + mine.length + " listing" + (mine.length === 1 ? "" : "s") +
        " between " + windowText + ". Parents searching for you see nothing bookable." + tail,
      action: "Open this week and add slots" });
  } else {
    const progs = [];
    open.forEach(o => { if (progs.indexOf(o.p.id) < 0) progs.push(o.p.id); });
    out.push({ level: "good",
      text: open.length + " bookable session" + (open.length === 1 ? "" : "s") + " across " +
        progs.length + " listing" + (progs.length === 1 ? "" : "s") + " between " + windowText +
        ". The earliest is " + fmtDate(open[0].s.date) + " at " + open[0].s.startTime + ".",
      action: "Review the week" });
  }

  /* Capacity — only raised when a listing is genuinely full. */
  const full = mine.filter(p => p.enrolled >= p.cap);
  if (full.length){
    out.push({ level: "warn",
      text: full.map(p => p.title).join(", ") + (full.length === 1 ? " is" : " are") +
        " at capacity, so every slot on " + (full.length === 1 ? "it" : "them") + " reads as unbookable.",
      action: "Raise the cap or open a waitlist" });
  }

  /* Retention — derived rows only. Sample families never raise an alert. */
  const lapsed = watchlistRows().filter(r => r.source === "booked" && r.broken);
  if (lapsed.length){
    out.push({ level: "warn",
      text: lapsed.length + " famil" + (lapsed.length === 1 ? "y has" : "ies have") +
        " not rebooked since " + fmtDate(lapsed[0].lastSessionDate) + " (" +
        gapPhrase(lapsed[0].gap) + " for " + firstName(lapsed[0].athlete) + ").",
      action: "Send a check-in" });
  }

  return out;
}

/* ═══════════════════ DERIVED — CLIENT WATCHLIST ═══════════════════ */

/* Parent name for an athlete who appears in real bookings. The athlete
   record carries an emergency contact — that is the family. */
function familyFor(athleteName){
  const a = (S.athletes || []).find(x =>
    ((x.firstName || "") + " " + (x.lastName || "")).trim() === String(athleteName).trim());
  if (a && a.emergency && a.emergency.name) return a.emergency.name;
  const u = S.auth && S.auth.user;
  if (u && u.role !== "provider" && u.firstName) return (u.firstName + " " + (u.lastName || "")).trim();
  const parts = String(athleteName).trim().split(/\s+/);
  return (parts.length > 1 ? parts[parts.length - 1] : parts[0]) + " family";
}

/* One row per athlete who has real bookings, cadence measured from the
   actual session dates. A single session yields no cadence — the row
   says so rather than inventing one. */
function bookedRows(){
  const byAthlete = {};
  (S.bookings || []).forEach(b => {
    if (!b || !isDate(b.date)) return;
    (byAthlete[b.athlete] = byAthlete[b.athlete] || []).push(b);
  });
  return Object.keys(byAthlete).map(name => {
    const list = byAthlete[name].slice().sort((a, b) => a.date.localeCompare(b.date));
    const dates = [];
    list.forEach(b => { if (dates.indexOf(b.date) < 0) dates.push(b.date); });
    const gaps = [];
    for (let i = 1; i < dates.length; i++) gaps.push(daysBetween(dates[i - 1], dates[i]));
    const typical = gaps.length ? Math.round(median(gaps)) : null;
    return {
      id: "in_bk_" + String(name).toLowerCase().replace(/[^a-z0-9]+/g, "_"),
      source: "booked",
      family: familyFor(name),
      athlete: name,
      programId: list[list.length - 1].programId,
      lastSessionDate: dates[dates.length - 1],
      typicalGapDays: typical,
      sessions: dates.length,
    };
  });
}

/* Cadence is "broken" at 1.5x the family's own usual gap. Where there is
   no usual gap to compare against, a single session older than 30 days
   is flagged as never-rebooked — a different claim, worded differently. */
function assess(row){
  const gap = daysSince(row.lastSessionDate);
  const typ = row.typicalGapDays;
  const ratio = typ ? gap / typ : null;
  let broken, statusLabel, statusTone, why;
  if (typ){
    broken = gap >= typ * 1.5;
    statusLabel = broken ? "Cadence broken" : "On cadence";
    statusTone = broken ? "warn" : "good";
    why = gapPhrase(gap) + " since last session, usually books " + cadenceShort(typ);
  } else if (gap >= 30){
    broken = true;
    statusLabel = "Never rebooked";
    statusTone = "warn";
    why = gapPhrase(gap) + " since the only session on record";
  } else {
    broken = false;
    statusLabel = "One session so far";
    statusTone = "slate";
    why = gapPhrase(gap) + " since the only session on record — too early to read a cadence";
  }
  return Object.assign({}, row, {
    gap: gap, ratio: ratio, broken: broken,
    statusLabel: statusLabel, statusTone: statusTone, why: why,
    score: ratio == null ? gap / 30 : ratio,
  });
}
function watchlistRows(){
  const sample = state.watchlist.map(r => Object.assign({ source: "sample" }, r));
  return sample.concat(bookedRows()).map(assess).sort((a, b) => b.score - a.score);
}
const rowById = id => watchlistRows().find(r => r.id === id) || null;

/* ═══════════════════ CHECK-IN DRAFT ═══════════════════
   Written from the row's own numbers. It never promises availability the
   calendar cannot back: a specific slot is named only when one exists. */
function draftCheckin(row){
  const p = prog(row.programId);
  const a = firstName(row.athlete), f = firstName(row.family);
  const open = openSlots(7);
  const lines = [];

  lines.push("Hi " + f + " — it's been " + gapPhrase(row.gap) + " since " + a + "'s last session" +
    (p ? " of " + p.title : "") + " on " + fmtDate(row.lastSessionDate) + ".");

  if (row.typicalGapDays){
    lines.push("You were booking " + cadenceLong(row.typicalGapDays) +
      " before that, so I wanted to check in rather than assume anything.");
  } else {
    lines.push("That is still the only session on the books, so I wanted to check in rather than assume anything.");
  }

  if (open.length){
    lines.push("If " + a + " wants back on the schedule, I have " + fmtDate(open[0].s.date) +
      " at " + open[0].s.startTime + " open and can hold it — just reply here.");
  } else {
    lines.push("If " + a + " wants back on the schedule, tell me which days work and I'll put a session on the calendar.");
  }

  lines.push("— " + coachName());
  return lines.join("\n\n");
}

/* Sending appends to the family's thread. Match an existing thread by
   name first, then by program, and only open a new one if neither hits. */
function threadFor(row){
  S.conversations = S.conversations || [];
  S.messages = S.messages || {};
  let c = S.conversations.find(x => x.with === row.family);
  if (!c) c = S.conversations.find(x => x.programId === row.programId);
  if (!c){
    c = { id: "conv_" + Date.now(), with: row.family, programId: row.programId,
      last: "", at: iso(NOW()) };
    S.conversations = [c].concat(S.conversations);
    S.messages[c.id] = [];
  }
  if (!S.messages[c.id]) S.messages[c.id] = [];
  return c;
}
function sendCheckin(row, text){
  const c = threadFor(row);
  const at = iso(NOW());
  /* me:false is the coach's side of the thread — the same convention the
     host inbox uses when it flips the bubble for the coach portal. */
  S.messages[c.id] = S.messages[c.id].concat([
    { id: "msg_in_" + Date.now(), me: false, text: text, at: at },
  ]);
  c.last = text.split("\n")[0];
  c.at = at;
  checkedIn[row.id] = at;
  return c;
}

/* ═══════════════════ WIRING ═══════════════════ */
function ensureCSS(){
  if (document.getElementById("mod-insights-css")) return;
  const el = document.createElement("style");
  el.id = "mod-insights-css";
  el.textContent = CSS;
  document.head.appendChild(el);
}

function wire(){
  ensureCSS();
  const q = s => document.querySelectorAll(s);

  q("[data-in-goto]").forEach(b => b.onclick = () => {
    S.coachTab = "insights";
    window.scrollTo(0, 0);
    render();
  });

  q("[data-in-checkin]").forEach(b => b.onclick = () => {
    S.modal = { type: "checkin", rowId: b.dataset.inCheckin };
    render();
  });

  /* The textarea is never re-rendered while it is being typed into —
     the draft is read once, on submit. */
  q("[data-in-restore]").forEach(b => b.onclick = () => {
    const r = rowById(S.modal && S.modal.rowId);
    const ta = document.getElementById("inDraft");
    if (!r || !ta) return;
    ta.value = draftCheckin(r);
    ta.focus();
  });

  const cf = document.getElementById("inCheckinForm");
  if (cf) cf.onsubmit = ev => {
    ev.preventDefault();
    const r = rowById(S.modal && S.modal.rowId);
    const err = document.getElementById("inCheckinErr");
    const ta = document.getElementById("inDraft");
    if (!r || !ta) { S.modal = null; render(); return; }
    const text = String(ta.value || "").trim();
    if (!text){
      if (err){ err.textContent = "The message is empty — write something before sending."; err.classList.remove("hide"); }
      return;
    }
    sendCheckin(r, text);
    S.modal = null;
    render();
    toast("Check-in sent to " + firstName(r.family));
  };
}

/* ---- mod-companies.js ---- */
/* ═══════════════════════════════════════════════════════════════════
   MOD_COMPANIES — the six sample businesses as first-class entities,
   plus offering-type-aware booking.

   Thesis: a team, a camp and a private trainer are three different
   commercial objects, not three variants of one booking.

     private → BOOK    · scarce = a slot on one coach's clock
     camp    → RESERVE · scarce = a seat in a fixed week
     team    → APPLY   · scarce = a spot on a roster

   The catalogue has no offering-type field — pricingModel (single_session
   / monthly / package) is doing double duty as billing cadence AND product
   kind, and does it badly. OFFERING below supplies the missing axis for all
   thirty listings, keyed to the ids in lib/core/mock/mock_data.dart.

   Contract: registers window.MOD_COMPANIES and never redefines a host
   symbol. Every class is co-prefixed. Reads PROGRAMS / S / sportColor /
   sportGlyph from the host, writes nothing outside its own state keys.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
"use strict";

/* ── local helpers (shadow nothing, depend on little) ─────────────── */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const sc  = s => (typeof sportColor === "function" ? sportColor(s) : "#475569");
const sg  = s => (typeof sportGlyph === "function" ? sportGlyph(s) : "🏅");
const H   = () => S;
const CAT = () => (typeof PROGRAMS !== "undefined" && PROGRAMS ? PROGRAMS : []);
const $$  = sel => Array.prototype.slice.call(document.querySelectorAll(sel));
const usd = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });

const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* ISO in, "Jun 7" out. Parsed as UTC so the label never slips a day by zone. */
function fmt(iso){
  const p = String(iso).split("-");
  return MONTH[Number(p[1]) - 1] + " " + Number(p[2]);
}
function fmtY(iso){ return fmt(iso) + ", " + String(iso).split("-")[0]; }
/* Calendar maths without a Date round-trip through local time. */
function shift(iso, days){
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

/* ═══════════════════ THE SIX BUSINESSES ═══════════════════
   Names, verification state and sport mix transcribed from
   mock_data.dart. Everglade and Sunset have NOT cleared background
   checks — they never render a trust badge, and their imagery is
   deliberately plainer so the photography agrees with the state. */
const COMPANIES = [
  {
    id:"apex", name:"Apex Performance Club", verified:true,
    tagline:"Elite training clinics for junior athletes",
    bio:"Dedicated sports academy providing elite training clinics for junior athletes. Five programmes across five sports, run out of a single campus in Coral Way.",
    hood:"Coral Way, Miami", founded:2016, coaches:14, seed:"apex",
    look:"Multi-sport, sunlit, premium — clean modern facility, branded kit, wide angle.",
  },
  {
    id:"coral", name:"Coral Reef Aquatics", verified:true,
    tagline:"Every way to be fast in water",
    bio:"Swim, dive, polo and surf under one roof — and one ocean break. Competitive squads share deck time with first-timers, which is the point.",
    hood:"Miami Beach", founded:2011, coaches:11, seed:"coral",
    look:"Water everywhere — lane lines, spray, sunrise pool decks, one ocean break. Cyan-dominant.",
  },
  {
    id:"hoops", name:"Downtown Hoops Academy", verified:true,
    tagline:"Hardwood, track and everything that moves",
    bio:"A basketball academy that grew into movement generally — speed work, indoor volleyball and a hip-hop programme now share the floor.",
    hood:"Downtown Miami", founded:2018, coaches:9, seed:"hoops",
    look:"Urban indoor — hardwood, gym lighting, painted city court, motion blur on movement.",
  },
  {
    id:"everglade", name:"Everglade Racquet Institute", verified:false,
    tagline:"Five racquets, one set of fundamentals",
    bio:"Tennis, pickleball, badminton, squash and table tennis taught as one family of skills. Small groups by design — no programme runs above twelve.",
    hood:"West Kendall", founded:2021, coaches:6, seed:"everglade",
    look:"Courts and geometry — hard-court blue, net lines, racquet detail. Precise, low motion.",
  },
  {
    id:"ironside", name:"Ironside Combat Gym", verified:true,
    tagline:"Discipline first, contact later",
    bio:"Boxing, wrestling, MMA, karate and judo for young athletes. Every programme starts non-contact and stays there until the coach says otherwise.",
    hood:"Little Haiti, Miami", founded:2014, coaches:10, seed:"ironside",
    look:"Low-key lighting, mats, wraps, gi texture. Discipline over aggression — these are minors.",
  },
  {
    id:"sunset", name:"Sunset Field Athletics", verified:false,
    tagline:"Open grass, five sports, golden hour",
    bio:"Baseball, softball, flag football, lacrosse and cricket on shared fields in South Miami. The widest age spread of any operator on Sporve.",
    hood:"South Miami", founded:2019, coaches:8, seed:"sunset",
    look:"Open grass at golden hour — long lenses, chalk lines, dust. Warm and wide.",

];
const COMPANY_BY_NAME = {};
COMPANIES.forEach(c => { COMPANY_BY_NAME[c.name] = c; });

/* ═══════════════════ THE MISSING AXIS ═══════════════════
   offering_type for all thirty listings. Independent of pricingModel:
   a camp can bill monthly, a private coach can sell a package.
     team    — season-long, competitive, roster, evaluated entry
     camp    — fixed dates, finite seats, no recurrence
     private — a coach's time, 1:1 or small group, repeatable  */
const OFFERING = {
  prog_1:"team",    prog_2:"camp",    prog_3:"private", prog_4:"private", prog_5:"camp",
  prog_6:"team",    prog_7:"private", prog_8:"team",    prog_9:"camp",    prog_10:"private",
  prog_11:"private",prog_12:"camp",   prog_13:"private",prog_14:"camp",   prog_15:"camp",
  prog_16:"private",prog_17:"camp",   prog_18:"private",prog_19:"camp",   prog_20:"private",
  prog_21:"team",   prog_22:"team",   prog_23:"private",prog_24:"team",   prog_25:"private",
  prog_26:"camp",   prog_27:"team",   prog_28:"camp",   prog_29:"camp",   prog_30:"team",
};
const typeOf = p => OFFERING[p && p.id] || "private";

const TYPE = {
  private:{ label:"Private training", verb:"Book",    cta:"Book session",
            unit:"A slot on one coach's clock",  short:"Private" },
  camp:   { label:"Camp",             verb:"Reserve", cta:"Reserve seat",
            unit:"A seat in a fixed week",       short:"Camp"    },
  team:   { label:"Team",             verb:"Apply",   cta:"Register for tryout",

};

/* ═══════════════════ IMAGE SYSTEM ═══════════════════
   Different counts AND different proportions per type. Placeholder seeds
   are deterministic so a real photograph can replace each one in place.
     private → 1 portrait 4:5   (you are buying a person's attention)
     camp    → 1 wide 16:9 + 6  (you are buying a place and a week)
     team    → 1 action 3:2 + 4 (you are buying an institution) */
const IMG_SPEC = {
  private:{ ratio:"4 / 5",  gallery:2, gRatio:"1 / 1", shots:["portrait","instruction","drill detail"] },
  camp:   { ratio:"16 / 9", gallery:6, gRatio:"3 / 2", shots:["facility wide","group activity","shade & lunch area","drop-off zone","equipment","end-of-day huddle"] },
  team:   { ratio:"3 / 2",  gallery:4, gRatio:"3 / 2", shots:["match action","squad photo","head coach","home venue"] },
};
function shot(seed, w, h){ return "https://picsum.photos/seed/" + encodeURIComponent(seed) + "/" + w + "/" + h; }

/* ── real assets, with a placeholder underneath ──────────────────────
   Drop a file at the documented path and it appears — no rebuild, no
   manifest, no build.py change. Until then the picsum seed stands in.

     assets/listings/<programId>-hero.jpg      e.g. prog_9-hero.jpg
     assets/listings/<programId>-g<n>.jpg      e.g. prog_9-g0.jpg … -g5.jpg
     assets/companies/<companyId>-hero.jpg     e.g. coral-hero.jpg

   The fallback is wired in wire() rather than an inline onerror, because
   an inline handler is exactly what a strict script-src blocks. */
const ASSET = {
  listing:(id, slot) => "assets/listings/" + id + "-" + slot + ".jpg",
  company:(id, slot) => "assets/companies/" + id + "-" + slot + ".jpg",
};
/* <img> that tries the real asset first and falls back on error. */
function imgTag(real, fallback, alt){
  return `<img src="${esc(real)}" data-cofb="${esc(fallback)}" alt="${esc(alt || "")}" loading="lazy">`;
}
function imagesFor(p){
  const spec = IMG_SPEC[typeOf(p)];
  const g = [];
  for(let i = 0; i < spec.gallery; i++){
    g.push({
      src:ASSET.listing(p.id, "g" + i),
      fallback:shot(p.id + "-g" + i, 600, 400),
      alt:(spec.shots[i] || "") + " — " + p.title,
    });
  }
  return {
    hero:ASSET.listing(p.id, "hero"),
    heroFallback:shot(p.id, 900, 700),
    ratio:spec.ratio, gRatio:spec.gRatio, gallery:g,
    /* what a photographer or generator needs to produce for this listing */
    brief:{ count:spec.gallery + 1, ratio:spec.ratio, shots:["hero"].concat(spec.shots.slice(0, spec.gallery)) },
  };
}

/* ═══════════════════ TYPE-SPECIFIC BOOKING DATA ═══════════════════ */

/* Private — the calendar is the product. Durations, packages, a window. */
function privateMeta(p){
  const base = Number(p.price) || 50;
  return {
    durations:[[30, .6],[45, .8],[60, 1],[90, 1.45]],
    packages:[[5, .95],[10, .9]],
    semiPrivate:.7,
    days:["Mon","Tue","Wed","Thu","Fri","Sat"],
    times:["7:00a","8:30a","3:30p","4:45p","6:00p"],
    leadHours:12,
    cancelHours:24,
    cancelPct:100,
    travelFee: p.id.charCodeAt(p.id.length - 1) % 2 ? 15 : 0,
    rate:base,
  };
}

/* Camp — one listing, MANY sessions. This one-to-many is the shape the
   flat listing model cannot express at all. */
function campSessions(p){
  const starts = ["2027-06-07","2027-06-14","2027-06-21"];
  const cap = Number(p.cap) || 16;
  const enrolled = Number(p.enrolled) || 0;
  return starts.map((s, i) => {
    const seats = Math.max(0, cap - enrolled - i * 2);
    return {
      id:p.id + "-s" + i,
      start:s, end:shift(s, 4),
      seats, cap,
      price:Number(p.price) || 60,
      earlyBird:i === 0,
    };
  });
}
function campMeta(p){
  return {
    sessions:campSessions(p),
    daily:[["8:30a","Drop-off opens"],["9:00a","Warm-up & skill blocks"],["11:30a","Small-sided games"],
           ["12:15p","Lunch & shade break"],["1:00p","Position work"],["2:45p","Cool-down"],["3:00p","Pickup"]],
    beforeCare:{ from:"7:30a", fee:45 },
    afterCare:{ to:"5:30p", fee:60 },
    bring:["Water bottle (labelled)","Sunscreen, applied before drop-off","Trainers plus a spare pair","Light snack"],
    lunch:"Bring your own — a shaded lunch area and cold water are provided.",
    ratio:"1 coach per 8 campers",
    depositPct:.3,
    weather:"Heat and lightning policy in force. Cancelled days are made up on the Friday of the same week.",
  };
}
/* The refund cliff, as dated rows rather than policy prose. Parents book
   camps months out; this is the single biggest hesitation. */
function refundRows(session){
  return [
    ["Full refund",      "through " + fmt(shift(session.start, -30)), "100%"],
    ["Partial refund",   fmt(shift(session.start, -29)) + " – " + fmt(shift(session.start, -14)), "50%"],
    ["No refund",        "from " + fmt(shift(session.start, -13)), "0%"],
  ];
}

/* Team — not a booking. Tryout, evaluation, roster offer, then money.
   The all-in season total leads; dues are a line item beneath it. */
function teamMeta(p){
  const dues = (Number(p.price) || 55) * 9;
  const kit = 165, tourn = 420, travel = 380, league = 95, ref = 110;
  return {
    tier:["Select","Travel","Premier","Academy"][p.id.length % 4],
    league:{ Soccer:"Florida State Premier League", Basketball:"AAU Gold Circuit", Swimming:"USA Swimming — Florida Gold Coast",
             "Water Polo":"USA Water Polo Junior Olympics", Boxing:"USA Boxing Youth", Wrestling:"Florida Scholastic Series",
             Karate:"USA Karate Junior League", Softball:"USSSA Fastpitch", Cricket:"USA Cricket Youth" }[p.sport] || "Regional Youth League",
    tryouts:[{ date:"2026-08-22", time:"9:00a – 12:00p" },{ date:"2026-08-29", time:"9:00a – 12:00p" }],
    tryoutDeadline:"2026-08-19",
    tryoutFee:35,
    rosterAnnounced:"2026-09-02",
    seasonStart:"2026-09-14", seasonEnd:"2027-03-21",
    practicesPerWeek:3,
    practiceDays:"Tue / Thu / Sat",
    games:22,
    travelScope:["Local","Regional","National"][p.id.length % 3],
    tournaments:4,
    rosterSize:Number(p.cap) || 16,
    spots:Math.max(1, (Number(p.cap) || 16) - (Number(p.enrolled) || 0)),
    positions:{ Soccer:["Goalkeeper","Centre-back"], Basketball:["Point guard"], Baseball:["Catcher","Left-handed pitcher"],
                Softball:["Pitcher"], Volleyball:["Setter"], Cricket:["Seam bowler"] }[p.sport] || [],
    costs:[["Season dues", dues, "Billed monthly over 9 months"],
           ["Uniform kit", kit, "Two jerseys, shorts, socks, training top"],
           ["Tournament fees", tourn, "Four tournaments, billed separately"],
           ["Travel estimate", travel, "Parent-borne — hotels and fuel"],
           ["League registration", league, "Once per season"],
           ["Referee fees", ref, "Split across the squad"]],
    aid:true,
    playingTime:"No guaranteed minutes. Selection is on form and attendance.",
  };
}
const teamTotal = m => m.costs.reduce((a, r) => a + r[1], 0);

/* ═══════════════════ ATHLETE, AGE GATE, CONSENT ═══════════════════
   The app pins "now" to 2026-08-03 (same constant MOD_PAYMENTS uses), so
   ages computed here agree with every other surface. */
const TODAY = "2026-08-03";
const PLATFORM_FEE = 0.09;   /* deducted from the coach, never added to the family */

function athletes(){
  const s = H();
  if(s.athletes && s.athletes.length) return s.athletes;
  return (typeof SEED !== "undefined" && SEED.athletes) || [];
}
function ageOn(dob, iso){
  if(!dob) return null;
  const b = String(dob).slice(0, 10).split("-").map(Number);
  const t = String(iso).slice(0, 10).split("-").map(Number);
  let a = t[0] - b[0];
  if(t[1] < b[1] || (t[1] === b[1] && t[2] < b[2])) a--;
  return a;
}
/* Which athlete, how old, and does the listing's own range admit them.
   Computed — never asserted as a string. */
function pickAthlete(p, m){
  const list = athletes();
  const sel = list.filter(a => a.id === (m || {}).athlete)[0] || list[0] || null;
  const age = sel ? ageOn(sel.dob, TODAY) : null;
  const fits = !sel ? false : (age == null ? true : age >= p.minAge && age <= p.maxAge);
  return { list:list, sel:sel, age:age, fits:fits };
}
function athleteBlock(p, m){
  const a = pickAthlete(p, m);
  if(!a.sel) return fg("Athlete", "", `<div class="co-note"><b>No athlete on this account.</b>
    Add a child profile from Profile first — creating one requires parental consent,
    which is captured with a version and a timestamp.</div>`);
  return fg("Athlete &amp; consent", "5 fields", `
    <div class="co-opts" style="margin-bottom:12px">
      ${a.list.map(x => {
        const ag = ageOn(x.dob, TODAY);
        return `<button class="co-opt ${a.sel.id === x.id ? "on" : ""}" data-coath="${esc(x.id)}">
          ${esc(x.firstName + " " + x.lastName)}${ag == null ? "" : " · " + ag}</button>`;
      }).join("")}
    </div>
    ${a.fits
      ? `<div class="co-note plain">${esc(a.sel.firstName)} is ${a.age} — inside this listing's ${p.minAge}–${p.maxAge} range.</div>`
      : `<div class="co-note"><b>Outside the age range.</b> ${esc(a.sel.firstName)} is ${a.age};
         this listing takes ${p.minAge}–${p.maxAge}. Booking is blocked.</div>`}
    <div class="co-checks" style="margin-top:14px">
      <label class="co-check"><input type="checkbox" data-cock="1">
        <span>Parental consent for a minor to train with this coach</span></label>
      <label class="co-check"><input type="checkbox" data-cock="1">
        <span>Medical conditions and emergency contact are current</span></label>
    </div>
    <div class="co-note plain">Photo and video consent is <b>not</b> collected here. It is held per
      athlete in the media library, where only a parent can change it — a coach can request it and
      never grant it. Asking again on this screen would imply a decision this sheet cannot record.</div>`);
}

/* ═══════════════════ ONE PRICE, ONE SOURCE ═══════════════════
   The sheet footer and the committed booking read the same quote, so what
   is displayed is by construction what is written. */
function quote(kind, p, m){
  m = m || {};
  if(kind === "camp"){
    const meta = campMeta(p);
    const sel = meta.sessions.filter(s => s.id === m.ses)[0] || meta.sessions[0];
    const care = m.care || {};
    const extras = (care.before ? meta.beforeCare.fee : 0) + (care.after ? meta.afterCare.fee : 0);
    const total = Math.round(sel.price * (sel.earlyBird ? .9 : 1) + extras);
    const due = Math.round(total * meta.depositPct);
    return { kind:kind, meta:meta, session:sel, total:total, due:due, balance:total - due };
  }
  if(kind === "team"){
    const meta = teamMeta(p);
    return { kind:kind, meta:meta, total:teamTotal(meta), due:meta.tryoutFee, balance:0 };
  }
  const meta = privateMeta(p);
  const dur = m.dur || 60;
  const mult = (meta.durations.filter(d => d[0] === dur)[0] || [60, 1])[1];
  const pack = m.pack || 1;
  const packMult = pack === 1 ? 1 : (meta.packages.filter(x => x[0] === pack)[0] || [1, 1])[1];
  const unit = Math.round(meta.rate * mult * packMult);
  const total = unit * pack + (m.travel ? meta.travelFee : 0);
  return { kind:kind, meta:meta, dur:dur, pack:pack, unit:unit, total:total, due:total, balance:0 };
}

/* ═══════════════════ COMMIT ═══════════════════
   Writes a real booking and a real ledger row. A confirmation that leaves
   no record is worse than no confirmation at all. */
function commit(kind, p, m){
  const h = H();
  const q = quote(kind, p, m);
  const a = pickAthlete(p, m);
  const n = ((h.bookings && h.bookings.length) || 0) + 1;
  const bookId = "book_co" + n, txId = "tx_co" + n;
  const cents = v => Math.round(v * 100);

  const rec = {
    id:bookId,
    athlete:a.sel ? a.sel.firstName + " " + a.sel.lastName : "",
    athleteId:a.sel ? a.sel.id : null,
    programId:p.id, program:p.title, offeringType:kind,
    createdAt:TODAY,
    price:q.due,
    totalCents:cents(q.total), dueCents:cents(q.due), balanceCents:cents(q.balance),
    /* the policy in force at purchase, captured now — a later change by the
       operator must not move this booking's refund terms */
    cancellationPolicy:p.cancellationPolicy || "moderate",
    policySnapshotAt:TODAY,
    /* versioned + timestamped, matching the child-profile consent path */
    consent:{ version:"v1", at:TODAY, kind:"booking_parental" },
  };

  if(kind === "team"){
    /* An application, not a purchase. The roster offer has not happened, so
       this is never "confirmed" and no season cost is charged. */
    rec.tryoutDate = m.tryout || q.meta.tryouts[0].date;
    rec.date = rec.tryoutDate;
    rec.session = "Tryout — " + fmt(rec.tryoutDate);
    rec.status = "applied";
    rec.paymentStatus = "tryout_fee_paid";
    rec.seasonCost = q.total;
  } else if(kind === "camp"){
    rec.date = q.session.start;
    rec.session = "Week of " + fmt(q.session.start) + "–" + fmt(q.session.end);
    rec.status = "confirmed";
    rec.paymentStatus = q.balance ? "deposit_paid" : "paid";
    rec.balanceDueBy = shift(q.session.start, -21);
    q.session.seats = Math.max(0, q.session.seats - 1);
  } else {
    rec.date = TODAY;
    rec.session = (m.day || "Tue") + " " + (m.slot || "4:45p") + " · " + q.dur + " min";
    rec.status = "confirmed";
    rec.paymentStatus = "paid";
    rec.sessions = q.pack;
  }

  if(!h.bookings) h.bookings = [];
  h.bookings.unshift(rec);

  /* keep MOD_PAYMENTS' ledger consistent: one row per movement, fee itemized */
  if(h.transactions){
    h.transactions.unshift({
      id:txId, at:TODAY,
      kind:kind === "team" ? "tryout_fee" : kind === "camp" ? "deposit" : "booking",
      bookingId:bookId, programId:p.id,
      desc:p.title + " · " + rec.session,
      grossCents:rec.dueCents,
      feeCents:Math.round(rec.dueCents * PLATFORM_FEE),
      totalCents:rec.dueCents,
    });
  }
  return rec;
}

/* ═══════════════════ VIEWS ═══════════════════ */

function progsOf(company){ return CAT().filter(p => p.biz === company.name); }
function sportsOf(company){ return Array.from(new Set(progsOf(company).map(p => p.sport))); }
function mixOf(company){
  const m = { private:0, camp:0, team:0 };
  progsOf(company).forEach(p => { m[typeOf(p)]++; });
  return m;
}

function trustLine(company){
  return company.verified
    ? `<span class="co-trust ok">${(typeof ICON !== "undefined" && ICON.shield) || "✓"} Background-checked staff</span>`
    : `<span class="co-trust no">Verification pending</span>`;
}

/* — index of all six — */
function companiesView(){
  const cards = COMPANIES.map(c => {
    const ps = progsOf(c), mix = mixOf(c), sports = sportsOf(c);
    const avg = ps.length ? (ps.reduce((a, p) => a + Number(p.rating || 0), 0) / ps.length).toFixed(1) : "—";
    return `<button class="co-card ${c.verified ? "" : "co-pending"}" data-company="${esc(c.id)}">
      <div class="co-shot">${imgTag(ASSET.company(c.id, "hero"), shot(c.seed + "-hero", 900, 600), c.name)}</div>
      <div class="co-body">
        <div class="co-nm">${esc(c.name)}</div>
        <div class="co-tag">${esc(c.tagline)}</div>
        <div class="co-mix">${sports.map(s => `<i class="co-dot" style="background:${sc(s)}" title="${esc(s)}"></i>`).join("")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
          ${["private","camp","team"].filter(t => mix[t]).map(t =>
            `<span class="co-badge ${t}">${mix[t]} ${esc(TYPE[t].short)}${mix[t] > 1 ? "s" : ""}</span>`).join("")}
        </div>
        <div class="co-stats">
          <span><b>${ps.length}</b> programmes</span>
          <span><b>${sports.length}</b> sports</span>
          <span><b>${avg}</b> avg rating</span>
        </div>
        <div style="margin-top:9px">${trustLine(c)}</div>
      </div></button>`;
  }).join("");

  return `<div class="shell">
    <div class="co-head">
      <h1>Six businesses in Miami</h1>

         never per business — an approved organisation vouches for nobody on its roster.</p>
    </div>
    <div class="co-grid">${cards}</div>
  </div>`;
}

/* — one company — */

/* ═══════════════════ BOOKING SHEET ═══════════════════

/* ═══════════════════ WIRE ═══════════════════
   Called by the host on every render, inside a try/catch. Everything here
   is defensive: if an anchor the host owns has moved, we bail rather than
   throw. Nothing in the host file is modified. */
function wire(){
  const h = H();

  /* offering-type rail, injected into explore the way MOD_SEARCH injects
     its toolbar — no host edit, and it self-heals if the anchor moves. */
  injectRail();

  /* Real asset first, placeholder underneath. Wired here rather than as an
     inline onerror, which a strict script-src would block. The complete/
     naturalWidth check catches images that already failed before this ran. */
  $$("img[data-cofb]").forEach(im => {
    const fb = im.dataset.cofb;
    if(!fb) return;
    const swap = () => { im.onerror = null; im.removeAttribute("data-cofb"); im.src = fb; };
    im.onerror = swap;
    if(im.complete && im.naturalWidth === 0) swap();
  });

  $$("[data-cotype]").forEach(b => b.onclick = () => {
    h.coType = b.dataset.cotype === h.coType ? null : b.dataset.cotype;
    render();
  });
  /* The rail is injected AFTER the host has wired [data-nav], so its own
     nav button would otherwise be dead. Wire it here. */
  $$("#coRail [data-nav]").forEach(b => b.onclick = () => {
    h.route = { name:b.dataset.nav, arg:null };
    window.scrollTo(0, 0);
    render();
  });
  $$("[data-company]").forEach(b => b.onclick = () => {
    h.companyId = b.dataset.company;
    h.route = { name:"company", arg:null };
    window.scrollTo(0, 0);
    render();
  });
  $$("[data-cobook]").forEach(b => b.onclick = () => {
    const id = b.dataset.cobook;
    const open = () => { h.modal = { type:"cobook", pid:id }; render(); };
    (typeof requireAuth === "function") ? requireAuth(open) : open();
  });

  /* sheet controls — each repaints through the host's render() */
  const set = (k, v) => { h.modal = Object.assign({}, h.modal, { [k]:v }); render(); };
  $$("[data-codur]").forEach(b => b.onclick = () => set("dur", Number(b.dataset.codur)));
  $$("[data-coday]").forEach(b => b.onclick = () => set("day", b.dataset.coday));
  $$("[data-coslot]").forEach(b => b.onclick = () => set("slot", b.dataset.coslot));
  $$("[data-copack]").forEach(b => b.onclick = () => set("pack", Number(b.dataset.copack)));
  $$("[data-cotravel]").forEach(b => b.onclick = () => set("travel", b.dataset.cotravel === "1"));
  $$("[data-coses]").forEach(b => b.onclick = () => set("ses", b.dataset.coses));
  $$("[data-cotry]").forEach(b => b.onclick = () => set("tryout", b.dataset.cotry));
  $$("[data-cocare]").forEach(b => b.onclick = () => {
    const cur = (h.modal && h.modal.care) || {};
    const k = b.dataset.cocare;
    set("care", Object.assign({}, cur, { [k]: !cur[k] }));
  });

  $$("[data-coath]").forEach(b => b.onclick = () => set("athlete", b.dataset.coath));

  $$("[data-coconfirm]").forEach(b => b.onclick = () => {
    const kind = b.dataset.coconfirm;
    const m = h.modal || {};
    const p = CAT().filter(x => x.id === m.pid)[0];
    if(!p) return;

    const sheet = b.closest(".modal");
    const missing = sheet && Array.prototype.slice.call(sheet.querySelectorAll('[data-cock="1"]'))
      .filter(c => !c.checked).length;
    if(missing){
      if(typeof toast === "function") toast("Please confirm the required items first");
      return;
    }
    const a = pickAthlete(p, m);
    if(!a.fits){
      if(typeof toast === "function") toast("That athlete is outside this listing's age range");
      return;
    }

    /* write the record BEFORE reporting it — the toast describes what the
       ledger now says, not what we hoped it would say */
    const rec = commit(kind, p, m);
    h.modal = null;
    render();

    if(typeof toast === "function"){
      toast(kind === "team"
          ? `Tryout registered for ${fmt(rec.tryoutDate)} · ${usd(rec.price)} fee charged`
          : kind === "camp"
          ? `Seat reserved · ${usd(rec.price)} deposit${rec.balanceCents ? ` · ${usd(rec.balanceCents / 100)} due by ${fmt(rec.balanceDueBy)}` : ""}`
          : `Session booked · ${usd(rec.price)} charged`);
    }
  });
}

function injectRail(){
  const h = H();
  if(h.route && h.route.name !== "explore") return;
  if(document.getElementById("coRail")) return;
  const grid = document.querySelector(".grid");
  if(!grid || !grid.parentElement) return;

  const counts = { private:0, camp:0, team:0 };
  CAT().forEach(p => { if(counts[typeOf(p)] != null) counts[typeOf(p)]++; });

  const rail = document.createElement("div");
  rail.id = "coRail";
  rail.className = "co-rail";
  rail.innerHTML = `<span class="co-lbl">What kind</span>
    ${["private","camp","team"].map(t => `<button class="co-tpill ${h.coType === t ? "on" : ""}" data-cotype="${t}">
      ${esc(TYPE[t].label)} <span class="co-n">${counts[t]}</span></button>`).join("")}
    <button class="co-tpill" data-nav="companies" style="margin-left:auto">Browse by business →</button>`;
  grid.parentElement.insertBefore(rail, grid);

  /* Filter the already-rendered grid rather than fighting the host's own
     visiblePrograms() — same approach MOD_SEARCH takes for sorting. */
  if(h.coType){
    Array.prototype.slice.call(grid.querySelectorAll(".card")).forEach(card => {
      const open = card.querySelector("[data-open]");
      const p = open && CAT().filter(x => x.id === open.dataset.open)[0];
      if(p && typeOf(p) !== h.coType) card.style.display = "none";
    });
  }
}

/* ═══════════════════ export ═══════════════════ */
window.MOD_COMPANIES = {
  css:CSS,
  views:{ companies:companiesView, company:companyView },
  modals:{ cobook:bookModal },
  wire:wire,
  state:{ companyId:null, coType:null },
  /* read by anything that needs the missing axis */
  typeOf:typeOf,
  imagesFor:imagesFor,
  OFFERING:OFFERING,
  /* booking internals, exposed so other modules (and tests) can reason about
     offering-type bookings without duplicating the pricing rules */
  quote:quote,
  commit:commit,
  pickAthlete:pickAthlete,
};

})();

</script>
